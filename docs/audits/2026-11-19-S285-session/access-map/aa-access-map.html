<style>
/* Layout: sticky tab rail over a single reading column; app tabs are matrix-first (pages × roles), then actions, then gaps. */
:root{

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px;display:grid;gap:22px}
h1{font:700 clamp(24px,3.4vw,32px)/1.2 var(--display);margin:0;text-wrap:balance}
h2{font:600 20px/1.3 var(--display);margin:0;text-wrap:balance}
h3{font:600 16px/1.35 var(--display);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.lede{max-width:70ch;color:var(--muted)}
code,.code{font:500 12.5px var(--mono)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding-block:8px}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font:600 14px var(--body);padding:7px 12px;border-radius:8px}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:18px}
.signin{background:var(--sunk);border-radius:10px;padding:12px 14px;display:grid;gap:4px;max-width:90ch}
.signin b{font-weight:600}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.role[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.role .code{color:var(--accent)}
.role .who{font-size:13px;color:var(--muted)}
.role .sum{font-size:13.5px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:var(--surface);font:600 12px var(--body);letter-spacing:.02em;color:var(--muted);white-space:nowrap}
tbody tr.area th{background:var(--sunk);font:600 13px var(--display);color:var(--fg)}
td.c,th.c{text-align:center;white-space:nowrap}
th.c.hl,td.c.hl{background:var(--accent-soft)}
.pill{display:inline-block;font:600 11.5px var(--body);border-radius:6px;padding:1px 7px;white-space:nowrap}
.p-write,.p-yes{background:var(--write-soft);color:var(--write)}
.p-read{background:var(--read-soft);color:var(--read)}
.p-approve{background:var(--approve-soft);color:var(--approve)}
.p-none,.p-no{color:var(--muted)}
.p-planned{background:var(--approve-soft);color:var(--approve)}
.p-today{background:var(--read-soft);color:var(--read)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);align-items:center}
.path{font:500 12px var(--mono);color:var(--muted);display:block}
.ev{font:400 11.5px var(--mono);color:var(--muted);word-break:break-all}
.two{font-size:12.5px;color:var(--approve)}
ul.gaps{margin:0;padding-left:20px;display:grid;gap:4px;max-width:90ch}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ovc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.ovc h3 a{color:inherit}
.faq{display:grid;gap:10px;max-width:90ch}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details summary{cursor:pointer;font:600 15px var(--display)}
details p{margin-top:8px;white-space:pre-line}
.filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter input,.filter select{font:14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

-191,595-599; apps/AA-CIS-App/api/routers/admin_pipeline/tour_detail.py:401-405"}, {"id": "D6", "app": "CIS + Booking", "what_changes": "Business owner: CIS admin + cờ owner (agent kiểm DB trước), bắt buộc TOTP cùng đợt MFA admin; Booking: Quản trị; CRM staff: không cần.", "issue": "AA-1111", "status": "planned", "evidence": "docs/audits/2026-11-17-S283-access-review/README.md:158,297; apps/AA-CIS-App/api/core/staff_authz.py:220-227"}, {"id": "D7", "app": "Content studio (code ở CIS)", "what_changes": "Facts Entries của đại lý chỉ còn loại booking_terms; dòng cũ loại khác giữ để đọc, không tạo mới, thôi đè dữ kiện AA.", "issue": "AA-1144 (thêm repo CIS)", "status": "planned", "evidence": "apps/AA-CIS-App/api/routers/v1_facts.py:1-22"}, {"id": "D8", "app": "Content studio (code ở CIS)", "what_changes": "Bản T2 của đại lý: đổi trường sự thật bị từ chối (fact_locked); câu chữ sửa tự do; audit mỗi lần sửa.", "issue": "AA-1144 (thêm repo CIS)", "status": "planned", "evidence": "apps/AA-CIS-App/api/routers/v1_tours.py:1275-1292"}, {"id": "D9", "app": "CRM đại lý", "what_changes": "Tên mục AA trong báo giá chỉ đọc; đại lý thêm được 1 dòng ghi chú cho khách.", "issue": "AA-1144", "status": "planned", "evidence": "apps/AA-Partner/api/app/proposals/builder.py:1465-1474"}, {"id": "D10", "app": "CIS", "what_changes": "Giá 'từ' trên trang Facts lấy từ Booking, không gõ tay; loại mùa chỉ admin và content_lead ghi; tenant_qa ghi các loại còn lại; sửa chú thích 'admin only' sai.", "issue": "AA-1144 hoặc issue CIS mới (gộp với D5)", "status": "planned", "evidence": "apps/AA-CIS-App/api/routers/admin_facts.py:17-18; apps/AA-CIS-App/api/core/staff_authz.py:587-589"}, {"id": "D11", "app": "CIS", "what_changes": "Thêm tài khoản thử A10f vai trò content_lead, chỉ Dev, chỉ duyệt được tour thử có đánh dấu riêng.", "issue": "AA-1146", "status": "planned", "evidence": "apps/AA-CIS-App/api/core/e2e_staff.py:85-88"}, {"id": "A1", "app": "Booking + Infra", "what_changes": "Khoá KMS riêng cho số tài khoản ngân hàng nhà cung cấp (~1 USD/tháng), chỉ Kế toán và Quản trị giải mã.", "issue": "AA-1150 (L7c)", "status": "planned", "evidence": "docs/audits/2026-11-19-S285-session/advisory-r3-pending-approvals.md:43-46"}, {"id": "A2", "app": "CIS", "what_changes": "Trần 10 USD/tháng trên Dev cho việc tự chạy lại T2 khi dữ kiện tour đổi, báo ở 80 %, sửa được trong admin; hết trần chỉ đánh dấu 'lỗi thời' và báo đại lý.", "issue": "AA-1146", "status": "planned", "evidence": "apps/AA-CIS-App/shared/llm_client/tenant_budget.py:3-38,168-170"}, {"id": "A3", "app": "CRM + Infra", "what_changes": "Tách khoá đăng nhập của console nhân viên AA (/staff) khỏi secret web dùng chung (0,40 USD/tháng).", "issue": "AA-1019", "status": "planned", "evidence": "infra/AA-CIS-Infra/modules/environment/crm_web.tf:175-180,299-307"}, {"id": "A4", "app": "CIS", "what_changes": "Đọc Cost Explorer 1 lần/ngày cho trang chi phí (0,30–0,60 USD/tháng).", "issue": "AA-1127, AA-1141", "status": "planned", "evidence": "docs/audits/2026-11-19-S285-session/advisory-r3-pending-approvals.md:58-62"}, {"id": "A5", "app": "Nền tảng", "what_changes": "Không dùng Route 53 health check; cron GitHub Actions kiểm DNS, TLS, /health (0 USD).", "issue": "AA-1142", "status": "planned", "evidence": "docs/audits/2026-11-19-S285-session/advisory-r3-pending-approvals.md:64-66"}, {"id": "A6", "app": "Nền tảng", "what_changes": "Dọn quyền và secret cũ theo access review S283 (F-04, F-08, F-09, F-12, F-13, F-20, F-24): DRY RUN → liệt kê → xoá trong một cửa sổ tắt auto mode.", "issue": "AA-878, AA-816, AA-911, AA-866 (theo từng mục F)", "status": "planned", "evidence": "docs/audits/2026-11-17-S283-access-review/README.md:295-315"}, {"id": "A7", "app": "Mọi app (Dev)", "what_changes": "Theo ghi chú: dữ liệu thử đang có giữ nguyên; chỉ áp cho dữ liệu mới (tên trung tính, lint chặn tên AA-n trong seed).", "issue": "AA-1127, AA-1128", "status": "planned", "evidence": "docs/audits/2026-11-19-S285-session/advisory-r3-pending-approvals.md:78-82"}, {"id": "A8", "app": "Nền tảng", "what_changes": "Đề xuất sửa Done-when của AA-1110 (e-mail cảnh báo thứ hai) bị từ chối: giữ nguyên AA-1110, không thêm kênh.", "issue": "AA-1110", "status": "not_approved", "evidence": "docs/audits/2026-11-19-S285-session/advisory-r3-pending-approvals.md:84-87"}, {"id": "A9", "app": "Backlog", "what_changes": "Gạch 18 mục cũ khỏi 'Waiting on Nghiệp' sau khi kiểm lại bằng chứng từng mục.", "issue": "không có (docs/backlog/README.md)", "status": "planned", "evidence": "docs/audits/2026-11-19-S285-session/advisory-r3-pending-approvals.md:142-162"}], "faq": [{"id": "A2", "q": "Trần chạy lại T2 trả bằng ngân sách AI của AA hay của đại lý? Nên làm sao?", "a": "Tiền thật luôn là của AA: AA trả hoá đơn cho AWS/Anthropic/OpenAI, đại lý không trả theo lượt. Nhưng trong code, mỗi lượt T2 được ghi vào sổ chi phí AI dưới tên đại lý (tenant_id) và tính vào 'hạn mức AI tháng' của đại lý, tức phần AI đi kèm gói của đại lý. Hết hạn mức thì việc T2 của đại lý đó dừng chờ. Việc tự chạy lại T2 khi AA đổi dữ kiện tour là do AA gây ra, không phải đại lý yêu cầu. Nếu để nguyên, đại lý bị trừ hạn mức vì thay đổi của AA, và khi họ hết hạn mức thì bản tour của họ không được cập nhật. Đề xuất: (1) các lượt chạy lại do AA đổi dữ kiện vẫn ghi tên đại lý (để biết tour nào, đại lý nào) nhưng gắn nhãn nguồn 'AA đổi dữ kiện' và KHÔNG trừ vào hạn mức của đại lý; (2) chúng trừ vào trần riêng 10 USD/tháng của AA (A2), nằm trong ngân sách connection AA đã đặt; (3) chỉ khi đại lý tự bấm viết lại thì mới trừ hạn mức của họ. Lane làm AA-1146 phải sửa chỗ kiểm hạn mức để phân biệt hai loại này, vì hôm nay mọi stage T đều trừ hạn mức đại lý.", "evidence": "apps/AA-CIS-App/shared/llm_client/tenant_budget.py:3-38,168-170; apps/AA-CIS-App/shared/cost_guard.py:657-688; apps/AA-CIS-App/api/services/tenant_ai_budget.py:1-15; apps/AA-CIS-App/api/services/llm_connections.py:78,314"}, {"id": "A3", "q": "Console nhân viên CRM là nhân viên AA hay nhân viên đại lý? Chung secret là chung cái gì, sao quan trọng?", "a": "Là nhân viên AA (nhóm crm-ops, crm-support), không phải nhân viên đại lý. Console này nằm ở đường /staff trên cùng web portal. mà đại lý dùng cho CRM và Content studio. Cả hai chạy trong cùng một dịch vụ web, đọc chung một secret tên crm/<env>/web. Secret đó chứa cùng lúc: khoá đăng nhập của đại lý, khoá ký cookie của đại lý, khoá đăng nhập của console nhân viên AA, khoá ký cookie nhân viên AA (và khoá của Academy). Vì sao quan trọng: khoá ký cookie nhân viên AA là thứ chứng minh 'người này là nhân viên AA'. Nếu một lỗi ở phần đại lý dùng làm lộ biến môi trường, kẻ tấn công lấy được cả khoá nhân viên, giả làm nhân viên AA và mở truy cập khẩn vào mọi đại lý. Tách secret (A3, 0,40 USD/tháng) giúp xoay khoá riêng, phân quyền đọc riêng và soát ai đọc. Nói thẳng: chừng nào console còn chạy chung một tiến trình với phần đại lý thì tách secret chỉ là bước đầu; cách ly thật là cho console chạy dịch vụ riêng. Đề xuất: làm A3 ngay, ghi việc tách dịch vụ console vào danh sách trước prod.", "evidence": "infra/AA-CIS-Infra/modules/environment/crm_web.tf:30-33,175-180,223,299-307; apps/AA-Partner/api/app/routers/staff.py:1-30,245"}, {"id": "A6", "q": "Dọn quyền và secret cũ: sẽ kiểm gì trước khi xoá?", "a": "Mỗi mục kiểm 2 lớp rồi mới xoá: (1) không còn chỗ nào dùng: tìm tên trong code và workflow của cả 6 repo, và xem lần đọc gần nhất trên AWS; (2) DRY RUN: đếm, liệt kê đúng thứ sẽ xoá, đưa anh xem. Cụ thể: 2 secret E2E cũ (F-09) kiểm không workflow nào trên main đọc; secret không ai đọc (F-12) kiểm lần đọc cuối và người dùng; môi trường GitHub thời Vercel (F-13) kiểm không còn secret, biến hay workflow nào trỏ tới; hash mật khẩu chết trong shared.admin_users (F-20) đếm số dòng, xác nhận API chỉ nhận đăng nhập Cognito; 9 dòng staff Booking cũ (F-24) đếm, kiểm chưa từng đăng nhập, chưa liên kết, ưu tiên đặt ngưng thay vì xoá; khoá CI bot và bộ E2E portal (F-08) chỉ chuyển chỗ, kiểm workflow vẫn chạy trên main; danh sách cho phép đọc secret của CIS (F-04) kiểm mọi secret CIS đang đọc đều nằm trong danh sách, Terraform plan chỉ đổi đúng chỗ đó. Secret AWS xoá theo kiểu có thời gian khôi phục (không xoá ngay), để lỡ sai thì lấy lại được. Lệnh xoá gom vào một cửa sổ tắt auto mode, sổ đăng ký secret cập nhật cùng lúc.", "evidence": "docs/audits/2026-11-17-S283-access-review/README.md:295-315; infra/AA-CIS-Infra/modules/environment/crm_web.tf:178"}, {"id": "A9", "q": "Gạch 18 mục khỏi danh sách chờ: kiểm kỹ thế nào?", "a": "Chỉ gạch khỏi mục 'Waiting on Nghiệp' trong backlog, không xoá gì khác; lịch sử còn trong git. Trước khi gạch, agent kiểm lại từng bằng chứng ở nguồn thật, không dựa vào ghi chú cũ: trạng thái issue Linear (ví dụ AA-1008 Done, AA-1021 Canceled), comment Jira đã đăng, PR đã merge và health trả đúng migration, trang quyết định đọc live. Mục nào bằng chứng không còn khớp thì giữ lại và báo anh.", "evidence": "docs/audits/2026-11-19-S285-session/advisory-r3-pending-approvals.md:142-162"}, {"id": "A7", "q": "Dọn dữ liệu thử: cái nào có rồi thì để; business owner đã là admin chưa?", "a": "Đúng ý anh: dữ liệu thử đang có giữ nguyên, không đổi tên, không xoá. Chỉ áp cho dữ liệu mới: tên trung tính, thêm lint chặn tên kiểu AA-n trong seed; ảnh và comment Jira dùng dữ liệu thử thì ghi rõ 'dữ liệu giả lập'. Về business owner (câu D6): bản rà quyền S283 ghi business owner đã ở nhóm cis-admin, chưa có vai trò Booking. D6 chỉ thêm phần còn thiếu: cờ owner ở CIS (agent kiểm DB trước khi đổi), vai trò Quản trị ở Booking, và bắt TOTP khi AA-1111 xong. Không đụng gì khác của chị.", "evidence": "docs/audits/2026-11-17-S283-access-review/README.md:158,297; apps/AA-CIS-App/api/core/staff_authz.py:220-227"}, {"id": "D1", "q": "Đã là admin đổi công tắc rồi thì người thứ hai là ai?", "a": "Là một admin khác, người thật khác: hôm nay CIS có hai admin thật là tech lead và business owner. Lý do: công tắc này là khoá kiểm soát. Nếu một admin tự tắt được thì người đó tự gỡ khoá rồi tự xuất bản, khoá không còn tác dụng. Cách chạy: BẬT công tắc (siết lại) thì admin đề xuất; TẮT khi đang bật thì phải có admin thứ hai duyệt, giống công tắc hai người của cài đặt hệ thống đang chạy. Trên Dev công tắc tắt nên không ai phải chờ. Khi bật ở prod: tech lead đề xuất, business owner duyệt (hoặc ngược lại).", "evidence": "apps/AA-CIS-App/api/services/settings_registry.py:456-462; apps/AA-CIS-App/api/migrations/407_platform_settings_registry.sql:404"}, {"id": "D3", "q": "Làm bản phân quyền rõ ràng hơn: vai trò nào được làm gì?", "a": "Bản tổng hợp này là câu trả lời: mỗi app có bảng 'ai vào, đăng nhập thế nào, mấy vai trò' (overview), danh sách mọi việc cần hai người (approvals), và tên dễ hiểu kèm việc làm của từng vai trò (recommend_role_names). Ngắn gọn: CIS = nhân viên AA làm nội dung, kiểm nội dung đại lý, chăm sóc đại lý, AI và tiền đại lý; Booking = bán hàng, sản phẩm & điều hành (nhà cung cấp, giá, điều hành), kế toán, quản trị; CRM = chủ, nhân viên bán, trợ lý của đại lý, cộng nhân viên AA hỗ trợ; TripPlanner = khách, không có nhân viên. Về D3: content chạy lại AI cho 1 tour, chạy lô chỉ content_lead và admin.", "evidence": "apps/AA-CIS-App/api/core/staff_authz.py:164-210; apps/AA-Booking/backend/app/auth/staff.py:102-189; apps/AA-Partner/api/app/permissions.py:155-225"}, {"id": "D4", "q": "Nhân viên content cần quyền gì? Admin/ops toàn quyền nhưng không sửa nội dung: chia thế nào?", "a": "Đề xuất chia gọn. Nhân viên content (CIS): đọc và sửa nội dung tour, khách sạn, hoạt động ở dạng nháp; tải tour lên; trả lại/bỏ qua bài trong Review Queue; upload, cắt, chọn ảnh bìa (photos.upload mới); chọn nhà cung cấp AA (chỉ đọc); xem giá (chỉ đọc); chạy lại AI cho 1 tour. Không: xuất bản khi công tắc bật, vòng đời tour, atom, đồng bộ Drive, chạy lô, sửa giá, đại lý, AI, cài đặt. Content_lead: mọi việc của content + xuất bản, vòng đời tour, atom, ảnh hàng loạt, wave, chạy lô, dữ kiện loại mùa; không sửa giá. Admin: người dùng, cài đặt, tiền, trần AI, đại lý. Admin có nên giữ quyền sửa nội dung? Đề xuất giữ nhưng chỉ làm đường dự phòng: menu admin không đưa trình sửa nội dung lên đầu, mỗi lần admin sửa nội dung phải ghi lý do và có audit, và khi công tắc hai người bật thì bản admin sửa vẫn cần content_lead xuất bản. Admin giữ quyền xuất bản để làm người duyệt thứ hai khi content_lead vắng. Bỏ hẳn quyền sửa của admin thì đội 2–3 người không ai sửa gấp được một tour sai. Booking cũng vậy: nhà cung cấp, dịch vụ, giá thuộc Sản phẩm & điều hành; Quản trị giữ quyền như người duyệt dự phòng của mọi bước hai người, không làm việc hằng ngày.", "evidence": "apps/AA-CIS-App/api/core/staff_authz.py:156,174-183,506-521,607-611; apps/AA-Booking/backend/app/auth/staff.py:114-157"}, {"id": "D5", "q": "Giá nhập và sửa ở CIS hay ở Booking?", "a": "Hôm nay có hai nơi. CIS: (1) chữ giá trong tour gốc (price_raw, lấy từ Excel) do content, content_lead, admin sửa được trong ô tour; (2) giá tham chiếu (nhập Excel hoặc sửa tay) do admin, content_lead và customer_success (nhóm 'Pricing team'); Booking đọc giá tham chiếu này qua view để gợi ý. Booking: giá net theo hợp đồng nhà cung cấp, bảng giá tay của tour, bàn làm giá (workbook, giá theo độ tuổi), quy tắc giá, tỷ giá, hạng đại lý, đều do Sản phẩm & điều hành nhập và người thứ hai duyệt; Booking công bố giá 'từ' cho CIS và TripPlanner đọc. Sau khi làm: mọi giá nhập và sửa ở Booking, người nhập là Sản phẩm & điều hành, người thứ hai duyệt. CIS chỉ hiện giá, không sửa: ô giá và tên nhà cung cấp trong tour gốc khoá lại (AA-1146), content và content_lead mất quyền sửa giá tham chiếu ngay, customer_success nhập tiếp chỉ tới khi tour có giá ở Booking (AA-1145, AA-1149) rồi trang thành chỉ đọc; giá 'từ' trên trang Facts lấy từ Booking (D10).", "evidence": "apps/AA-CIS-App/api/routers/admin_pipeline/tour_detail.py:401-405; apps/AA-CIS-App/api/core/staff_authz.py:174-191,593-599; apps/AA-Booking/backend/app/catalog/trip_plan_sync.py:23,82-85; apps/AA-CIS-App/api/routers/v1_tours.py:199-208; apps/AA-Booking/backend/app/routers/price_versions.py:125-212; apps/AA-Booking/backend/app/routers/catalog.py:394-719"}, {"id": "R1", "q": "Làm sẵn bước 2 (vai trò tuỳ chỉnh) ngay: cần gì, rủi ro gì, đề xuất?", "a": "Cần gì: hôm nay bộ quyền nằm trong code ở 3 app (CIS: staff_authz.py và bản sao ở frontend rbac.ts; Booking: staff.py; CRM: permissions.py), nhóm Cognito cố định trong Terraform. Bước 2 cần: mỗi app một bảng vai trò + quyền (migration của chính app đó, vì CIS không được ghi vào schema của Booking hay CRM); API đọc quyền từ bảng có cache; frontend lấy quyền từ /me thay vì bảng cứng; trang 'Vai trò & quyền' để nhân bản vai trò mẫu rồi tick; trang Staff gán vai trò tuỳ chỉnh, nhóm Cognito vẫn là nhóm của vai trò mẫu gốc nên không phải sửa Terraform mỗi lần. Ước lượng 2–3 phiên, mỗi app 2–3 PR, có migration nên cần review trước merge. Rủi ro: (1) tick ra một vai trò vừa duyệt vừa trả tiền; (2) quyền ở giao diện và API lệch nhau; (3) người sửa vai trò tự nâng quyền cho mình; (4) cache làm quyền cũ còn hiệu lực vài phút; (5) bài test chính sách route phải viết lại. Đề xuất: làm bước 1 + 2 cho CIS và Booking trước, CRM đại lý giữ 3 vai trò cố định tới khi có đại lý thật hỏi. Chặn cứng: chỉ nhân bản từ vai trò mẫu; danh sách cặp quyền cấm (duyệt hoá đơn + ghi khoản trả, nhập + duyệt số tài khoản, soạn + xuất bản khi công tắc bật); đổi vai trò cần admin thứ hai + audit; không ai sửa vai trò của chính mình; luật 'không tự duyệt' trong DB giữ nguyên dù tick thế nào.", "evidence": "apps/AA-CIS-App/api/core/staff_authz.py:164-210; apps/AA-CIS-App/frontend/lib/rbac.ts:340-377; apps/AA-Booking/backend/app/auth/staff.py:102-189; apps/AA-Partner/api/app/permissions.py:155-225; infra/AA-CIS-Infra/accounts/aa365/identity.tf:140-162; apps/AA-CIS-App/api/services/staff_directory.py:110-146"}, {"id": "R5", "q": "Nhiều bước cần người duyệt: ai tạo, ai duyệt?", "a": "Xem danh sách approvals: mỗi dòng ghi rõ người tạo, người duyệt, luật chặn và chuyện gì xảy ra khi chỉ có 1–2 người. Nguyên tắc chung: người duyệt luôn khác người tạo, kể cả admin, DB giữ luật này. Với nhà cung cấp mới (R5): Sản phẩm & điều hành hoặc Quản trị tạo, người còn lại trong hai vai trò đó kích hoạt. Đội 2 người: một người làm, người kia duyệt. Chỉ 1 người: tech lead dùng tài khoản admin của chính mình làm người thứ hai.", "evidence": "apps/AA-Booking/migrations/008_suppliers_contracts.sql:61; apps/AA-Booking/backend/app/suppliers/service.py:410"}, {"id": "R8", "q": "Sao lại ẩn hay gỡ vai trò content_creator ở Booking? Nhân viên content bị ảnh hưởng gì?", "a": "Hôm nay content_creator ở Booking chỉ được đọc danh mục tour, không làm được gì khác. Anh đã chốt nhân viên content chỉ làm ở CIS; những gì họ cần từ Booking (danh sách nhà cung cấp, dữ kiện khách sạn, giá 'từ') sẽ hiện chỉ đọc ngay trong CIS. Giữ vai trò này nghĩa là thêm một nhóm đăng nhập vào app có tiền mà không có việc gì để làm, và gây hiểu nhầm 'content được vào Booking'. Thay đổi với nhân viên content: không mất việc nào; họ không cần đăng nhập Booking nữa. Làm 2 bước để không ai bị lỗi đăng nhập: trước thôi cấp và gỡ nhóm cũ, khi đếm được 0 người ở cả 3 nơi mới xoá hẳn.", "evidence": "apps/AA-Booking/backend/app/auth/staff.py:72-83,119; apps/AA-CIS-App/api/services/staff_directory.py:118"}, {"id": "repo", "q": "Ai được quyền tạo repo?", "a": "Hôm nay chỉ 2 tài khoản tạo được repo trong tổ chức GitHub: tài khoản của tech lead và tài khoản GitHub dự phòng (cả hai là owner tổ chức). Tổ chức không có thành viên thường nào khác. Bot không tạo được: GitHub App aa-agent và ci-bot không có quyền quản trị tổ chức. Chỗ hở: phiên agent điều phối dùng token gh của tech lead (owner) nên về kỹ thuật vẫn tạo được repo; hook chỉ chặn lệnh tạo, xoá, sửa repo ở subagent, phiên chính chưa chặn. Bước B5 (bỏ quyền tạo repo của thành viên) không đổi gì cho 2 owner, chỉ chặn thành viên mới sau này; gói Free có thể khoá ô chặn tạo repo public (ADR 0021 ghi đã kiểm 08/11), bù lại bằng kiểm hằng ngày báo repo mới. Đề xuất: thêm luật hook chặn lệnh tạo, xoá, sửa repo cho cả phiên chính; tạo repo mới chỉ khi tech lead bảo.", "evidence": "docs/audits/2026-11-17-S283-access-review/README.md:48,50,307; docs/adr/0021-github-org-security-and-ci-hygiene.md:70-75; .claude/hooks/subagent-guardrails.d/00-generic.txt:19; docs/security/github-apps.md:76,89,169"}], "recommend_role_names": [{"app": "CIS", "code": "owner (cờ)", "plain_label_vi": "Chủ nền tảng", "plain_label_en": "Platform owner", "does": "Admin có thêm cờ owner: tạo nhân viên, gán vai trò cho cả 3 app. Luôn giữ ít nhất 1 owner.", "evidence": "apps/AA-CIS-App/api/core/staff_authz.py:220-227"}, {"app": "CIS", "code": "admin", "plain_label_vi": "Quản trị", "plain_label_en": "Administrator", "does": "Người dùng, cài đặt hệ thống, tiền, trần AI, đại lý; người duyệt dự phòng. Sửa nội dung chỉ khi cần gấp (đề xuất D4).", "evidence": "apps/AA-CIS-App/api/core/staff_authz.py:164-172"}, {"app": "CIS", "code": "content_lead", "plain_label_vi": "Trưởng nhóm nội dung", "plain_label_en": "Content lead", "does": "Quản lý danh mục AA: xuất bản, vòng đời tour, atom, ảnh hàng loạt, wave, chạy AI theo lô.", "evidence": "apps/AA-CIS-App/api/core/staff_authz.py:174-178"}, {"app": "CIS", "code": "content", "plain_label_vi": "Nhân viên nội dung", "plain_label_en": "Content editor", "does": "Tải tour, sửa nội dung ở dạng nháp, ảnh cho tour đang sửa, chạy lại AI cho 1 tour; xuất bản cần người thứ hai khi công tắc bật.", "evidence": "apps/AA-CIS-App/api/core/staff_authz.py:180"}, {"app": "CIS", "code": "tenant_qa", "plain_label_vi": "Kiểm nội dung đại lý", "plain_label_en": "Agency content reviewer", "does": "Sửa câu, gắn nhãn, thả hoặc gỡ bài của đại lý; dữ kiện và thẻ địa điểm.", "evidence": "apps/AA-CIS-App/api/core/staff_authz.py:182-183"}, {"app": "CIS", "code": "customer_success", "plain_label_vi": "Chăm sóc đại lý", "plain_label_en": "Agency success", "does": "Chăm sóc các đại lý trong sổ mình: cấu hình, thành viên, add-on, xem như đại lý; nhập giá tham chiếu tới khi Booking có giá.", "ev
