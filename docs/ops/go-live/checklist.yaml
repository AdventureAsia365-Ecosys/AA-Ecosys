# Go-live gate checklist (AA-1117, S294; two gate dates since S297). Prod opens to real users only when every gate
# line below is met; the first real agency data lands in any app only when every line bound to the pilot data date is.
#
# Read by tools/ops/golive_gate.py (workflow .github/workflows/golive-gate.yml: on a PR that changes this file or the
# tool, and weekly). Rendered into docs/ops/go-live/README.md with `python3 tools/ops/golive_gate.py render --write`.
#
# One line per gate item:
#   id        GL-NN, stable (never renumber a line; retire one by leaving a note in its title)
#   kind      gate (a condition) or date (one line per gate date: the go-live date and the pilot data date)
#   gate_date gate lines: the gate date the line must be met before, golive (the default) or pilot_data; a pilot_data
#             line is needed before the go-live date too. Date lines: which gate date the line records.
#   title     what must hold, in plain words
#   source    where the item comes from (ADR, audit finding, decision)
#   proof     repo paths (optionally #heading or #L<line>) or https URLs that PROVE the line is met; non-empty = met
#   refs      evidence so far or the method to follow; never counts as proof
#   owner     a role: tech lead, business owner or engineer on duty (company docs name roles, not people)
#   due       ISO date; required while the line has no proof; past due with no proof fails the guard
#   due_note  when in the build the line falls, in words
#   value     date lines only: an ISO date, or null while it is not set (it then needs an owner)
#
# Due dates are planning dates set on 2026-11-25 (re-dated 2026-11-28, S297) while neither gate date exists: the build
# items assume the go-live date is set in December (ADR 0012 decision 11: about three to four weeks of build before the
# date). When the business owner sets a gate date, re-date every open line bound to it to fall on or before it; the
# guard refuses an open line due after a set gate date it is bound to, and a pilot data date after the go-live date.
# Try dates first: python3 tools/ops/golive_gate.py check --golive YYYY-MM-DD --pilot-data YYYY-MM-DD
# Subset of YAML only (see the tool's docstring): quote any value that contains ": " or starts with a symbol.

