# Go-live gate checklist (AA-1117, S294). Prod opens to real users only when every gate line below is met.
#
# Read by tools/ops/golive_gate.py (workflow .github/workflows/golive-gate.yml: on a PR that changes this file or the
# tool, and weekly). Rendered into docs/ops/go-live/README.md with `python3 tools/ops/golive_gate.py render --write`.
#
# One line per gate item:
#   id        GL-NN, stable (never renumber a line; retire one by leaving a note in its title)
#   kind      gate (a condition) or date (the one go-live date line)
#   title     what must hold, in plain words
#   source    where the item comes from (ADR, audit finding, decision)
#   proof     repo paths (optionally #heading or #L<line>) or https URLs that PROVE the line is met; non-empty = met
#   refs      evidence so far or the method to follow; never counts as proof
#   owner     a role: tech lead, business owner or engineer on duty (company docs name roles, not people)
#   due       ISO date; required while the line has no proof; past due with no proof fails the guard
#   due_note  when in the build the line falls, in words
#   value     the go-live date line only: an ISO date, or null while it is not set (it then needs an owner)
#
# Due dates are planning dates set on 2026-11-25 while no go-live date exists: the build items assume the date is set
# in December (ADR 0012 decision 11: about three to four weeks of build before the date). When the business owner sets
# the date, re-date every open line to fall on or before it; the guard refuses an open line due after the date.
# Subset of YAML only (see the tool's docstring): quote any value that contains ": " or starts with a symbol.

