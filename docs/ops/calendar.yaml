# Ops calendar (AA-1184, S297): the ONE source for dated and recurring ops duties of the ecosystem.
#
# Read by tools/ops/ops_calendar.py: `check` (workflow .github/workflows/ops-calendar.yml, on a pull request that
# changes the calendar and on Mondays), `status` (the session-start block), `render --write` (the table in
# docs/ops/calendar.md) and `ics --write` (docs/ops/calendar.ics, the phone subscription). The daily compliance
# collector (tools/compliance/collect.py) publishes the check `ops_calendar_overdue`: red on CIS Platform > Compliance
# readiness the day a line passes its due date, green again once it is done or re-dated (Calendar tab).
#
# Public repo: generic titles only. No account ID, ARN, e-mail address, secret name or person name; owners are roles.
# Titles and notes show on the CIS Calendar tab, so they never carry an issue id (put it in `source`).
#
# One line per duty:
#   id           OC-NNN, stable (never renumber; retire a done line by setting `done`, delete it only at a yearly tidy)
#   kind         recurring  a duty on a cadence; `evidence` dates the last run
#                deadline   a duty due on `date` (or open from `window_from` with no due date); `done` closes it;
#                           `dates_from` reads the dates from another register instead of copying them
#                trigger    a duty due `within_days` after an event; `trigger_date` is filled when the event happens
#                automated  a scheduled job or workflow that runs by itself and has its own alarm (listed, never due)
#   title        plain words (max 100 characters)
#   owner        a role: tech lead | business owner | engineer on duty | agent
#   source       the decision, issue or document behind the line (not shown on the CIS tab)
#   cadence      recurring: weekly | monthly | quarterly | yearly | "every N days"; automated: free text
#   anchor       recurring: the first slot of the series (ISO date); the .ics repeats from it, and it is the due date
#                while `evidence` has no record yet
#   evidence     recurring: a repo glob whose newest match dates the last run (the first YYYY-MM-DD in the path),
#                `check:<compliance check id>` (CIS grades it; the tab shows that check's state) or `none` (a
#                reminder only, never overdue); deadline: an optional proof path
#   date         deadline: ISO due date;  window_from: ISO date the duty opens ("not before")
#   done         deadline / trigger: ISO date it was done (the line then stays green)
#   trigger      trigger: the event in words;  trigger_date: ISO date of the event, once it happened
#   within_days  trigger: days after trigger_date the duty is due
#   warn_days    days before the due date that turn the line amber (required on every line that can be overdue)
#   dates_from   deadline: secrets-register (rotation next_due / expires of every live row, AA-1183),
#                go-live-checklist (due dates of the open go-live gate lines, AA-1117) or vuln-exceptions (expiry of
#                every vulnerability exception); the line is due on the earliest date and overdue when any date passed
#   reminder     auto (the compliance check turns red by itself) | session (the session-start block lists it) | none
#   note         one short line of context (shown on the tab)
#
# Subset of YAML only (tools/ops/golive_gate.py parser): quote any value that contains ": " or starts with a symbol.

