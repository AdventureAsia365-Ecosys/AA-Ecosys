# Docs <-> code map (AA-1132 A4; tech lead S283: one central map in the root). tools/docs/doc_impact.py reads it.
#
# Each entry: when a pull request in `repo` changes a file matching one of `code` (globs; `**` crosses folders) and
# touches none of `pages`, the Docs impact check posts a warning on the PR listing the pages to check. It never fails
# a PR (warn only, S283). A page is a path in this root repo, or `<repo>:<path>` for a page in that app repo (a PR there
# can update it in the same PR; a root page needs a root PR, named in the PR body as `Docs-impact: <root PR link>`, or
# `Docs-impact: none: <reason>` when nothing in the pages changes).
#
# `source: audit-s283` entries were seeded once (S284) from the code paths the S283 docs audit cited as evidence for a
# stale sentence (docs/audits/2026-11-17-S283-docs-audit/rows.json): a historical migration file became its topic glob
# (`*_<word>_*.sql`), ADR and template pages were left out (dated records), and three globs that matched nearly every
# PR of a repo were dropped. `source: hand` entries carry the cross-repo facts of the audit's eight drift groups.
# Edit this file by hand from now on; the docs lint validates its shape and that every root page exists.
#
# Ids are stable (the S284 hooks spec advisory, slice 2, and lane notes cite them); never reuse a removed id.
version: 1
repos: [AA-Ecosys, AA-CIS-App, AA-Booking, AA-Partner, AA-TripPlanner-Web, AA-CIS-Infra]
