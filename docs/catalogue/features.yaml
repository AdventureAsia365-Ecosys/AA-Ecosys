    summary_vi: "Mỗi thẻ ngày liệt kê các hoạt động tuỳ chọn bán tại địa điểm của ngày đó, nơi nghỉ đêm đứng đầu; khách đánh dấu những hoạt động muốn đi và lựa chọn đi kèm chuyến đi gửi cho đại lý. Trên trang lên lịch trình của đại lý, mỗi add-on hiện giá từ đã làm tròn của chính đại lý, kèm ghi chú giá cuối cùng theo báo giá của đại lý, khi đại lý bật hiển thị giá; trang lên lịch trình của Adventure Asia không hiện giá add-on."
    summary: Each day card lists the optional activities sold at that day's places, the overnight place first; the traveller ticks the ones they want and the picks travel with the trip sent to the agency. On an agency's planner an add-on shows the agency's own rounded from price, with a note that the agency's quote is final, while the agency publishes prices; Adventure Asia's own planner shows no add-on price.
    roles: [public, traveller]
    status: live
    surface: ["route:bff/trip", "route:lambda/assembly"]
    conditions:
      settings: [tripplanner.prices.agency_stale_hours]
    depends_on: [BK-F020]
    proven:
      date: 2026-11-24
      evidence: docs/audits/2026-11-24-S290-session/live/closeouts/evidence.md
    owner: tech_lead
  - id: TP-F011
    app: tripplanner
    module: agency-planner
    name: Agency planner on its own domain
    name_vi: Công cụ lên lịch trình của đại lý trên tên miền riêng
    summary_vi: "Đại lý có thể đặt công cụ lên lịch trình trên địa chỉ web riêng, ví dụ trip.agency-domain.com, qua HTTPS; địa chỉ đó mở trang lên lịch trình mang thương hiệu đại lý và các trang pháp lý của chính đại lý, đường dẫn khác là trang không tìm thấy, và khi gỡ tên miền thì quay về đường dẫn của đại lý trên host của chúng ta."
    summary: An agency can serve its planner on its own web address, such as trip.agency-domain.com, over HTTPS; the address opens the agency's branded planner and its own legal pages, any other path is a plain not-found page, and removing the domain falls back to the agency's path on our host.
    roles: [public, traveller]
    status: live
    surface: ["route:lambda/browse"]
    conditions:
      entitlements: [tp.hosted, tp.custom_domain]
      tenant_kinds: [pilot, agency]
      note: Staff add the domain on the agency's Tenant 360 page in CIS, which shows the DNS records to create; the certificate and the edge alias are created by a CIS job.
    depends_on: [CIS-F018]
    proven:
      date: 2026-11-15
      evidence: docs/audits/2026-11-15-S281-session/state-snapshot.md
    owner: tech_lead
  - id: TP-F012
    app: tripplanner
    module: agency-planner
    name: Planner management API for the agency app
    name_vi: API quản lý công cụ lên lịch trình cho ứng dụng đại lý
    summary_vi: "API máy mà ứng dụng đại lý gọi cho công cụ lên lịch trình của một đại lý, dùng cho cả CRM và Content studio: các lead mới nhất kèm trạng thái gửi (không bao giờ có thông tin khách), mức dùng phiên AI và lead, khoá ký webhook kèm xoay khoá (khoá mới chỉ hiện một lần), và nhận giá từ riêng của đại lý."
    summary: The machine API the agency app calls for an agency's planner, for both the CRM and the Content studio - the newest leads with their delivery status (never a traveller's details), AI sessions and lead usage, the webhook signing key with rotation (the new key shown once), and receiving the agency's own from prices.
    roles: [machine]
    status: live
    surface: ["route:lambda/assembly"]
    conditions:
