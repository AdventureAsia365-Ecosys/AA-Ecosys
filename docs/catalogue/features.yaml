  # ── Planned (AA-1118): work the plan holds but no app does yet; status planned, a plan.json milestone, no surface ──
  # The milestone is the slot of the open issue in docs/backlog/tracker/plan.json (CIS-F054 AA-704, CIS-F055 AA-1154,
  # CIS-F056 AA-1142, CRM-F048 AA-1011, INF-F007 AA-1004 / AA-980). Move a row to live with its surface when it ships.
  - id: CIS-F054
    app: cis
    module: assistant
    name: In-app assistant for staff and agencies
    name_vi: Trợ lý trong ứng dụng cho nhân viên và đại lý
    summary_vi: "Trợ lý trả lời câu hỏi về hệ thống và về dữ liệu của chính người hỏi, ngay trong trang quản trị và Content studio."
    summary: An assistant inside the admin and the Content studio that answers questions about the system and about the asker's own data.
    roles: [admin, content, owner, agent]
    status: planned
    milestone: parked
    owner: tech_lead
  - id: CIS-F055
    app: cis
    module: ops-assistant
    name: Operations assistant in the admin
    name_vi: Trợ lý vận hành trong trang quản trị
    summary_vi: "Trên trang Trạng thái hệ sinh thái, mỗi việc cần xem có bằng chứng, bản tóm tắt dễ hiểu và các thẻ hành động xếp hạng (bước làm, mức rủi ro, ai duyệt, kết quả dự đoán) do luật dựng sẵn, không tốn phí; AI có thể xếp hạng và giải thích các thẻ, trả lời có gì thay đổi trong một khoảng thời gian, và tự phân tích các sự cố đang mở ở những mức độ đã chọn. Trợ lý không tự chạy gì: con người chạy bước đó rồi đánh dấu thẻ đã làm, trang kiểm kết quả sau số phút đã đặt (mặc định 10 và 30 phút) và hiện tỉ lệ đúng; chủ doanh nghiệp chỉ thấy bản tóm tắt."
    summary: On the Ecosystem status page every item that needs attention gets its evidence, a plain-words summary and ranked action cards (the step, its risk, who approves it, the predicted outcome) built by rules at no cost; the AI can rank and explain the cards and say what changed in a time window, and open incidents of the chosen severities are analysed automatically. The assistant runs nothing - a person runs the step and marks the card done, the page checks the result at set minutes afterwards (10 and 30 by default) and shows the hit rate; the business owner sees the summary only.
    roles: [admin]
    status: beta
    surface: ["page:/admin/overview", "route:admin_ops_assist"]
    conditions:
      settings: [cis.ops.assist_auto_incident_gap_min, cis.ops.assist_auto_severities, cis.ops.assist_build_timeout_s, cis.ops.assist_card_ttl_min, cis.ops.assist_changes_window_min, cis.ops.assist_check_after_min, cis.ops.assist_deep_model, cis.ops.assist_digest_days, cis.ops.assist_evidence_window_min, cis.ops.assist_history_min_n, cis.ops.assist_lookup_windows_min, cis.ops.assist_reason_min_chars, cis.ops.assist_refused_trigger_calls, cis.ops.assist_small_money_usd, cis.ops.assist_spend_baseline_days, cis.ops.assist_spend_spike_factor, cis.ops.assist_spend_spike_floor_usd_h, cis.ops.assist_throttled_trigger_calls, cis.ops.assist_wide_scope_stages]
      connections: [anthropic-direct]
      note: The AI ranking is one paid call through the assistant's AI gateway stage, under its own monthly hard cap; the rule-made cards and the outcome checks cost nothing.
    depends_on: [CIS-F025]
    owner: tech_lead
  - id: CIS-F056
    app: cis
    module: overview
    name: Service levels, error budgets and incident records
    name_vi: Mức dịch vụ, ngân sách lỗi và hồ sơ sự cố
    summary_vi: "Trên trang Trạng thái hệ sinh thái: mục tiêu mức dịch vụ cho từng ứng dụng kèm cảnh báo tiêu ngân sách lỗi nhanh và chậm, hồ sơ sự cố (khai báo từ một cảnh báo hoặc bằng tay, mức độ, người phụ trách, dòng thời gian, bản nháp bài học), kiểm tra từ bên ngoài các host công khai (DNS, TLS, hạn chứng chỉ, health) do worker chạy mặc định 15 phút một lần, và góc nhìn theo từng đại lý về chi phí AI, lỗi AI, job lỗi và lỗi máy chủ."
    summary: On the Ecosystem status page - a service-level objective per app with fast and slow error-budget burn alerts, the incident record (declared from an alert or by hand, severity, owner, timeline, lesson draft), external checks of the public hosts (DNS, TLS, certificate expiry, health) run by the worker every 15 minutes by default, and a per-agency view of AI spend, AI errors, failed jobs and server errors.
    roles: [admin]
    status: live
    surface: ["page:/admin/overview", "route:admin_ops_status_p2"]
    conditions:
      settings: [cis.ops.status_slo_target_pct, cis.ops.status_slo_window_days, cis.ops.status_slo_budget_warn_pct, cis.ops.status_burn_fast_factor, cis.ops.status_burn_fast_window_min, cis.ops.status_burn_slow_factor, cis.ops.status_burn_slow_window_hours, cis.ops.status_cert_warn_days, cis.ops.status_cert_crit_days, cis.ops.status_incident_lookback_min, cis.ops.status_tenant_top_n, cis.ops.external_check_interval_min, cis.ops.external_check_sources, cis.ops.external_check_targets, cis.ops.external_check_timeout_s]
      note: Declaring or updating an incident needs the ops write capability; the business owner reads only.
    proven:
      date: 2026-11-25
      evidence: docs/audits/2026-11-25-S292-session/live/aa1142-slo-desktop-light.png
    owner: tech_lead
  - id: CIS-F057
