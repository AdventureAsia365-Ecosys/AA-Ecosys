journeys:
  - id: J-01
    name: Pilot rehearsal - one agency end to end
    name_vi: Diễn tập pilot - một đại lý từ đầu đến cuối
    summary: >-
      The synthetic rehearsal agency goes through the whole product - provisioned, branded, writing content, offering
      the planner, quoting an AA tour, the client accepting and paying, Booking confirming, the traveller portal and
      AA operations - then leaves pilot mode.
    summary_vi: >-
      Đại lý diễn tập đi qua toàn bộ sản phẩm - được tạo, có thương hiệu, viết nội dung, cung cấp công cụ lên lịch
      trình, báo giá tour AA, khách chấp nhận và thanh toán, Booking xác nhận, cổng khách du lịch và điều hành AA - rồi
      rời chế độ pilot.
    steps:
      - name: Baseline and provisioning
        name_vi: Mốc ban đầu và tạo đại lý
        features: [CIS-F035, CIS-F020, CIS-F018, CIS-F023, BK-F008]
        integrations: [INT-034, INT-030, INT-023]
      - name: Prices for the rehearsal tours
        name_vi: Giá cho các tour diễn tập
        features: [BK-F006, BK-F005, TP-F001]
        integrations: [INT-007, INT-010]
      - name: Pilot mode on and the owner invited
        name_vi: Bật chế độ pilot và mời chủ đại lý
        features: [CIS-F018, CIS-F019, CRM-F002]
        integrations: [INT-031, INT-030]
      - name: Brand and adopted tours
        name_vi: Thương hiệu và tour được chọn
        features: [CRM-F041, CRM-F042, CIS-F041]
        integrations: [INT-060]
      - name: Topics, an article and social posts, published
        name_vi: Chủ đề, một bài viết và bài mạng xã hội, đã xuất bản
        features: [CRM-F043, CRM-F044, CIS-F043, CIS-F045]
        integrations: [INT-060, INT-050, INT-051]
      - name: A guest plans on the agency's planner and sends the trip
        name_vi: Khách lên lịch trình trên công cụ của đại lý và gửi chuyến đi
        features: [TP-F005, TP-F002, TP-F006]
        integrations: [INT-006, INT-011]
      - name: The lead reaches the pipeline and the agent quotes
        name_vi: Lead vào pipeline và nhân viên báo giá
        features: [CRM-F005, CRM-F007]
        integrations: [INT-011, INT-002]
      - name: The client accepts and pays the deposit
        name_vi: Khách chấp nhận và đặt cọc
        features: [CRM-F009, CRM-F011, CRM-F013]
        integrations: [INT-024]
      - name: Booking confirms with the supplier
        name_vi: Booking xác nhận với nhà cung cấp
        features: [BK-F011, BK-F015, CRM-F013]
        integrations: [INT-024]
      - name: Traveller portal and AA operations
        name_vi: Cổng khách du lịch và điều hành AA
        features: [CRM-F009, CRM-F019, CRM-F027]
      - name: Agency billing, AI budget and leaving pilot mode
        name_vi: Thu tiền đại lý, ngân sách AI và rời chế độ pilot
        features: [BK-F013, CIS-F018, CIS-F025]
        integrations: [INT-031]
    uat_prefix: REH-
  - id: J-02
    name: Catalogue - from a source spreadsheet to every app
    name_vi: Catalogue - từ bảng tính nguồn tới mọi ứng dụng
    summary: >-
      A source tour is uploaded, rewritten, reviewed and published, then appears the same in the planner, the
      Marketplace, the CRM tariff and Booking.
    summary_vi: >-
      Một tour nguồn được tải lên, viết lại, duyệt và xuất bản, rồi hiện giống nhau trong công cụ lên lịch trình,
      Marketplace, biểu giá CRM và Booking.
    steps:
      - name: Upload and rewrite
        name_vi: Tải lên và viết lại
        features: [CIS-F003, CIS-F004, CIS-F005, CIS-F006]
        integrations: [INT-060, INT-065]
      - name: Places and photos
        name_vi: Địa điểm và ảnh
        features: [CIS-F008, CIS-F009]
        integrations: [INT-062, INT-067]
      - name: Shown in every app
        name_vi: Hiển thị trong mọi ứng dụng
        features: [TP-F001, CRM-F042, CRM-F013, BK-F004, BK-F005]
        integrations: [INT-001, INT-002, INT-003, INT-004, INT-006]
      - name: A tour stops selling
        name_vi: Một tour ngừng bán
        features: [CIS-F040, TP-F007]
        integrations: [INT-005, INT-001]
    uat: [X-03, PRT-12]
