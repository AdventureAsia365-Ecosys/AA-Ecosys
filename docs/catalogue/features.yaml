  - id: BK-F009
    app: booking
    module: supply
    name: Suppliers, contracts and rate sheets
    name_vi: Nhà cung cấp, hợp đồng và bảng giá
    summary_vi: "Danh sách nhà cung cấp (kể cả DMC vận hành trọn chương trình) kèm hợp đồng và bảng giá. Nhà cung cấp mới ở trạng thái chờ và do người thứ hai kích hoạt. Điều khoản hợp đồng (allotment, free sale, on request), hạn chế cung ứng và stop-sale đều có người thứ hai duyệt, và một trang gom các stop-sale đang chờ duyệt. Bảng giá nhập vào hiện các thay đổi so với hợp đồng đã phát hành gần nhất trước khi phát hành. Hợp đồng sắp hết hạn hiện trên trang nhà cung cấp và được gửi e-mail cho các vai trò đã chọn. Quản trị viên sửa các lựa chọn của hồ sơ nhà cung cấp (vai trò liên hệ, điều khoản thanh toán). Tài khoản ngân hàng nhà cung cấp được che số; chỉ chủ doanh nghiệp duyệt (trưởng nhóm kỹ thuật dự phòng), kèm ghi chú đã gọi xác nhận; chỉ xem đầy đủ khi có dòng nhật ký kiểm toán; sau mỗi lần đổi tài khoản, chi trả cho nhà cung cấp đó tạm dừng một khoảng thời gian."
    summary: The supplier register (DMCs that run whole programs included) with contracts and rate sheets. A new supplier starts pending and a second person activates it. Contract terms (allotment, free sale, on request), supply restrictions and stop-sale are each checked by a second person, and one page lists the stop-sales waiting for that check. An imported rate sheet shows its changes against the last published contract before it is published. Contracts about to end are listed on the supplier pages and e-mailed to the chosen roles. Admins edit the supplier profile choices (contact roles, payment terms). Supplier bank accounts are masked. Only the business owner approves one (the tech lead as fallback), with a call-back note. The full details are revealed only with an audit row, and payouts to the supplier pause for a set time after any bank change.
    roles: [booking-admin, contracting, sales, finance]
    status: live
    surface: ["page:/suppliers/**", "page:/stop-sales", "route:suppliers", "route:supply_model", "route:supplier_bank", "route:supplier_profile_options"]
    owner: tech_lead
  - id: BK-F010
    app: booking
    module: supply
    name: Hotels through several DMCs, and services
    name_vi: Khách sạn qua nhiều DMC, và dịch vụ
    summary_vi: "Khách sạn và loại phòng do một hoặc nhiều DMC bán: có DMC ưu tiên, mỗi dòng phòng trên báo giá lấy một DMC, so giá quy đổi USD. Có loại bữa (board basis) và giá trẻ em của khách sạn. Allotment, free sale và số ngày release theo từng DMC áp cho dòng phòng của đại lý. Có kiểm tra khách sạn trùng và ngày xác nhận lại thông tin khách sạn. Bảng giá xuất ra Excel và nhập lại kèm danh sách thay đổi. Dịch vụ (hoạt động, đưa đón, hướng dẫn viên, vé vào cửa, bữa ăn) kèm giá nhà cung cấp."
    summary: Hotels with room types sold by one or more DMCs. Each hotel can have a preferred DMC, each room line on a quote takes one DMC, and prices are compared in USD. Board basis and hotel child prices are supported. Allotment, free sale and release days per DMC apply to agency room lines. A check flags duplicate hotels, and each hotel has a date to re-confirm its facts. The rate sheet goes out to Excel and comes back in with a list of changes. Services (activities, transfers, guides, entrances, meals) carry their supplier rates.
    roles: [booking-admin, contracting, sales]
    status: live
    surface: ["page:/hotels", "page:/services/**", "route:supply"]
    owner: tech_lead
