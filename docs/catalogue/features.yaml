  # ── AA-CIS: tenants ───────────────────────────────────────────────────────────────────────────────────────────────
  - id: CIS-F018
    app: cis
    module: tenants
    name: Tenant directory and Tenant 360
    name_vi: Danh bạ đại lý và Tenant 360
    summary: Every agency tenant with its usage, members, audit trail, subscription and support view, filtered to the staff member's own book.
    roles: [admin, customer_success, support, finance]
    status: live
    surface: ["page:/admin/tenants", "page:/admin/tenants/[id]", "route:admin", "route:admin_tenant360"]
    owner: customer_success
  - id: CIS-F019
    app: cis
    module: tenants
    name: Plans, subscriptions and add-on requests
    name_vi: Gói dịch vụ, đăng ký và yêu cầu add-on
    summary: The plan catalogue (Content studio plans, CRM and TripPlanner add-ons), each tenant's subscription and entitlements, and the add-on requests owners send.
