    app: cis
    module: catalogue
    name: Reference prices
    name_vi: Giá tham chiếu
    summary_vi: "Giá tham khảo có cấu trúc của từng tour AA, do bộ phận chăm sóc khách hàng giữ, Booking đọc làm điểm xuất phát."
    summary: The structured reference price of each AA tour, kept by customer service and read by Booking as a starting point.
    roles: [admin, content_lead, content, customer_success, finance]
    status: live
    surface: ["page:/admin/reference-prices", "route:admin_reference_prices"]
