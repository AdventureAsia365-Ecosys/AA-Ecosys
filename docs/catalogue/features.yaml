    summary: Quality signals, compliance flags, the review log, slates and traces of the content agencies write; agencies always get their text, the signals stay here.
    roles: [admin, content_lead, tenant_qa, customer_success]
    status: live
    surface: ["page:/admin/tenant-qa/**", "route:admin_content_quality", "route:admin_tenant_compliance", "route:admin_a4"]
    owner: content_lead
  - id: CIS-F017
    app: cis
    module: writing-lab
    name: Writing Lab and quality measurement
    name_vi: Writing Lab và đo chất lượng
    summary_vi: "Các trang theo từng bước của người viết AI, bộ nhớ viết có kiểm soát, nhãn nhận định, đọc tay các lượt đánh giá, phễu chất lượng và nguồn gốc của mọi kết quả."
