    status: live
    surface: ["page:/admin/facts", "route:admin_facts"]
    owner: content_lead
  - id: CIS-F012
    app: cis
    module: content-settings
    name: Brand identity and content settings
    name_vi: Bản sắc thương hiệu và cấu hình nội dung
    summary: The Adventure Asia brand identity rows (tone, forbidden words, call to action) and the SEO length rules the writers follow.
    roles: [admin, content, content_lead, viewer]
    status: live
    surface: ["page:/admin/settings", "route:admin_settings", "route:admin_pipeline/brand_identity", "route:admin_pipeline/brands"]
