    name: Pricing policy
    name_vi: Chính sách giá
    summary_vi: "Mọi giá trị chính sách giá và tài chính, có phiên bản và thay đổi do hai người duyệt: hiệu lực báo giá, giữ chỗ, đặt cọc, phụ thu, lưu trữ dữ liệu. Thêm các nhóm số khách mà bảng chi phí tính giá theo, loại bữa mặc định của khách sạn và số ngày release allotment mặc định, nhắc hợp đồng nhà cung cấp sắp hết hạn (báo trước bao lâu, vai trò nào nhận e-mail), thời gian tạm dừng chi trả sau khi đổi tài khoản ngân hàng, và ngưỡng kiểm tra job."
