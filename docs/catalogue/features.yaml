    surface: ["page:/admin/lab/**", "route:admin_writing_memory", "route:admin_claim_labels", "route:admin_claim_shadow", "route:admin_quality_funnel", "route:admin_quality_lineage", "route:admin_quality_thresholds"]
    conditions:
