# AA-1106 — the feature catalogue of every AA app (one source; the CIS admin Platform › Product map renders it).
#
# Format and rules: docs/catalogue/README.md. Checked by tools/catalogue/check_catalogue.py (workflow "Catalogue"):
# every page and API route group in surface.snapshot.json maps to a feature here, every setting / entitlement /
# connection / secret named in a condition exists, every UAT scenario points to a real feature id.
# Public repo: names only. No account ID, ARN, e-mail address, secret value or real tenant name.
#
# surface patterns: "page:<url>" or "route:<module>" of the feature's own app; "/**" at the end also matches every page
# below that path. conditions: entitlements (shared.entitlement_feature keys of the tenant's plan or add-on), settings
# (settings registry keys), connections (AI gateway connection keys), secrets (Secrets Manager names, the register's
# names), tenant_kinds (demo / pilot / agency), note (plain words).
format: 1

apps:
  - id: cis
    name: AA-CIS (content system)
    name_vi: AA-CIS (hệ thống nội dung)
    repo: AA-CIS-App
    kind: system
    summary: >-
      The content system of record. Staff upload Adventure Asia tours, the AI pipeline rewrites them into the master
      catalogue, and agencies rewrite them for their own brand in the Content studio. Also the staff admin of the
      whole platform: tenants, plans, AI spend, jobs, settings and docs.
    summary_vi: >-
      Hệ thống gốc của nội dung. Nhân viên tải tour Adventure Asia lên, quy trình AI viết lại thành catalogue chuẩn,
      đại lý viết lại theo thương hiệu riêng trong Content studio. Đây cũng là trang quản trị cho nhân viên của cả nền
      tảng: đại lý, gói dịch vụ, chi phí AI, job, cấu hình và tài liệu.
    owner: tech_lead
  - id: booking
    name: AA-Booking (back office)
    name_vi: AA-Booking (văn phòng điều hành)
    repo: AA-Booking
    kind: system
    summary: >-
      The Adventure Asia back office: trip cases and proposals, pricing and FX, suppliers, hotels and services,
      supplier bookings, bills, agency billing and the B2B desk that serves agencies booking AA tours.
    summary_vi: >-
      Văn phòng điều hành của Adventure Asia: hồ sơ chuyến đi và đề xuất, giá và tỷ giá, nhà cung cấp, khách sạn và
      dịch vụ, đặt dịch vụ với nhà cung cấp, hoá đơn, thu tiền đại lý và bàn B2B phục vụ đại lý đặt tour AA.
    owner: tech_lead
  - id: crm
    name: "AA-Partner (agency app: CRM + Content studio)"
    name_vi: "AA-Partner (ứng dụng đại lý: CRM + Content studio)"
    repo: AA-Partner
    kind: system
    summary: >-
      The partner agency's app. The CRM runs the agency's sales and trips (pipeline, clients, proposals, invoices,
      suppliers, traveller portal); the Content studio rewrites AA tours and writes articles and social posts for the
      agency's brand. Includes the AA staff console for support and ground operations.
    summary_vi: >-
      Ứng dụng của đại lý đối tác. CRM quản lý bán hàng và chuyến đi của đại lý (pipeline, khách hàng, đề xuất, hoá
      đơn, nhà cung cấp, cổng khách du lịch); Content studio viết lại tour AA, viết bài và bài mạng xã hội theo thương
      hiệu đại lý. Có cả bảng điều khiển cho nhân viên AA hỗ trợ và điều hành mặt đất.
    owner: tech_lead
  - id: tripplanner
    name: AA-TripPlanner (white-label trip planner)
    name_vi: AA-TripPlanner (công cụ lên lịch trình mang thương hiệu đại lý)
    repo: AA-TripPlanner-Web
    kind: system
    summary: >-
      A map-first trip planner each agency offers to its own travellers under its brand. Travellers browse tours and
      places, build a trip on the map with AI help, and send it to the agency, whose CRM receives the lead.
    summary_vi: >-
      Công cụ lên lịch trình trên bản đồ mà mỗi đại lý cung cấp cho khách của mình dưới thương hiệu riêng. Khách xem
      tour và địa điểm, dựng chuyến đi trên bản đồ với trợ giúp của AI rồi gửi cho đại lý; CRM của đại lý nhận lead.
    owner: tech_lead
  - id: infra
    name: AA-CIS-Infra (shared platform edge)
    name_vi: AA-CIS-Infra (hạ tầng dùng chung)
    repo: AA-CIS-Infra
    kind: system
    summary: >-
      The shared AWS platform every app runs on: sign-in pools, the API edge, the database migration and schema dump
      workflows, alarms and the docs and catalogue publishing.
    summary_vi: >-
      Nền tảng AWS dùng chung cho mọi ứng dụng: nhóm đăng nhập, cổng API, quy trình migration và dump schema của
      database, cảnh báo và việc xuất bản tài liệu, catalogue.
    owner: tech_lead

features:
  # ── AA-CIS: staff admin ───────────────────────────────────────────────────────────────────────────────────────────
  - id: CIS-F001
    app: cis
    module: admin-shell
    name: Admin shell, sign-in and search
    name_vi: Khung trang quản trị, đăng nhập và tìm kiếm
    summary: Staff sign in with the company account, move around with the sidebar and the command palette, and search across tours, tenants and pages.
    roles: [admin, content, content_lead, tenant_qa, customer_success, support, finance, ai_ops, viewer]
    status: live
    surface: ["page:/", "page:/login", "page:/admin/platform", "route:admin_search"]
    owner: tech_lead
  - id: CIS-F002
    app: cis
    module: overview
    name: Overview dashboard
    name_vi: Bảng tổng quan
    summary: One page with the whole system at a glance, from the pipeline funnel to spend, jobs and alerts.
    roles: [admin]
    status: live
    surface: ["page:/admin/overview", "route:admin_overview", "route:admin_dashboard", "route:admin_pipeline/metrics"]
    owner: tech_lead
  - id: CIS-F003
    app: cis
    module: catalogue-pipeline
    name: Tour upload and intake (A0)
    name_vi: Tải tour lên và tiếp nhận (A0)
    summary: Staff upload the source tour spreadsheets; each row is checked, staged and becomes a raw tour.
    roles: [admin, content, content_lead]
    status: live
    surface: ["page:/admin/upload", "route:admin_pipeline/uploads"]
    conditions:
      settings: [cis.content.trash_retention_days]
    owner: content_lead
  - id: CIS-F004
    app: cis
    module: catalogue-pipeline
    name: Catalogue rewrite (A1) and rerun waves
    name_vi: Viết lại catalogue (A1) và các đợt chạy lại
    summary: The AI writer rewrites each source tour into the Adventure Asia catalogue text; staff run single tours or whole waves with an expected tour set and a cap.
    roles: [admin, content, content_lead]
    status: live
    surface: ["page:/admin/s1-rewrite", "route:admin_pipeline/runs", "route:admin_waves"]
    conditions:
      settings: [cis.a1.attempts_before_review, cis.spend.rerun_wave_max_tours, cis.quality.pass_line]
      connections: [anthropic-direct, openai-direct, acc3, acc2]
      note: Paid AI calls through the AI gateway; a wave is limited by the rerun wave cap.
    owner: content_lead
  - id: CIS-F005
    app: cis
    module: catalogue-pipeline
    name: Review queue (A2)
    name_vi: Hàng chờ duyệt (A2)
    summary: Tours the quality gate holds wait here for a person, who reads the claims, approves, rejects or supersedes them.
    roles: [admin, content, content_lead, viewer]
    status: live
    surface: ["page:/admin/review", "route:admin_pipeline/review", "route:v1_pipeline"]
    conditions:
      settings: [cis.quality.review_score_band_low]
    owner: content_lead
  - id: CIS-F006
    app: cis
    module: catalogue-pipeline
    name: Master content
    name_vi: Nội dung chuẩn (Master)
    summary: The published catalogue tours with every version, the source, the SEO context, exports and the country fix.
    roles: [admin, content, content_lead, tenant_qa, ai_ops, viewer]
    status: live
    surface: ["page:/admin/master-content", "route:admin_pipeline/tours", "route:admin_pipeline/tour_detail", "route:admin_pipeline/versions"]
    owner: content_lead
  - id: CIS-F007
    app: cis
    module: catalogue-pipeline
    name: Social content atoms (A3)
    name_vi: Nguyên liệu nội dung mạng xã hội (A3)
    summary: Each master tour is cut into atoms (hooks, facts, highlights) that the agency writers use; staff curate them.
    roles: [admin, content_lead]
    status: live
    surface: ["page:/admin/atom-curation", "route:admin_atoms"]
    owner: content_lead
  - id: CIS-F008
    app: cis
    module: places
    name: Places, geocoding and place cards
    name_vi: Địa điểm, định vị và thẻ địa điểm
    summary: Every place a tour visits is located on the map and gets a place card; staff see coverage, fix places and run bounded backfills.
    roles: [admin, content_lead, tenant_qa]
    status: live
    surface: ["page:/admin/places/**", "route:admin_places"]
    conditions:
      connections: [geoapify]
      settings: [cis.spend.place_backfill_max_tours]
    owner: content_lead
  - id: CIS-F009
    app: cis
    module: photos
    name: AA photos
    name_vi: Ảnh AA
    summary: Marketing photos synced from the content team's shared drive, per country and tour, served from the image host.
    roles: [admin, content_lead]
    status: live
    surface: ["page:/admin/photos", "route:admin_photos"]
    conditions:
      secrets: [aa-cis/dev/gdrive-photo-reader]
    owner: content_lead
  - id: CIS-F010
    app: cis
    module: seo
    name: SEO intelligence and search-demand research
    name_vi: Thông tin SEO và nghiên cứu nhu cầu tìm kiếm
    summary: Every SEO signal of the pipeline on one page; staff start a paid search-demand research run for a segment.
    roles: [admin, content_lead]
    status: live
    surface: ["page:/admin/seo-intelligence", "route:admin_seo", "route:admin_segment_research"]
    conditions:
      connections: [dataforseo]
      settings: [cis.spend.segment_research_max_usd_per_run, cis.spend.dfs_call_estimate_usd]
    owner: content_lead
  - id: CIS-F011
    app: cis
    module: facts
