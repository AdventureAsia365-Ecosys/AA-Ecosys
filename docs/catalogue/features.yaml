    summary_vi: "Ai được duyệt việc gì khi chỉ vài người vận hành doanh nghiệp. Người tạo hoặc sửa một bản ghi không bao giờ tự duyệt nó (nhà cung cấp, hợp đồng, add-on, giá, mùa, thông tin thanh toán của pháp nhân xuất hoá đơn). Chủ doanh nghiệp chỉ được tự duyệt ở những chỗ công tắc cho phép, và mỗi lần như vậy được đánh dấu và liệt kê trong nhật ký kiểm toán. Tour chỉ bán được khi đã có giá được duyệt. Việc của tôi cho mỗi người thấy các mục đang chờ họ duyệt."
