    name_vi: Dữ kiện nền tảng
    summary_vi: "Các dữ kiện đã kiểm (giờ mở cửa, giá, quy định) mà người viết được trích dẫn, do nhân viên quản lý, có hạn dùng."
    summary: Checked facts (opening times, prices, rules) the writers may cite, kept by staff with an expiry.
    roles: [admin, content_lead]
    status: live
    surface: ["page:/admin/facts", "route:admin_facts"]
    owner: content_lead
  - id: CIS-F012
    app: cis
    module: content-settings
    name: Brand identity and content settings
    name_vi: Bản sắc thương hiệu và cấu hình nội dung
    summary_vi: "Bộ nhận diện thương hiệu Adventure Asia (giọng văn, từ cấm, lời kêu gọi) và quy tắc độ dài SEO mà người viết tuân theo."
    summary: The Adventure Asia brand identity rows (tone, forbidden words, call to action) and the SEO length rules the writers follow.
    roles: [admin, content, content_lead, viewer]
    status: live
    surface: ["page:/admin/settings", "route:admin_settings", "route:admin_pipeline/brand_identity", "route:admin_pipeline/brands"]
    conditions:
      settings: [cis.seo.meta_max, cis.seo.title_max]
    owner: content_lead
  - id: CIS-F013
    app: cis
    module: aa-content
    name: AA content for agencies
    name_vi: Nội dung AA cho đại lý
    summary_vi: "Gói chuẩn bị, mẫu khởi đầu và khối chiến dịch do AA viết, CRM của đại lý đọc về."
    summary: Prep packs, starter templates and campaign blocks written by AA and read by the agency CRM.
    roles: [admin, content, content_lead, viewer]
    status: live
    surface: ["page:/admin/aa-content", "route:admin_aa_content"]
    owner: content_lead
