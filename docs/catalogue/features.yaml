    summary: Who looks after which tenant (owner, backup, support); the scope every staff list is filtered to.
    roles: [admin, customer_success, support]
    status: live
    surface: ["page:/admin/tenants/assignments", "route:admin_tenant_assignments"]
    owner: customer_success
  - id: CIS-F022
