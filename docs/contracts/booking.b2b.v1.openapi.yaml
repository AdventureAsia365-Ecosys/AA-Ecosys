openapi: 3.1.0
info:
  title: booking.b2b.v1 (AA-Booking → AA-Partner CRM, B2B products, quotes, holds, bookings, events)
  version: "1.4"
  description: >-
    The AA inventory API of the partner CRM spec (§9), owned by AA-Booking (root ADR 0005, 0005a) and called by the
    AA-Partner CRM API server to server (root ADR 0010). Auth: an M2M access token of the aa-m2m pool (root ADR 0006b
    decision 7) with the scope named on each operation, plus the agency's tenant id in X-AA-Tenant-Id; Booking checks
    the agency against its own b2b_partner row. **No personal data ever crosses this API**: no names, contacts, dates
    of birth or passports; pax are counts by age band plus room configuration. The agency-facing price is b2b_price
    (root ADR 0005a decision 2); the supplier net cost never leaves Booking and no field is named supplier_net (the
    root contracts CI rejects it). Prices are decimal strings. Errors: 409 price_changed (re-quote), 410
    hold_expired (re-hold), 422 sold_out, 429 rehold_limit, 409 extend_limit, 409 tour_not_served (the tour left the
    AA catalog: retired, paused or gone; root ADR 0015, AA-986); on 503 or a timeout the CRM shows an
    indicative price and disables deposits until a hold is active. Path prefix /booking/b2b/v1 is provisional until
    ADR 0013 (AA-899) fixes HTTP conventions; the contract name and major do not change with it.
    Minor 1.1 (AA-975, additive): Event types departure.cancelled and departure.incident_cleared, Event.decline_code,
    and the GET /events cursor and delivery rules.
    Minor 1.2 (AA-952, additive): every Hold answer also carries the quote it holds (price_hash, currency, fx, and
    each HoldLine's b2b_price), so the CRM writes the agency's AA lines of an accepted proposal (net = b2b_price, the
    quote's FX lock) and presents the right hash at confirm. Optional in the schema (left out only when Booking cannot
    read the quote row); never a net cost or a supplier rate.
    Minor 1.3 (AA-1037 R4 extras, additive): every Quote and Hold answer carries cancellation_policy (the fee schedule
    a confirm today would lock, or the one locked on a confirmed hold); GET /bookings/{booking_id}/confirmation (the
    booking confirmation, JSON or a printable HTML file, no traveller names and no prices); GET /terms (the agency's
    payment terms, credit status, default cancellation policy and approved terms clauses); and the Problem error
    credit_hold_overdue (409 on POST /holds while the agency's AA invoices are overdue past its credit terms).
    Minor 1.4 (AA-1030 G3, additive): GET /tariff, the calling agency's own tariff (its price per tour, season and
    pax band, JSON or CSV), priced as POST /quotes prices the plan for the band's smallest party with the agency's
    tier or contract discount; never a net cost, a supplier rate or a margin.
  x-aa-contract: booking.b2b.v1
  x-aa-producer: AA-Booking
  x-aa-consumers: [AA-Partner]
  x-aa-issues: [AA-928, AA-952, AA-972, AA-973, AA-974, AA-975, AA-986, AA-1030, AA-1037]
servers:
  - url: /booking/b2b/v1
security:
  - m2m: []
paths:
  /products:
    get:
      operationId: listProducts
      summary: Sellable AA trip plans and their bookable components (no prices; content comes from catalog.http.v1)
      description: >-
        Without updated_since: the current offer (sellable plans whose tour is in the AA catalog). With updated_since
        (a delta): also plans that stopped being sellable (sellable false, no components) and, since AA-986 (root ADR
        0015 decision 5), plans that were offered to agencies (sellable, or with components) whose tour AA retired,
        listed once with withdrawn true, withdrawn_reason and updated_at = the retirement time. A paused tour (temporarily unavailable) is not listed as withdrawn; it is only absent
        until it is served again, and a tour that comes back is listed again with a later updated_at. Overlap the
        updated_since window by a few minutes.
      security:
        - m2m: [booking.b2b/read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: updated_since
          in: query
          required: false
          schema: {type: string, format: date-time}
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of products
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductPage"}
        "403": {$ref: "#/components/responses/Problem"}
  /quotes:
    post:
      operationId: createQuote
      summary: Price lines at the B2B channel margin, with an FX lock and a price hash
      description: >-
        Quote currencies are Booking's selling currencies plus VND. The FX lock is the approved rate in force on the
        pricing day (UTC). Each line's b2b_price is rounded up to the cent, a VND line up to 1,000 VND (AA-974); the
        total is the exact sum of the lines, and the rounding rule is part of the price_hash.
      security:
        - m2m: [booking.b2b/quote]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuoteRequest"}
      responses:
        "201":
          description: Quote
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quote"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /departures:
    get:
      operationId: listDepartures
      summary: Fixed departures of a trip plan with capacity
      security:
        - m2m: [booking.b2b/read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: source_system
          in: query
          required: true
          schema: {type: string, enum: [cis]}
        - name: source_id
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: from
          in: query
          required: false
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date}
      responses:
        "200":
          description: Departures
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeparturePage"}
  /holds:
    post:
      operationId: createHold
      summary: Hold the lines of a quote; one active hold set per (tenant, proposal_ref, proposal_version)
      description: >-
        Re-hold limit (Fix A3, AA-974): at most 3 re-holds per UTC day (Booking setting), then 429 rehold_limit with
        retry_after_s until 00:00 UTC, counted per proposal_ref (every hold of a proposal_ref after its first one,
        whatever the version) and per departure (a hold of a departure after a hold of it the agency placed the same
        day and released or let expire, whatever the proposal_ref). Holds still active or confirmed never count
        toward the departure limit. A replay of the same Idempotency-Key, or the same quote for a version that
        already holds, is answered before the limit and never counts. 409 tour_not_served (AA-986, root ADR 0015): a
        trip_plan line whose tour is no longer served by AA (retired, paused or out of the catalog) cannot be held;
        tour, tour_state and reason say which and why. hotel_room and service lines carry no tour and are not
        checked. A replay of an existing hold is still answered. 409 credit_hold_overdue (1.3, AA-1037): the agency's
        AA invoices are overdue past its credit terms (its billing status is past_due, see GET /terms credit); no new
        hold until they are paid. Replays, confirms, extends, releases and cancels of existing holds still work.
      security:
        - m2m: [booking.b2b/hold]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HoldRequest"}
      responses:
        "201":
          description: Hold placed (or the existing active hold for the same key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hold"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /holds/{hold_id}:
    parameters:
      - $ref: "#/components/parameters/HoldId"
    get:
      operationId: getHold
      security:
        - m2m: [booking.b2b/read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Hold
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hold"}
        "404": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: releaseHold
      summary: Release a hold (trip lost, proposal withdrawn)
      security:
        - m2m: [booking.b2b/hold]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "204":
          description: Released (idempotent; an expired or already released hold also answers 204)
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}  # invalid: the hold is confirmed (cancel is AA-974)
  /holds/{hold_id}/extend:
    parameters:
      - $ref: "#/components/parameters/HoldId"
    post:
      operationId: extendHold
      summary: Extend a hold once (bank-transfer claim or client re-check); Booking decides the length
      description: >-
        Adds Booking's extension length (proposed 72 h) to expires_at, capped by the earliest departure start, at most
        once. A retry with the same Idempotency-Key returns the hold (200); any other extend of an extended hold is
        409 extend_limit, as is an extend that cannot move the expiry (the hold already runs until its departure
        starts). 410 hold_expired for an expired or released hold, 422 invalid for a confirmed hold or a bad request,
        404 for an unknown hold.
      security:
        - m2m: [booking.b2b/hold]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExtendRequest"}
      responses:
        "200":
          description: Extended
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Hold"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /holds/{hold_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/HoldId"
    post:
      operationId: confirmHold
      summary: Turn a hold into a booking after the deposit; fixed departures confirm, others go on request
      description: >-
        Idempotent on the hold: a confirmed hold returns its booking again. 409 price_changed (hash differs from the
        hold's quote) or tour_not_served (AA-986: a trip_plan line's tour is no longer served; AA never sells it, the
        hold expires on its own), 410 hold_expired (expired, released, or its seats no longer fit when the confirm gets
        the departure locks), 422 sold_out (a departure was cancelled) or invalid (request), 404 unknown hold. A booking
        already confirmed is kept and its replay answered even when its tour is withdrawn later.
      security:
        - m2m: [booking.b2b/book]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmRequest"}
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Booking"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /bookings/{booking_id}/cancel:
    parameters:
      - name: booking_id
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 64}
    post:
      operationId: cancelBooking
      summary: Cancel a booking, or preview the fee with dry_run=true (C12)
      description: >-
        booking_id is Booking.booking_id. The fee comes from the booking's cancellation policy (ADR 0005a decision 4),
        the one in force when the hold was confirmed (a policy approved after that never applies, whatever its start
        date): tiers by days before departure (the UTC day of the cancel to
        the start date), fee = the quoted total x fee_pct, in the quote currency (half-up to the cent, whole VND),
        refundable = total - fee; a booking on a departure AA cancelled costs no fee (fee_pct 0). dry_run=true returns
        the same numbers and changes nothing (cancelled_at null). A
        cancel frees the seats and cancels the Booking trip case. Idempotent on the booking: a repeat (any key, dry
        run or not) returns the stored cancellation (dry_run false, cancelled_at set). 404 unknown or another agency's
        booking; 422 invalid for a booking that is not confirmed or a bad request.
      security:
        - m2m: [booking.b2b/book]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: dry_run
          in: query
          required: false
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CancelRequest"}
      responses:
        "200":
          description: Cancellation result (or preview)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CancellationResult"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /bookings/{booking_id}/confirmation:
    parameters:
      - name: booking_id
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 64}
    get:
      operationId: getBookingConfirmation
      summary: The booking confirmation of a confirmed booking (1.3), JSON or a printable HTML file
      description: >-
        1.3 (AA-1037). booking_id is Booking.booking_id. The reference (trip_case_code), the agency's proposal ref and
        version, the status (confirmed, or cancelled once cancelled), the trip dates, the most travellers of a line by
        age band, every line (title, kind, date, nights, pax counts, room set-up, status, the supplier confirmation refs
        of the confirmed supplier bookings covering it) and the cancellation policy locked on the booking. No traveller
        names and no prices (the agency may pass it to its client). format=html answers one self-contained HTML file
        (inline CSS, no script) as an attachment, to print or save as PDF. 404 unknown or another agency's booking.
      security:
        - m2m: [booking.b2b/read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: format
          in: query
          required: false
          schema: {type: string, enum: [json, html], default: json}
      responses:
        "200":
          description: The confirmation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookingConfirmation"}
            text/html:
              schema: {type: string}
        "404": {$ref: "#/components/responses/Problem"}
  /terms:
    get:
      operationId: getPartnerTerms
      summary: The calling agency's terms with AA (1.3)
      description: >-
        1.3 (AA-1037). Read from Booking data rows: the agency's payment terms (its contract terms, else AA's default;
        null when none exist), its credit status (holds_paused while past_due, when POST /holds answers 409
        credit_hold_overdue), the default cancellation policy in force (a tour may have its own; quotes and holds show
        the one that applies) and AA's approved terms clauses (for example how AA corrects a clearly wrong price, with
        the agency's free-cancel window). A clause is never shown before it is approved.
      security:
        - m2m: [booking.b2b/read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: The agency's terms
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PartnerTerms"}
        "403": {$ref: "#/components/responses/Problem"}
  /events:
    get:
      operationId: listEvents
      summary: Cursor feed of hold, line, booking and departure events for the calling agency
      description: >-
        The calling agency's events (and only its own), oldest first, from Booking's transactional outbox: an event
        exists if and only if the change it reports committed. Delivery is at least once: store next_cursor after
        processing a page and poll again with it (the CRM pulls every minute into crm.inbox_events); a replay from an
        older cursor returns the same events again (same event_id, same order), each once, so consumers dedupe on
        event_id. Omit after to read from the start. Cursors are opaque (never parse or compare them; their format
        may change within v1); next_cursor is always present (the last item's cursor, or after itself when nothing
        is new). A malformed cursor, or one this feed never issued to the calling agency (ahead of its own feed), is
        422 invalid. Departure events (guaranteed, cancelled, incident, incident_cleared) go to every agency with
        a live hold or a confirmed, not declined or cancelled line on the departure. Events carry ids and codes
        only, never personal data or free text. departure.time_change has no producer yet (departures carry no
        start time); new_start_time is null until it has.
      security:
        - m2m: [booking.b2b/read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: after
          in: query
          required: false
          description: The cursor of the last event already processed (next_cursor of the previous page).
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        "200":
          description: Events after the cursor, oldest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventPage"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}  # forbidden (not the CRM client, no read scope), unknown_partner
        "422": {$ref: "#/components/responses/Problem"}  # invalid: malformed or future cursor, limit out of range
  /fx-rates:
    get:
      operationId: getFxRates
      summary: Booking-approved FX rates in force on a date (R17 source)
      security:
        - m2m: [booking.b2b/read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        "200":
          description: Rates
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FxRates"}
  /price-parity:
    get:
      operationId: getPriceParity
      summary: AA's public B2C "from" price for a trip plan; the CRM warns below it, never blocks (ADR 0005a)
      security:
        - m2m: [booking.b2b/read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: source_system
          in: query
          required: true
          schema: {type: string, enum: [cis]}
        - name: source_id
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: currency
          in: query
          required: true
          schema: {type: string, pattern: "^[A-Z]{3}$"}
      responses:
        "200":
          description: Parity reference
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceParity"}
  /tariff:
    get:
      operationId: getTariff
      summary: 1.4 (AA-1030 G3). The calling agency's own tariff, its price per tour, season and pax band
      description: >-
        One row per window x pax band of the AA price matrix (b2b rows still valid today) of every sellable tour AA
        serves, priced exactly as POST /quotes prices the plan's tp line for the band's smallest party (all adults,
        twin share) on priced_for_date, with the agency's tier or contract rate card discount in force today. A
        quote of that party on that day answers the same price while no rate, rule, FX rate or discount changes; the
        quote stays the binding price. Rows AA cannot quote today are left out. format=csv returns the same rows as a
        CSV file (columns tour_key, title, country, duration_days, season, valid_from, valid_to, pax_min, pax_max,
        priced_for_pax, currency, price_per_person, price_for_party, agency_discount_pct, rrp_per_person,
        rrp_currency; an open pax band has an empty pax_max).
      security:
        - m2m: [booking.b2b/read]
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: currency
          in: query
          required: false
          description: A quote currency (USD, EUR, GBP, AUD, SGD, VND); default USD.
          schema: {type: string, pattern: "^[A-Z]{3}$", default: USD}
        - name: source_id
          in: query
          required: false
          description: One tour only (its catalog key).
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: format
          in: query
          required: false
          schema: {type: string, enum: [json, csv], default: json}
      responses:
        "200":
          description: The tariff
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tariff"}
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}  # invalid: not a quote currency
        "503": {$ref: "#/components/responses/Problem"}  # unavailable: no b2b rule, no FX rate, catalog unreadable
components:
  securitySchemes:
    m2m:
      type: oauth2
      description: Cognito M2M pool aa-m2m-<env>, client credentials, one client per calling service.
      flows:
        clientCredentials:
          tokenUrl: https://m2m-auth.example.invalid/oauth2/token
          scopes:
            booking.b2b/read: Products, departures, holds, events, FX, parity
            booking.b2b/quote: Create quotes
            booking.b2b/hold: Place, extend and release holds
            booking.b2b/book: Confirm and cancel bookings
  parameters:
    TenantHeader:
      name: X-AA-Tenant-Id
      in: header
      required: true
      description: The calling agency's CIS tenant id; must match an active b2b_partner.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 200}
    HoldId:
      name: hold_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 64}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, maxLength: 200}
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum: [unauthorized, forbidden, unknown_partner, not_found, price_changed, hold_expired, sold_out,
                 rehold_limit, extend_limit, tour_not_served, credit_hold_overdue, invalid, unavailable]
        message: {type: string, maxLength: 500}
        tour:
          $ref: "#/components/schemas/TourKey"
          description: On tour_not_served, the tour that is not served (AA-986).
        tour_state:
          type: string
          enum: [retired, paused, not_in_catalog]
          description: >-
            On tour_not_served. retired = AA no longer offers it (drop it from offers); paused = temporarily
            unavailable (keep the offer, try later); not_in_catalog = absent from the catalog, reason unknown.
        reason:
          type: string
          maxLength: 64
          description: >-
            On tour_not_served, why (root ADR 0015): source_deleted, master_trashed, superseded_orphan (retired);
            master_inactive, superseded_pending (paused); not_in_catalog.
        price_hash:
          type: string
          description: On price_changed, the new price hash to re-quote against.
        retry_after_s:
          type: integer
          minimum: 0
          description: On rehold_limit, seconds until the limit resets (00:00 UTC); on unavailable, a retry hint.
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
          description: Decimal string. VND amounts have no decimals (ISO 4217 exponent 0).
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    TourKey:
      type: object
      additionalProperties: false
      required: [source_system, source_id]
      properties:
        source_system: {type: string, enum: [cis]}
        source_id: {type: string, minLength: 1, maxLength: 128}
    Pax:
      type: object
      additionalProperties: false
      description: Counts only, never people.
      required: [adult]
      properties:
        adult: {type: integer, minimum: 1, maximum: 60}
        child: {type: integer, minimum: 0, maximum: 60, default: 0}
        infant: {type: integer, minimum: 0, maximum: 20, default: 0}
    Room:
      type: object
      additionalProperties: false
      required: [occupancy]
      properties:
        room_type_id: {type: string, maxLength: 64}
        occupancy: {type: string, enum: [single, double, twin, triple, family]}
        count: {type: integer, minimum: 1, maximum: 30, default: 1}
    Component:
      type: object
      additionalProperties: false
      required: [component_id, kind]
      properties:
        component_id: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string, enum: [trip_plan, hotel_room, transfer, guide, activity, entrance, meal]}
        day_no: {type: [integer, "null"], minimum: 0}
        destination_id: {type: [string, "null"], maxLength: 64}
    Product:
      type: object
      additionalProperties: false
      required: [tour, trip_plan_id, sellable, has_fixed_departures, components, updated_at]
      properties:
        tour: {$ref: "#/components/schemas/TourKey"}
        trip_plan_id: {type: string, maxLength: 64}
        sellable: {type: boolean}
        has_fixed_departures: {type: boolean}
        components:
          type: array
          items: {$ref: "#/components/schemas/Component"}
        updated_at: {type: string, format: date-time}
        withdrawn:
          type: boolean
          default: false
          description: >-
            AA-986: true on a delta row of a plan whose tour AA retired (sellable false, no components, updated_at =
            the retirement time). Mark open proposal lines "no longer offered".
        withdrawn_reason:
          type: [string, "null"]
          maxLength: 64
          description: On a withdrawn row, why (source_deleted, master_trashed, superseded_orphan).
    ProductPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Product"}
        next_cursor: {type: [string, "null"], maxLength: 200}
    QuoteLineRequest:
      type: object
      additionalProperties: false
      required: [line_ref, component_id, service_date, pax]
      properties:
        line_ref:
          type: string
          maxLength: 64
          description: The CRM's id of the option or booking line (opaque to Booking).
        component_id: {type: string, maxLength: 64}
        departure_id: {type: [string, "null"], maxLength: 64}
        service_date: {type: string, format: date}
        nights: {type: [integer, "null"], minimum: 1, maximum: 60}
        pax: {$ref: "#/components/schemas/Pax"}
        rooms:
          type: array
          items: {$ref: "#/components/schemas/Room"}
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [proposal_ref, proposal_version, currency, lines]
      properties:
        proposal_ref: {type: string, maxLength: 64}
        proposal_version: {type: integer, minimum: 1, maximum: 2147483647}
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Quote currency, VND included (ADR 0005a decision 3).
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: "#/components/schemas/QuoteLineRequest"}
    FxLock:
      type: object
      additionalProperties: false
      required: [base_currency, quote_currency, rate_per_usd, rate_date, source]
      properties:
        base_currency: {type: string, const: USD}
        quote_currency: {type: string, pattern: "^[A-Z]{3}$"}
        rate_per_usd: {type: string, pattern: "^\\d+(\\.\\d{1,8})?$"}
        rate_date: {type: string, format: date}
        source: {type: string, maxLength: 64}
    QuoteLine:
      type: object
      additionalProperties: false
      required: [line_ref, b2b_price, unit, availability]
      properties:
        line_ref: {type: string, maxLength: 64}
        b2b_price:
          $ref: "#/components/schemas/Money"
          description: The agency's price ("net" in the agency UI) at the B2B channel margin.
        unit: {type: string, enum: [per_person, per_group, per_room_night, per_line]}
        availability: {type: string, enum: [available, on_request, sold_out]}
        departure_id: {type: [string, "null"], maxLength: 64}
    Quote:
      type: object
      additionalProperties: false
      required: [quote_id, currency, fx, valid_until, price_hash, lines, total_b2b_price]
      properties:
        quote_id: {type: string, maxLength: 64}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        fx: {$ref: "#/components/schemas/FxLock"}
        valid_until: {type: string, format: date-time}
        price_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 over lines, prices, FX lock and rounding; holds must present it.
        lines:
          type: array
          items: {$ref: "#/components/schemas/QuoteLine"}
        total_b2b_price: {$ref: "#/components/schemas/Money"}
        cancellation_policy:
          oneOf:
            - $ref: "#/components/schemas/CancellationPolicy"
            - type: "null"
          description: >-
            1.3 (AA-1037). The fee schedule a confirm today would lock (basis in_force_today); the confirm locks the
            one in force on its own day. Not part of price_hash. Null when no approved policy is in force.
    Departure:
      type: object
      additionalProperties: false
      required: [departure_id, tour, start_date, capacity, held, sold, available, status, auto_confirm]
      properties:
        departure_id: {type: string, maxLength: 64}
        tour: {$ref: "#/components/schemas/TourKey"}
        start_date: {type: string, format: date}
        capacity: {type: integer, minimum: 0}
        held: {type: integer, minimum: 0}
        sold: {type: integer, minimum: 0}
        available: {type: integer, minimum: 0}
        status: {type: string, enum: [scheduled, guaranteed, cancelled]}
        auto_confirm: {type: boolean}
    DeparturePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Departure"}
    HoldRequest:
      type: object
      additionalProperties: false
      required: [quote_id, price_hash, proposal_ref, proposal_version]
      properties:
        quote_id: {type: string, maxLength: 64}
        price_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
        proposal_ref: {type: string, maxLength: 64}
        proposal_version: {type: integer, minimum: 1, maximum: 2147483647}
    HoldLine:
      type: object
      additionalProperties: false
      required: [line_ref, line_status]
      properties:
        line_ref: {type: string, maxLength: 64}
        line_status: {type: string, enum: [available, on_request]}
        b2b_price:
          $ref: "#/components/schemas/Money"
          description: 1.2 (AA-952). The line's price in the held quote.
    Hold:
      type: object
      additionalProperties: false
      required: [hold_id, quote_id, status, expires_at, extended_count, lines]
      properties:
        hold_id: {type: string, maxLength: 64}
        quote_id: {type: string, maxLength: 64}
        status: {type: string, enum: [active, confirmed, expired, released]}
        expires_at: {type: string, format: date-time}
        extended_count:
          type: integer
          minimum: 0
          maximum: 1
          description: A hold is extended at most once (second extend → 409 extend_limit).
        lines:
          type: array
          items: {$ref: "#/components/schemas/HoldLine"}
        price_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: 1.2 (AA-952). The held quote's hash; POST /holds/{hold_id}/confirm presents it.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: 1.2 (AA-952). The held quote's currency.
        fx:
          $ref: "#/components/schemas/FxLock"
          description: 1.2 (AA-952). The held quote's FX lock, as POST /quotes answered it.
        cancellation_policy:
          oneOf:
            - $ref: "#/components/schemas/CancellationPolicy"
            - type: "null"
          description: >-
            1.3 (AA-1037). A confirmed hold: the policy locked at confirm (basis locked, what a cancel charges by);
            any other hold: the one a confirm today would lock (basis in_force_today).
    ExtendRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, enum: [payment_claimed, client_recheck]}
    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [price_hash]
      properties:
        price_hash: {type: string, pattern: "^[a-f0-9]{64}$"}
        deposit_ref:
          type: [string, "null"]
          maxLength: 64
          description: The CRM's payment id (opaque; no card or bank data).
    BookingLine:
      type: object
      additionalProperties: false
      required: [line_ref, status]
      properties:
        line_ref: {type: string, maxLength: 64}
        status: {type: string, enum: [confirmed, on_request, declined, cancelled]}
    Booking:
      type: object
      additionalProperties: false
      required: [booking_id, hold_id, trip_case_code, lines]
      properties:
        booking_id: {type: string, maxLength: 64}
        hold_id: {type: string, maxLength: 64}
        trip_case_code:
          type: string
          maxLength: 32
          description: The Booking trip case code (bk- code) shown in the CRM search.
        lines:
          type: array
          items: {$ref: "#/components/schemas/BookingLine"}
    PolicyTier:
      type: object
      additionalProperties: false
      required: [min_days, fee_pct]
      properties:
        min_days:
          type: integer
          minimum: 0
          maximum: 730
          description: Cancelling at least this many days before departure (UTC day of the cancel to the start date).
        fee_pct: {type: string, pattern: "^\\d+(\\.\\d{1,2})?$"}
    CancellationPolicy:
      type: object
      additionalProperties: false
      description: >-
        1.3 (AA-1037). A cancel costs the fee_pct of the tier with the largest min_days at or below the days left
        (0 on or after the start day) of the booking's quoted total. Tiers sorted by min_days, descending.
      required: [policy_id, basis, tiers]
      properties:
        policy_id: {type: string, maxLength: 64}
        basis: {type: string, enum: [in_force_today, locked]}
        tiers:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: "#/components/schemas/PolicyTier"}
    Travellers:
      type: object
      additionalProperties: false
      description: Counts only, never people.
      required: [adult, child, infant]
      properties:
        adult: {type: integer, minimum: 0}
        child: {type: integer, minimum: 0}
        infant: {type: integer, minimum: 0}
    ConfirmationLine:
      type: object
      additionalProperties: false
      required: [line_ref, title, kind, service_date, pax, rooms, status, supplier_confirmations]
      properties:
        line_ref: {type: string, maxLength: 64}
        title:
          type: string
          maxLength: 500
          description: What was sold (the AA tour title, "hotel · room type" or the service title).
        kind: {type: string, enum: [trip_plan, hotel_room, transfer, guide, activity, entrance, meal]}
        service_date: {type: string, format: date}
        nights: {type: [integer, "null"], minimum: 1}
        pax: {$ref: "#/components/schemas/Travellers"}
        rooms:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [occupancy, count]
            properties:
              occupancy: {type: string, enum: [single, double, twin, triple, family]}
              count: {type: integer, minimum: 1}
        status: {type: string, enum: [confirmed, on_request, declined, cancelled]}
        supplier_confirmations:
          type: array
          items: {type: string}
          description: The supplier's confirmation references of the confirmed supplier bookings covering the line.
    BookingConfirmation:
      type: object
      additionalProperties: false
      description: 1.3 (AA-1037). No traveller names, no prices.
      required: [booking_id, trip_case_code, hold_id, proposal_ref, proposal_version, status, issued_at, confirmed_at,
                 cancelled_at, start_date, end_date, travellers, lines, cancellation_policy]
      properties:
        booking_id: {type: string, maxLength: 64}
        trip_case_code: {type: string, maxLength: 32}
        hold_id: {type: string, maxLength: 64}
        proposal_ref: {type: string, maxLength: 64}
        proposal_version: {type: integer, minimum: 1}
        status: {type: string, enum: [confirmed, cancelled]}
        issuer:
          type: [string, "null"]
          maxLength: 300
          description: The AA legal entity that issues the confirmation (the default billing entity), when set.
        issued_at: {type: string, format: date-time}
        confirmed_at: {type: [string, "null"], format: date-time}
        cancelled_at: {type: [string, "null"], format: date-time}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        travellers:
          $ref: "#/components/schemas/Travellers"
          description: The most travellers of one line, by age band.
        lines:
          type: array
          items: {$ref: "#/components/schemas/ConfirmationLine"}
        cancellation_policy:
          oneOf:
            - $ref: "#/components/schemas/CancellationPolicy"
            - type: "null"
    PartnerTerms:
      type: object
      additionalProperties: false
      description: 1.3 (AA-1037). The agency's terms with AA, all from Booking data rows.
      required: [as_of, payment, credit, cancellation_policy, clauses]
      properties:
        as_of: {type: string, format: date}
        payment:
          type: [object, "null"]
          additionalProperties: false
          required: [deposit_pct, balance_days_before_departure, settlement_due_days]
          properties:
            deposit_pct:
              type: string
              pattern: "^\\d+(\\.\\d{1,2})?$"
              description: The deposit billed when a booking is confirmed, % of its B2B total.
            balance_days_before_departure:
              type: integer
              minimum: 0
              description: The balance is billed this many days before departure (booked later = billed in full).
            settlement_due_days: {type: integer, minimum: 0}
        credit:
          type: object
          additionalProperties: false
          required: [status, holds_paused, overdue_invoices, oldest_overdue_days, overdue_amount]
          properties:
            status: {type: string, enum: [ok, warn, past_due]}
            holds_paused:
              type: boolean
              description: True while past_due; POST /holds answers 409 credit_hold_overdue.
            overdue_invoices: {type: integer, minimum: 0}
            oldest_overdue_days: {type: integer, minimum: 0}
            overdue_amount:
              type: array
              items: {$ref: "#/components/schemas/Money"}
            warn_after_days: {type: [integer, "null"]}
            suspend_after_days: {type: [integer, "null"]}
        cancellation_policy:
          oneOf:
            - $ref: "#/components/schemas/CancellationPolicy"
            - type: "null"
          description: AA's default B2B policy in force today (basis in_force_today).
        clauses:
          type: array
          description: AA's approved terms clauses, in display order (drafts are never listed).
          items:
            type: object
            additionalProperties: false
            required: [code, title, body, version, approved_at]
            properties:
              code: {type: string, maxLength: 40}
              title: {type: string, maxLength: 120}
              body: {type: string, maxLength: 4000}
              free_cancel_days:
                type: [integer, "null"]
                minimum: 0
                description: Days the agency may cancel free of charge after AA's notice (e.g. a corrected price).
              version: {type: integer, minimum: 1}
              approved_at: {type: string, format: date-time}
    CancelRequest:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code: {type: string, enum: [client_cancelled, agency_cancelled, departure_cancelled, other]}
    CancellationResult:
      type: object
      additionalProperties: false
      required: [booking_id, dry_run, fee, refundable_b2b_amount, fee_basis]
      properties:
        booking_id: {type: string, maxLength: 64}
        dry_run: {type: boolean}
        fee: {$ref: "#/components/schemas/Money"}
        refundable_b2b_amount: {$ref: "#/components/schemas/Money"}
        fee_basis:
          type: object
          additionalProperties: false
          required: [policy_id, days_before_departure, fee_pct]
          properties:
            policy_id: {type: string, maxLength: 64}
            days_before_departure: {type: integer}
            fee_pct: {type: string, pattern: "^\\d+(\\.\\d{1,2})?$"}
        cancelled_at: {type: [string, "null"], format: date-time}
    Event:
      type: object
      additionalProperties: false
      required: [event_id, cursor, type, occurred_at]
      properties:
        event_id: {type: string, maxLength: 64}
        cursor: {type: string, maxLength: 200}
        type:
          type: string
          enum: [hold.expired, hold.extended, line.confirmed, line.declined, booking.cancelled, departure.guaranteed,
                 departure.cancelled, departure.incident, departure.incident_cleared, departure.time_change]
        occurred_at: {type: string, format: date-time}
        hold_id: {type: [string, "null"], maxLength: 64}
        booking_id: {type: [string, "null"], maxLength: 64}
        line_ref: {type: [string, "null"], maxLength: 64}
        departure_id: {type: [string, "null"], maxLength: 64}
        incident_code:
          type: [string, "null"]
          enum: [weather, road, health, political, supplier, other, null]
          description: For departure.incident and departure.incident_cleared; never traveller data.
        decline_code:
          type: [string, "null"]
          enum: [sold_out, supplier_unavailable, minimum_not_met, other, null]
          description: >-
            1.1. For line.declined: why AA declined an on-request line (the CRM pre-selects the Lost reason "AA
            on-request declined"); null otherwise.
        new_start_time: {type: [string, "null"], format: date-time}
    EventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Event"}
        next_cursor: {type: string, maxLength: 200}
    FxRate:
      type: object
      additionalProperties: false
      required: [currency, rate_per_usd, as_of, source]
      properties:
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        rate_per_usd: {type: string, pattern: "^\\d+(\\.\\d{1,8})?$"}
        as_of: {type: string, format: date}
        source: {type: string, maxLength: 64}
    FxRates:
      type: object
      additionalProperties: false
      required: [date, base_currency, rates]
      properties:
        date: {type: string, format: date}
        base_currency: {type: string, const: USD}
        rates:
          type: array
          items: {$ref: "#/components/schemas/FxRate"}
    PriceParity:
      type: object
      additionalProperties: false
      required: [tour, currency, from_price, basis]
      properties:
        tour: {$ref: "#/components/schemas/TourKey"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        from_price:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Money"}
        basis: {type: string, enum: [per_person_2pax_low_season]}
    Tariff:
      type: object
      additionalProperties: false
      description: 1.4 (AA-1030 G3).
      required: [currency, priced_on, basis, tier_code, fx, items, truncated]
      properties:
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        priced_on: {type: string, format: date, description: The day the discount, rule and FX rates are read.}
        basis: {type: string, enum: [per_person_band_min_twin_share]}
        tier_code: {type: string, maxLength: 32, description: The agency's price tier (standard, silver, gold, ...).}
        fx: {$ref: "#/components/schemas/FxLock"}
        items:
          type: array
          items: {$ref: "#/components/schemas/TariffItem"}
        truncated: {type: boolean, description: More rows than one answer holds (ask per tour with source_id).}
    TariffItem:
      type: object
      additionalProperties: false
      description: 1.4 (AA-1030 G3). One window x pax band of a tour.
      required: [tour, valid_from, valid_to, pax_min, priced_for_pax, priced_for_date, price, price_per_person,
                 agency_discount_pct]
      properties:
        tour: {$ref: "#/components/schemas/TourKey"}
        title: {type: [string, "null"], maxLength: 500}
        country: {type: [string, "null"], maxLength: 120}
        duration_days: {type: [integer, "null"]}
        season: {type: [string, "null"], maxLength: 80}
        valid_from: {type: string, format: date}
        valid_to: {type: string, format: date}
        pax_min: {type: integer, minimum: 1}
        pax_max: {type: [integer, "null"], minimum: 1, description: Null = and more.}
        priced_for_pax: {type: integer, minimum: 1, description: The party the price is for (the band's smallest).}
        priced_for_date: {type: string, format: date, description: The start date priced (window start or today).}
        price:
          $ref: "#/components/schemas/Money"
          description: What POST /quotes charges for priced_for_pax travellers (the whole line).
        price_per_person:
          $ref: "#/components/schemas/Money"
          description: price / priced_for_pax, rounded up like a quote line.
        agency_discount_pct:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: The agency's discount in this price ("0.0300" = 3 %), its tier's or its contract rate card's.
        rrp_per_person:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/Money"}
          description: AA's public suggested retail price per person of the window and band (price.from.v1 basis).
