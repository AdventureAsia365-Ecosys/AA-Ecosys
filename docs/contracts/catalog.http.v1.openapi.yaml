openapi: 3.1.0
info:
  title: catalog.http.v1 (AA-CIS-App → AA-Partner CRM, published tour content and AA-authored content)
  version: "1.0"
  description: >-
    Read-only HTTP view of CIS published content for the partner CRM (root ADR 0010 decision 4), because the CRM
    holds no grant on the catalog schema (root ADR 0008a decision 1). Two parts: (1) published tours with days,
    places, time zones, inclusions, exclusions (an exclusion may suggest a pay-on-arrival line, R25) and facets for
    system tags (R29); same keys and liveness rules as the catalog.tour.v1 view contract, served from the catalog
    views; (2) AA-authored content written in CIS (ADR 0002): "Before you go" prep packs (R38), starter templates (R9)
    and campaign content blocks (R14), versioned, EN and VI, delivered only after publish (AA-977). No prices: prices
    come only from booking.b2b.v1. No personal data. Auth: M2M token of the aa-m2m pool with scope cis.catalog/read
    (root ADR 0006b decision 7). Every GET returns an ETag and honours If-None-Match. An unpublished tour or draft
    content is 404; a removed tour is 410 (the CRM marks its lines "no longer offered"). Path prefix /catalog/v1 is
    provisional until ADR 0013 (AA-899).
  x-aa-contract: catalog.http.v1
  x-aa-producer: AA-CIS-App
  x-aa-consumers: [AA-Partner]
  x-aa-issues: [AA-928, AA-976, AA-977]
servers:
  - url: /catalog/v1
security:
  - m2m: [cis.catalog/read]
paths:
  /tours:
    get:
      operationId: listTours
      summary: Published tours, changed since a time
      parameters:
        - name: updated_since
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: country_code
          in: query
          required: false
          schema: {type: string, pattern: "^[A-Z]{2}$"}
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of tours
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TourPage"}
  /tours/{source_system}/{source_id}:
    parameters:
      - name: source_system
        in: path
        required: true
        schema: {type: string, enum: [cis]}
      - name: source_id
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: getTour
      responses:
        "200":
          description: The published tour
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tour"}
        "304":
          description: Not modified
        "404": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
  /destinations/{destination_id}:
    parameters:
      - name: destination_id
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 64}
    get:
      operationId: getDestination
      responses:
        "200":
          description: Destination
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Destination"}
        "404": {$ref: "#/components/responses/Problem"}
  /aa-content:
    get:
      operationId: listAaContent
      summary: Published AA-authored content (prep packs, starter templates, campaign blocks)
      parameters:
        - name: kind
          in: query
          required: false
          schema: {$ref: "#/components/schemas/AaContentKind"}
        - name: locale
          in: query
          required: false
          schema: {$ref: "#/components/schemas/Locale"}
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of content summaries (latest published version of each)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AaContentPage"}
  /aa-content/{content_id}/versions/{version}:
    parameters:
      - name: content_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: version
        in: path
        required: true
        schema: {type: integer, minimum: 1}
      - $ref: "#/components/parameters/IfNoneMatch"
    get:
      operationId: getAaContentVersion
      summary: One published version; the CRM keeps the version in use when a newer one is published
      responses:
        "200":
          description: Content version
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AaContent"}
        "304":
          description: Not modified
        "404": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    m2m:
      type: oauth2
      description: Cognito M2M pool aa-m2m-<env>, client credentials.
      flows:
        clientCredentials:
          tokenUrl: https://m2m-auth.example.invalid/oauth2/token
          scopes:
            cis.catalog/read: Read published catalog and AA content
  headers:
    ETag:
      schema: {type: string, maxLength: 100}
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, maxLength: 200}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: {type: string, maxLength: 100}
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: {type: string, enum: [unauthorized, forbidden, not_found, gone, invalid]}
        message: {type: string, maxLength: 500}
    Locale:
      type: string
      enum: [en, vi]
    TourSummary:
      type: object
      additionalProperties: false
      required: [source_system, source_id, title, country_code, duration_days, content_hash, updated_at]
      properties:
        source_system: {type: string, enum: [cis]}
        source_id: {type: string, minLength: 1, maxLength: 128}
        title: {type: string, maxLength: 300}
        country_code: {type: string, pattern: "^[A-Z]{2}$"}
        duration_days: {type: integer, minimum: 1}
        content_hash:
          type: string
          description: Changes whenever the served content changes (re-sync key; updated_at is not a change cursor).
        updated_at: {type: string, format: date-time}
    TourPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/TourSummary"}
        next_cursor: {type: [string, "null"], maxLength: 200}
    Place:
      type: object
      additionalProperties: false
      required: [destination_id, name, time_zone]
      properties:
        destination_id: {type: string, maxLength: 64}
        name: {type: string, maxLength: 200}
        time_zone:
          type: string
          maxLength: 64
          description: IANA time zone (R33).
        lat: {type: [number, "null"], minimum: -90, maximum: 90}
        lng: {type: [number, "null"], minimum: -180, maximum: 180}
        precision: {type: [string, "null"], enum: [point, area, line, null]}
    TourDay:
      type: object
      additionalProperties: false
      required: [day_no, title, places]
      properties:
        day_no: {type: integer, minimum: 1}
        title: {type: string, maxLength: 300}
        description: {type: [string, "null"]}
        places:
          type: array
          items: {$ref: "#/components/schemas/Place"}
    Exclusion:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        code: {type: [string, "null"], maxLength: 64}
        text: {type: string, maxLength: 500}
        suggests_collect_on_arrival:
          type: boolean
          default: false
          description: The CRM may suggest a "pay on arrival" line for it (R25).
    Facets:
      type: object
      additionalProperties: false
      properties:
        activities:
          type: array
          items: {type: string, maxLength: 64}
        intensity: {type: [string, "null"], enum: [easy, moderate, challenging, strenuous, null]}
    Photo:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, format: uri}
        alt: {type: [string, "null"], maxLength: 300}
    Tour:
      type: object
      additionalProperties: false
      required: [source_system, source_id, title, country_code, duration_days, content_hash, days, inclusions,
                 exclusions, facets]
      properties:
        source_system: {type: string, enum: [cis]}
        source_id: {type: string, minLength: 1, maxLength: 128}
        title: {type: string, maxLength: 300}
        summary: {type: [string, "null"]}
        country_code: {type: string, pattern: "^[A-Z]{2}$"}
        duration_days: {type: integer, minimum: 1}
        content_hash: {type: string}
        days:
          type: array
          items: {$ref: "#/components/schemas/TourDay"}
        inclusions:
          type: array
          items: {type: string, maxLength: 500}
        exclusions:
          type: array
          items: {$ref: "#/components/schemas/Exclusion"}
        facets: {$ref: "#/components/schemas/Facets"}
        photos:
          type: array
          items: {$ref: "#/components/schemas/Photo"}
    Destination:
      type: object
      additionalProperties: false
      required: [destination_id, name, country_code, time_zone]
      properties:
        destination_id: {type: string, maxLength: 64}
        name: {type: string, maxLength: 200}
        country_code: {type: string, pattern: "^[A-Z]{2}$"}
        time_zone: {type: string, maxLength: 64}
        lat: {type: [number, "null"], minimum: -90, maximum: 90}
        lng: {type: [number, "null"], minimum: -180, maximum: 180}
    AaContentKind:
      type: string
      enum: [prep_pack, starter_template, campaign_block]
    AaContentSummary:
      type: object
      additionalProperties: false
      required: [content_id, kind, version, locale, title, published_at, content_hash]
      properties:
        content_id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/AaContentKind"}
        version: {type: integer, minimum: 1}
        locale: {$ref: "#/components/schemas/Locale"}
        title: {type: string, maxLength: 300}
        published_at: {type: string, format: date-time}
        content_hash: {type: string}
    AaContentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AaContentSummary"}
        next_cursor: {type: [string, "null"], maxLength: 200}
    AaContent:
      type: object
      additionalProperties: false
      required: [content_id, kind, version, locale, title, body_markdown, applies_to, published_at, content_hash]
      properties:
        content_id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/AaContentKind"}
        version: {type: integer, minimum: 1}
        locale: {$ref: "#/components/schemas/Locale"}
        title: {type: string, maxLength: 300}
        body_markdown:
          type: string
          description: Visa items are an official link only (Q1 2.3); insurance is a reminder only.
        applies_to:
          type: object
          additionalProperties: false
          properties:
            country_codes:
              type: array
              items: {type: string, pattern: "^[A-Z]{2}$"}
            tours:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [source_system, source_id]
                properties:
                  source_system: {type: string, enum: [cis]}
                  source_id: {type: string, minLength: 1, maxLength: 128}
        published_at: {type: string, format: date-time}
        content_hash: {type: string}
