openapi: 3.1.0
info:
  title: crm.ops.v1 (AA-Partner CRM → CIS admin, L1 platform console)
  version: "1.12"
  description: >-
    Platform console API of the partner CRM (AA-Partner, root ADR 0010), served under /crm/ops/v1 and called by the
    CIS admin screen S-01 "Agencies (CRM)" (AA-941) and the CIS platform-ops pages (AA-936: job summary, LLM usage).
    Layer L1 of AA access (design v3 §4.8): usage meters, agency lifecycle, members (ids and roles only), owner
    recovery and job / AI observability, with **no personal data in any response and no business figures**. No trip,
    pipeline, revenue, margin or commission field exists in any response (AA-Partner's response allow-list
    `app/ops/serializer.py` + closed response models, and the root contracts CI, enforce it). The only personal data
    the API ever receives is the first owner's e-mail address on POST /tenants/{tenant_id}/owner-invite (write-only:
    encrypted at rest, never stored in clear, logged, echoed in a 422 or returned, not even masked). Every call lands in
    that agency's own audit log (actor `platform:<staff sub>`, kind `aa_ops`; reads as `ops_read`, writes with the
    ticket reference as object id `ticket:<REF>`). Auth (root ADR 0006b decision 6): WORKFORCE access token of client
    cis-admin, relayed by the CIS admin API; groups cis-admin or crm-platform-admin may read, only crm-platform-admin
    may write (403 `missing_group` otherwise; GET /console tells the page which). The Dev-only E2E CIS admin (root ADR
    0006a A10b, a cis-admin token told apart by its `email` claim) is read-only: 403 `e2e_read_only` on every write,
    `can_write` false, and the studio-invitation relay only on the terms that route states. AA cannot switch features on for an
    agency (only allow them), cannot invite a first owner while the agency has an owner, a pending owner invitation
    or any traveller, and cannot run an export or deletion (it raises a request the owner confirms in the CRM).
    Version 1.1 (AA-941) is the first served version: it replaces in place the unserved 1.0 proposal (AA-928), whose
    shapes no consumer read except /jobs/summary and /llm/usage, which are unchanged. Version 1.2 (AA-978 follow-up, additive):
    TenantSummary gains `lock_source` (who locked the agency: AA's L1 console or the CIS membership feed) and the CIS
    membership feed's state and lag (`membership_feed_state`, `membership_feed_lag_s`), optional for a 1.1 reader. Version 1.3
    (AA-979 P2b, root ADR 0010a, additive): POST /tenants/{tenant_id}/studio-invitations delivers a Content studio
    invitation CIS created (the CIS staff relay of Tenant 360 Members; the tenant may have no CRM agency); its address is
    the second write-only personal-data field, and cis-admin may call it (it grants nothing in the CRM). Version 1.4
    (AA-992, additive): GET /data-coverage, platform-wide counts for the CIS admin page
    /admin/data-coverage (agencies and members per status, the AA catalog cache); counts only, no agency id and no
    business figure. It is the one read that lands in NO agency's audit log: it reads no agency's data, only statuses,
    and the CIS page refreshes it every 10 minutes, so one `ops_read` event per agency per refresh would bury each
    owner's access log; the CRM logs the call once instead (like /jobs/summary, which writes no event either). Version 1.5
    (AA-966, additive; spec module 17, design v3 S-03): GET /insights, AA insights across agencies for one dimension
    (destination, budget band, age band, party size band, current stage, Lost reason) over ONE calendar quarter (no
    other period, so two answers never overlap or nest and cannot be subtracted): a cell is returned only when it holds
    at least 10 travellers from at least 3 agencies and no agency holds more than 70 % of them, every other cell is
    withheld (only their number is returned, never a bucket, a count or a total), a trip counts its travellers once
    (once per destination for the destination dimension), an agency that opted out is never read, and no agency id
    appears; like /data-coverage it writes no agency audit event. The cells are live: two reads of a quarter differ by
    what changed in between, including an agency's opt-out (a platform write on the owner's request, audited). Version 1.6
    (AA-964, additive; root ADR 0009 §8, root ADR 0008a §6): GET /llm/calls, the CRM's own LLM ledger rows
    (`crm.llm_call` under the ledger v2 column contract, `app` = crm) for the CIS admin Calls tab, newest first across
    agencies or for one: ids, codes and numbers only (stage, role, provider, model, connection, wire id, status, refusal
    and error codes, tokens, guardrail text units, cost, latency, the sha256 of the scrubbed prompt, the prompt version,
    shadow / experiment flags, the scrub's entity total); never a prompt, an output, a placeholder value, the scrub
    receipt's per-kind counts or the member who asked. Each agency whose rows are returned gets one `ops_read` event
    (reason `llm_calls`) in its audit log. Version 1.7 (AA-964 S263 F1, crm-037; additive for a reader that maps an
    unknown status to `error`, as the CIS Calls tab does): `status` on GET /llm/calls (row and filter) adds the two
    other ledger v2 statuses, `billed_unusable` (billed, no usable answer) and `truncated` (cut at its token limit,
    never `ok`). Version 1.8 (AA-939 S263 join fix, additive): POST /tenants/{tenant_id}/owner-invite/withdraw closes
    the first-owner invitation AA sent while it is pending, or claimed and not accepted (a claimed one used to block a
    new owner invitation for its whole lifetime), and POST /tenants/{tenant_id}/delete deletes a synthetic (test)
    agency without members, travellers or legal holds (the agency name typed exactly; the row goes to the trash and its
    keys are crypto-shredded); a real agency is still deleted only by its owner's confirmed offboarding. Version 1.9
    (AA-1031 S264, additive for a reader that shows an unknown refusal code as it is): POST /tenants on the id of an
    agency in the trash (a deleted test agency) answers 409 `tenant_deleted` instead of `tenant_exists`; the id is
    never reused, so the caller creates a new CIS tenant. Version 1.10 (AA-1025 H1c S265, additive; root ADR 0009 §4,
    root ADR 0008a §6): GET and PUT /llm/app-profile, the CRM's app profile (AI switch, bulk pause, default daily AI
    budget of every agency together, degrade mode, the reason AI is off), the CRM copy of its row of the ecosystem app
    profiles; the CIS admin relays its edit of that row here (PUT, crm-platform-admin). A platform setting, not an
    agency's data: like /data-coverage it writes no agency audit event (CIS audits the edit), and it returns no staff
    id. The CRM gateway refuses with `app_disabled` / `app_budget_exhausted` (the refusal codes on GET /llm/calls).
    Version 1.11 (AA-1028 R1 slice 2, root ADR 0019 d1; additive for a reader that shows an unknown refusal code as it
    is): the agency's plan, seats and allowed features are the projection of the tenant's CIS account
    (tenant.entitlements.v1, the CRM's crm_entitlement_pull) once the pull has projected the agency. From then on
    PUT /tenants/{tenant_id}/entitlements-allowed answers 409 `entitlements_managed_by_cis` and writes nothing (AA
    changes the tenant's CRM add-on in CIS instead). While the agency is still `managed_by` `ops` (never projected:
    no CIS tenant, or the pull waits for CIS to hold a crm subscription) the PUT works as in 1.10.
    `Entitlements.managed_by` tells `cis` (projected from CIS) from `ops` (not projected yet).
    Version 1.12 (AA-1035 R2 close-out, root ADR 0019 d3 / d4; additive for a reader that shows an unknown code as
    it is): the CIS desk groups cis-customer_success and cis-support may also call the console, each only for the
    tenants CIS holds in that staff member's scope (customer_success: its book; support: its book and the pool). The
    CRM never takes that scope from the request (the relayed token is the staff member's own, so a header could be
    written by them): it asks CIS (tenant.membership.v1 1.3 getStaffTenantScope, M2M, cached at most 30 s) and
    serves a desk caller GET /console, GET /tenants (only its tenants, filtered before any agency is opened), the
    per-agency GETs and the studio-invitation relay of its tenants; 403 `tenant_outside_scope` for another tenant
    (whether it exists or not), 403 `missing_group` on a platform-wide read (/jobs/summary, /llm/usage, /llm/calls,
    /llm/app-profile, /data-coverage, /insights), on every write and, for a caller in cis-support but not
    cis-customer_success, on the agency account reads GET /tenants/{tenant_id}/usage and /entitlements (support sees
    no plan and no usage); 503 `cis_unavailable` when CIS cannot answer or its answer is about another identity or
    desk role than asked (fail closed; cis-admin and crm-platform-admin are unaffected). ConsoleAccess gains `scope` (`all` for cis-admin /
    crm-platform-admin). POST /tenants/{tenant_id}/studio-invitations takes `keep_address: true` in place of `email`:
    the CRM now also keeps each issued address sealed under a one-off data key of its KMS key (until the invitation is
    claimed) and sends again to it, so nobody types it again; 409 `address_not_kept` for an invitation that kept none.
    A caller in cis-support but not cis-customer_success / cis-admin never names an address (403
    `readdress_not_allowed`). A desk caller can call the CRM without CIS (it holds the relayed token), so the CRM
    asks CIS (tenant.membership.v1 getTenantMembers of that tenant, M2M) and delivers for it only an `invited`
    membership of that tenant with the role `viewer` or `editor`: 403 `owner_invitation_not_allowed` (the owner seat
    stays with cis-admin / crm-platform-admin), 403 `invitation_not_invited` (no open invitation with that id on that
    tenant).
    Errors are
    `{detail, message?, fields?, state?, member_limit?}` (Problem); a 422 names the failing fields only, never the
    submitted values.
  x-aa-contract: crm.ops.v1
  x-aa-producer: AA-Partner
  x-aa-consumers: [AA-CIS-App]
  x-aa-issues: [AA-928, AA-941, AA-939, AA-936, AA-933, AA-978, AA-979, AA-992, AA-966, AA-964, AA-1025, AA-1035]
servers:
  - url: /crm/ops/v1
security:
  - workforceStaff: []
paths:
  /console:
    get:
      operationId: getConsoleAccess
      summary: What the S-01 page may offer (write buttons only for crm-platform-admin) and the caller's scope (1.12)
      responses:
        "200":
          description: The caller's console rights
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConsoleAccess"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "`cis_unavailable` (a desk caller only, 1.12: CIS did not report its scope)"
  /tenants:
    get:
      operationId: listTenants
      summary: Agencies known to the CRM in tenant id order (keyset), with lifecycle state only
      description: One `ops_read` audit event per agency on the page.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of agencies
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Invalid"}
    post:
      operationId: createTenant
      summary: Create an agency without any member (write); the first owner is invited after
      description: >-
        Create-only: an id that already exists is 409 `tenant_exists` and nothing is written, whatever the agency's
        status (never a silent rename); since 1.9 an id whose agency is in the trash (a deleted test agency) is 409
        `tenant_deleted` (the id is never reused: create a new CIS tenant). Dev accepts synthetic agencies only, prod real ones only. The `agency_create`
        audit event carries `ticket:<REF>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantCreate"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`tenant_exists`, `tenant_deleted` (1.9), `synthetic_flag_mismatch`, `tenant_unavailable`"
        "422":
          $ref: "#/components/responses/Invalid"
          description: >-
            `invalid_request`, `invalid_display_name`, `invalid_locale`, `synthetic_required` (Dev),
            `synthetic_not_allowed` (prod)
  /tenants/{tenant_id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getTenant
      summary: One agency (any status)
      responses:
        "200":
          description: One agency
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/usage:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getTenantUsage
      summary: Fixed usage meters for one agency, current calendar month (no business figures)
      description: Not for a cis-support desk caller (1.12, 403 `missing_group`).
      responses:
        "200":
          description: Usage meters
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageMeters"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/lock:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: lockTenant
      summary: active → locked (write); already locked is a no-op without an audit event
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LockRequest"}
      responses:
        "200":
          description: Locked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`tenant_status` with `state` (offboarding / offboarded)"
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `invalid_reason`"
  /tenants/{tenant_id}/unlock:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: unlockTenant
      summary: locked → active (write); already active is a no-op without an audit event
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TicketRequest"}
      responses:
        "200":
          description: Unlocked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`tenant_status` with `state` (offboarding / offboarded)"
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/owner-invite:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: inviteFirstOwner
      summary: Invite the agency's first owner by e-mail (write; active agency only)
      description: >-
        Allowed only while the agency has no owner (active, or a member with role owner invited / active), no pending
        owner invitation and holds no traveller (any traveller row, trashed and archived included, or any stored
        inquiry); the plan's member limit applies. AA-Partner creates the partner-pool invitation (root ADR 0006b
        decision 5: single-use hashed token, expiring), stores the address vault-encrypted with a blind index and sends
        the AA system mail inside the transaction (a mail failure rolls it back). Accepting re-runs the owner and
        traveller rules for an invitation a platform actor sent. The address is never returned, logged or echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OwnerInviteRequest"}
      responses:
        "202":
          description: Accepted; the owner role is granted when the invited person accepts and enrols MFA
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerInviteAccepted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `owner_exists`, `owner_invite_pending`, `has_travellers`, `member_limit_reached` (with `member_limit`),
            `already_member`, `invitation_exists`, `tenant_locked`, `tenant_status` (with `state`)
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `invalid_email` (field names only, never the address)"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "`mail_not_configured`, `key_provider_not_configured`"
  /tenants/{tenant_id}/owner-invite/withdraw:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: withdrawFirstOwnerInvite
      summary: Withdraw the first-owner invitation AA sent (write; 1.8)
      description: >-
        Every live first-owner invitation a platform actor sent (pending, or claimed and not yet accepted) becomes
        `revoked`; its link answers 410 `invitation_used`. One `owner_invite_withdraw` event per invitation with
        `ticket:<REF>`. The owner's own team invitations are never touched. Afterwards POST .../owner-invite works
        again; a partner-pool account the withdrawn claim created and that never signed in gets a new temporary
        password when the next invitation to its address is claimed. Active and locked agencies.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TicketRequest"}
      responses:
        "200":
          description: Withdrawn (the newest invitation is named; every live one was withdrawn)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerInviteWithdrawn"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`tenant_not_found`, `owner_invite_not_found` (no live first-owner invitation)"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`tenant_status` with `state` (offboarding / offboarded)"
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/delete:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: deleteTestAgency
      summary: Delete a synthetic (test) agency (write; 1.8)
      description: >-
        Only an agency with `is_synthetic` true, the name typed exactly as the agency's name, no active or invited
        member, no traveller or stored inquiry and no active legal hold; active, locked or offboarded (never while it is
        being erased). In one transaction every live invitation is revoked, the agency's keys are crypto-shredded
        (anything encrypted under them, such as invited addresses, is unreadable for good) and the agency row goes to
        the trash: no context opens it any more, GET /tenants leaves it out and GET /tenants/{tenant_id} answers 404.
        Audited in the agency's own log (`agency_delete` with `ticket:<REF>`); a refused attempt on a real agency is a
        `denied` event. A real agency is deleted only by its owner's confirmed offboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeleteTestAgencyRequest"}
      responses:
        "200":
          description: Deleted (trashed, keys destroyed)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgencyDeleted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "`missing_group`, `e2e_read_only`, `not_synthetic` (a real agency; on record)"
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`has_members`, `has_travellers`, `legal_hold`, `tenant_status` (with `state`)"
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `agency_name_mismatch`"
  /tenants/{tenant_id}/studio-invitations:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: deliverStudioInvitation
      summary: Deliver a Content studio invitation CIS created (write; any OPS caller but the Dev E2E CIS admin, 1.3)
      description: >-
        `tenant_id` is the CIS tenant (it may have no CRM agency). CIS created the invited membership and decides its
        Content studio role; the CRM sends the AA system mail with a single-use link and owns claim and accept in the
        partner pool (crm.studio_invitation), then binds the accepted identity at CIS (tenant.membership.v1 1.1
        activateInvitation). Sending again for the same `cis_invitation_id` re-issues it (new link, the old one dies)
        while it is pending or expired. Any OPS caller may write it (cis-admin included): CIS checks tenant.write first
        and the call grants nothing in the CRM. No agency audit (there may be no agency). The address is never
        returned, logged or echoed; it is stored sealed under a key derived from the token.
        The Dev-only E2E CIS admin (root ADR 0006a A10b-1; a cis-admin token whose `email` claim is that identity's
        address) is checked again here, because the CRM is reachable without the CIS relay: only in a synthetic-only
        environment, for an address on the E2E mailbox domain, for a synthetic CRM agency with this `tenant_id`, and
        for a `cis_invitation_id` that CIS (tenant.membership.v1 getTenantMembers, M2M) reports as an `invited`
        membership of this tenant with the role `viewer` or `editor`. 403 `e2e_read_only` otherwise; 503
        `cis_unavailable` when CIS cannot answer. A desk caller (1.12) is checked against the same CIS answer: an
        `invited` `viewer` / `editor` membership of this tenant only. Other callers are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StudioInvitationRequest"}
      responses:
        "202":
          description: Accepted; the mail was sent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioInvitationAccepted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          $ref: "#/components/responses/Forbidden"
          description: >-
            `wrong_audience`, `missing_group`, `e2e_read_only` (the Dev E2E CIS admin outside its terms, or with
            `keep_address`), `tenant_outside_scope`, `readdress_not_allowed`, `owner_invitation_not_allowed` and
            `invitation_not_invited` (a desk caller, 1.12)
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `invitation_claimed`, `invitation_accepted`, `invitation_tenant_mismatch`, `address_not_kept` (1.12:
            `keep_address` on an invitation that kept no address)
        "410":
          $ref: "#/components/responses/Conflict"
          description: "`invitation_revoked`"
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `invalid_email`, `invalid_locale` (field names only, never the address)"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: >-
            `mail_not_configured`, `cis_unavailable` (the Dev E2E CIS admin or a desk caller: CIS did not answer)
  /tenants/{tenant_id}/entitlements:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getEntitlements
      summary: Plan, seats, features allowed and the insights opt-out
      description: Not for a cis-support desk caller (1.12, 403 `missing_group`).
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Entitlements"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/entitlements-allowed:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    put:
      operationId: setAllowedEntitlements
      summary: Features the agency owner may switch on (write while managed_by ops; the CIS account decides them after)
      description: Replaces the allowed list; never writes the owner's settings. Active or locked agency. Since 1.11
        only while the agency is managed_by ops (never projected from CIS); once crm_entitlement_pull has projected
        it, 409 entitlements_managed_by_cis and nothing written (audited as denied).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AllowedEntitlementsRequest"}
      responses:
        "200":
          description: Stored; the full entitlements
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Entitlements"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`tenant_status` with `state` (offboarding / offboarded); since 1.11
            `entitlements_managed_by_cis` once the agency is managed_by cis (the features follow the CIS account)"
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `invalid_feature` (unknown or repeated code)"
  /tenants/{tenant_id}/insights-opt-out:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    put:
      operationId: setInsightsOptOut
      summary: Set the AA insights opt-out on the owner's written request (write; spec module 17, Q2 3.12)
      description: Active or locked agency. The audit event carries the owner's request reference as `ticket:<REF>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InsightsOptOut"}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InsightsOptOutState"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`tenant_status` with `state` (offboarding / offboarded)"
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/data-requests:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: listDataRequests
      summary: The agency's latest export / deletion requests (10, newest first), coarse status only
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DataRequestList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
    post:
      operationId: raiseDataRequest
      summary: Raise an agency export or deletion request (write; active agency); the owner confirms it in the CRM
      description: >-
        Nothing runs until the owner confirms in Settings > Data and privacy; AA can never accept, confirm or run it
        (enforced in the database, crm-011). The agency's owners get an AA system mail (best effort,
        `owners_notified`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DataRequestCreate"}
      responses:
        "202":
          description: Waiting for the owner
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DataRequestRaised"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `offboarding_open` (one open export or deletion request per agency), `legal_hold` (deletion only),
            `tenant_locked`, `tenant_status` (with `state`)
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `invalid_kind`"
  /tenants/{tenant_id}/jobs:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: listFailedJobs
      summary: Failed crm.job rows of the agency (last 7 days)
      responses:
        "200":
          description: Failed jobs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FailedJobList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/jobs/{job_id}/retry:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: job_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: retryJob
      summary: Re-queue one failed job of the agency (write; active or offboarding agency)
      description: A `crm_offboard` retry continues an erase the owner confirmed (AA-942 recovery path).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TicketRequest"}
      responses:
        "202":
          description: Re-queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobRetried"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`tenant_not_found`, `job_not_found` (no failed job of this agency with this id)"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`tenant_locked` (the job would fail again), `tenant_status` (with `state`)"
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/members:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: listMembers
      summary: Member ids, roles and statuses, and a pending owner recovery (no identity data; any agency status)
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/members/{member_id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: deactivateMember
      summary: Disable a member and sign them out of the partner pool (write; active agency), even the last owner
      description: With no owner left, only an owner recovery makes a new one. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OptionalTicketRequest"}
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberDeactivated"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`tenant_not_found`, `member_not_found`"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`tenant_locked`, `tenant_status` (with `state`)"
        "422": {$ref: "#/components/responses/Invalid"}
  /tenants/{tenant_id}/owner-recovery:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: startOwnerRecovery
      summary: Open an owner recovery for an existing active member (write; active agency; Q1 6.3)
      description: >-
        The candidate becomes owner on POST .../complete, not before `eligible_at` (opened + 14 days); any member can
        cancel before then in the CRM. The agency's owners get an AA system mail (best effort, `owners_notified`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OwnerRecoveryCreate"}
      responses:
        "201":
          description: Recovery opened
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerRecoveryOpened"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`tenant_not_found`, `member_not_found`"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `candidate_inactive`, `candidate_is_owner`, `recovery_pending`, `tenant_locked`, `tenant_status` (with
            `state`)
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `invalid_reason`"
  /tenants/{tenant_id}/owner-recovery/{request_id}/complete:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: request_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: completeOwnerRecovery
      summary: Complete a due owner recovery; the candidate becomes owner (write; active agency)
      description: The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OptionalTicketRequest"}
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerRecoveryCompleted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`tenant_not_found`, `recovery_not_found`, `member_not_found`"
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            `recovery_not_due` (before `eligible_at`), `recovery_closed`, `candidate_inactive`, `tenant_locked`,
            `tenant_status` (with `state`)
        "422": {$ref: "#/components/responses/Invalid"}
  /jobs/summary:
    get:
      operationId: getJobSummary
      summary: crm.job backlog per kind (CIS sees CRM jobs; deploy and migrate guards)
      responses:
        "200":
          description: Job summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /data-coverage:
    get:
      operationId: getDataCoverage
      summary: Platform-wide counts for the CIS admin data coverage page (1.4; counts only, no agency audit event)
      responses:
        "200":
          description: Counts as of now
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DataCoverage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /insights:
    get:
      operationId: getInsights
      summary: AA insights across agencies for one quarter, published cells only (1.5; >= 10 travellers from >= 3 agencies, none above 70 %)
      description: >-
        Reads per active agency, as the NOLOGIN role crm_insights and after the agency's opt-out (Q2 3.12, set through
        PUT /tenants/{tenant_id}/insights-opt-out) was checked, `crm.v_insight_fact` (one row per trip and destination)
        for the destination dimension and `crm.v_insight_trip_fact` (crm-031, trips per band combination) for every
        other one, so a trip's travellers count once; synthetic agencies count only outside prod. Totals only: no agency
        audit event, one log line per call. Not guaranteed: changing one agency's opt-out between two reads of the same
        quarter shows that agency's share of the cells published both times.
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            enum: [destination, budget_band, age_band, party_size, stage_reached, lost_reason_code]
        - name: quarter
          in: query
          required: true
          description: One calendar quarter, `YYYY-Q1` to `YYYY-Q4`; no other period is served.
          schema: {type: string, pattern: "^20[0-9]{2}-Q[1-4]$"}
      responses:
        "200":
          description: The published cells, largest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Insights"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request` (unknown dimension, no quarter), `invalid_quarter` (not `YYYY-Q1` to `YYYY-Q4`)"
  /llm/usage:
    get:
      operationId: getLlmUsage
      summary: Daily CRM LLM usage per stage and model (root ADR 0008a decision 5; no text)
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        "200":
          description: Daily rows
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmUsage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `invalid_range` (`to` before `from`, or a range over the server's maximum)"
  /llm/app-profile:
    get:
      operationId: getLlmAppProfile
      summary: The CRM app profile (1.10; root ADR 0009 §4; no row = the defaults, AI on and no daily budget)
      responses:
        "200":
          description: The stored profile, or the defaults
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "`app_profile_unavailable` (crm-041 not applied)"
    put:
      operationId: putLlmAppProfile
      summary: Store the whole CRM app profile (1.10; write, crm-platform-admin; relayed by the CIS admin)
      description: >-
        Replaces the profile (inserted on the first write). AI off needs `disabled_reason` (3 to 500 characters); AI on
        clears it. Takes effect on the next AI call of any agency. No agency audit event (a platform setting); the row
        keeps the staff actor, which is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppProfileIn"}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `invalid_app_profile` (AI off without a reason, a value out of range)"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "`app_profile_unavailable` (crm-041 not applied)"
  /llm/calls:
    get:
      operationId: getLlmCalls
      summary: The CRM LLM ledger rows, newest first (1.6; root ADR 0009 §8; scrubbed fields only, no text)
      description: >-
        Rows of `crm.llm_call` in the UTC days `from` .. `to` (at most 31 days), across every agency or for
        `tenant_id`, ordered by (`at`, `call_id`) descending, keyset paged by `cursor` (the `next_cursor` of the
        previous page, `<at>~<call id>`). One `ops_read` audit event (reason `llm_calls`) in each agency whose rows were
        returned. Guardrail attempts of the PII scrub are rows of their own (stage `crm_scrub`, role `guard`, `units`
        text units).
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
        - name: tenant_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: stage
          in: query
          required: false
          schema: {type: string, pattern: "^crm_[a-z0-9_]{1,40}$"}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [ok, refused, error, billed_unusable, truncated]}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 120}
      responses:
        "200":
          description: One page of ledger rows
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmCalls"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/TenantNotFound"}
        "422":
          $ref: "#/components/responses/Invalid"
          description: "`invalid_request`, `invalid_range` (`to` before `from`, or more than 31 days), `invalid_cursor`"
components:
  securitySchemes:
    workforceStaff:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: WORKFORCE access token, client cis-admin; groups cis-admin (read) or crm-platform-admin (read, write).
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: The CIS tenant id (soft key, shared.tenants.id).
      schema: {type: string, format: uuid}
    MemberId:
      name: member_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page (a tenant id).
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    Unauthorized:
      description: "`missing_bearer_token`, `invalid_token`"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: >-
        `wrong_audience`, `missing_group` (a write without crm-platform-admin; 1.12: also a platform-wide read by a
        desk caller, and the agency usage / entitlements by a cis-support one), `e2e_read_only` (the Dev-only E2E CIS admin, root ADR 0006a A10b: read-only on every write),
        `tenant_outside_scope` (1.12: a desk caller, cis-customer_success / cis-support, and a tenant CIS does not
        hold in its scope, whether it exists or not)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
    TenantNotFound:
      description: "`tenant_not_found` (no agency with this id; the L1 console knows the agency list)"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: Refused by a state rule
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
    Invalid:
      description: "`invalid_request` (with `fields`: the names of the failing fields, never their values)"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unavailable:
      description: A dependency is not configured
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [detail]
      description: >-
        Every error body. Service errors carry `{detail, message}` plus the extras below; guard refusals (401 / 403)
        carry `detail` only. `detail` is a stable snake_case code (listed on each response).
      properties:
        detail: {type: string, pattern: "^[a-z][a-z0-9_]*$", maxLength: 64}
        message: {type: [string, "null"], maxLength: 500}
        fields:
          type: [array, "null"]
          description: On 422 `invalid_request`, the names of the failing fields (never the submitted values).
          items: {type: string, maxLength: 64}
        state:
          type: [string, "null"]
          description: On 409 `tenant_status`, the agency status that refused the call.
          enum: [active, locked, offboarding, offboarded, null]
        member_limit:
          type: [integer, "null"]
          minimum: 0
          description: On 409 `member_limit_reached`, the plan's member limit.
    ConsoleAccess:
      type: object
      additionalProperties: false
      required: [can_write, scope]
      properties:
        can_write:
          type: boolean
          description: The caller is in crm-platform-admin.
        scope:
          type: string
          enum: [all, book, book_pool, none]
          description: >-
            1.12: the tenants the caller reaches. `all` for cis-admin / crm-platform-admin; a desk caller gets the
            scope CIS reported (customer_success `book`, support `book_pool`, `none` for an unknown or inactive
            staff member).
    TicketRef:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9]{0,15}-[0-9]{1,10}$"
      description: >-
        Support ticket or Linear id that justifies the action (e.g. `SUP-1234`, `AA-941`); stored in the agency audit
        as object id `ticket:<REF>`.
    TenantState:
      type: string
      enum: [active, locked, offboarding, offboarded]
    TenantSummary:
      type: object
      additionalProperties: false
      required: [tenant_id, agency_name, state, is_synthetic, has_owner, holds_travellers, created_at]
      properties:
        tenant_id: {type: string, format: uuid}
        agency_name:
          type: string
          maxLength: 200
          description: The agency's business name (an organisation, not a person).
        state: {$ref: "#/components/schemas/TenantState"}
        is_synthetic:
          type: boolean
          description: Dev accepts only synthetic agencies (true); prod refuses them.
        has_owner:
          type: boolean
          description: An active owner exists.
        holds_travellers:
          type: boolean
          description: >-
            Whether any traveller row (trashed and archived included) or stored inquiry exists (gates the first-owner
            invite). A flag, never a count.
        created_at: {type: string, format: date-time}
        lock_source:
          type: [string, "null"]
          enum: [aa_ops, cis_tenant, cis_membership, null]
          description: >-
            1.2. Who locked the agency, set exactly while `state` is `locked` (null otherwise): `aa_ops` (the L1 console,
            and every lock placed before the CRM recorded a source), `cis_tenant` (CIS locked or deleted the tenant; a
            CIS unlock lifts only this one), `cis_membership` (CIS removed the last active owner; only the owner
            recovery or an AA unlock lifts it). An L1 lock over a CIS lock turns it into `aa_ops`.
        membership_feed_state:
          type: string
          enum: [ok, pending, stale, failing, unknown]
          description: >-
            1.2. The CIS membership feed (tenant.membership.v1) the CRM pulls, platform-wide (the same value on every
            agency): `ok`, `pending` (no successful pull yet, also while the feed is not configured), `stale` (no
            successful pull for 10 minutes), `failing` (the last pulls failed), `unknown` (the feed state cannot be
            read). Absent from a 1.1 producer: read as `unknown`.
        membership_feed_lag_s:
          type: [integer, "null"]
          minimum: 0
          description: >-
            1.2. Seconds since the last successful pull of the CIS membership feed (how late a CIS removal or lock may
            reach the CRM, at most); null before the first successful pull.
    TenantPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/TenantSummary"}
        next_cursor: {type: [string, "null"], format: uuid}
    TenantCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, agency_name, is_synthetic, ticket_ref]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: The CIS tenant id the agency is created under.
        agency_name: {type: string, minLength: 1, maxLength: 200}
        is_synthetic: {type: boolean}
        default_locale: {type: string, enum: [en-AU, en-GB, en-US, vi-VN], default: en-AU}
        ticket_ref: {$ref: "#/components/schemas/TicketRef"}
    UsageMeters:
      type: object
      additionalProperties: false
      required: [tenant_id, period_start, period_end, seats_used, seats_allowed, active_members_30d, storage_bytes,
                 inbound_mail_30d, ai_cost_usd_month, ai_budget_usd_month, failed_jobs_24h, last_activity_at]
      properties:
        tenant_id: {type: string, format: uuid}
        period_start:
          type: string
          format: date
          description: First day of the current calendar month (UTC).
        period_end:
          type: string
          format: date
          description: First day of the next calendar month (exclusive).
        seats_used: {type: integer, minimum: 0}
        seats_allowed:
          type: integer
          minimum: 0
          description: The plan's member limit.
        active_members_30d: {type: integer, minimum: 0}
        storage_bytes: {type: integer, minimum: 0}
        inbound_mail_30d:
          type: integer
          minimum: 0
          description: Always 0 until the inbox card (CRM-17) gives it a source.
        ai_cost_usd_month:
          type: string
          pattern: "^\\d+(\\.\\d{1,4})?$"
          description: AA's own platform AI spend for the agency this month (USD), not agency money.
        ai_budget_usd_month: {type: string, pattern: "^\\d+(\\.\\d{1,4})?$"}
        failed_jobs_24h: {type: integer, minimum: 0}
        last_activity_at: {type: [string, "null"], format: date-time}
    LockRequest:
      type: object
      additionalProperties: false
      required: [ticket_ref, reason_code]
      properties:
        ticket_ref: {$ref: "#/components/schemas/TicketRef"}
        reason_code: {type: string, enum: [owner_request, payment, abuse, security, test]}
    TicketRequest:
      type: object
      additionalProperties: false
      required: [ticket_ref]
      properties:
        ticket_ref: {$ref: "#/components/schemas/TicketRef"}
    OptionalTicketRequest:
      type: object
      additionalProperties: false
      description: Optional body; when sent, `ticket_ref` goes on the audit event.
      properties:
        ticket_ref:
          anyOf:
            - {$ref: "#/components/schemas/TicketRef"}
            - {type: "null"}
    OwnerInviteRequest:
      type: object
      additionalProperties: false
      required: [owner_email, ticket_ref]
      properties:
        owner_email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          writeOnly: true
          x-pii: contact
          description: >-
            Personal data (DM-6.1 class contact), write-only: the first owner's address, normalised and checked by the
            server (422 `invalid_email`), stored vault-encrypted with a blind index, never stored in clear, logged,
            echoed or returned. The only personal-data field crm.ops.v1 may carry (root checker policy
            `pii_write_only_fields`).
        ticket_ref: {$ref: "#/components/schemas/TicketRef"}
    OwnerInviteAccepted:
      type: object
      additionalProperties: false
      required: [tenant_id, invitation_id, status, expires_at]
      properties:
        tenant_id: {type: string, format: uuid}
        invitation_id:
          type: string
          format: uuid
          description: The CRM member invitation (crm.member_invitation), not a CIS membership invitation.
        status: {type: string, enum: [pending]}
        expires_at: {type: string, format: date-time}
    OwnerInviteWithdrawn:
      type: object
      additionalProperties: false
      required: [tenant_id, invitation_id, status]
      properties:
        tenant_id: {type: string, format: uuid}
        invitation_id:
          type: string
          format: uuid
          description: The newest withdrawn CRM member invitation.
        status: {type: string, enum: [revoked]}
    DeleteTestAgencyRequest:
      type: object
      additionalProperties: false
      required: [agency_name, ticket_ref]
      properties:
        agency_name:
          type: string
          minLength: 1
          maxLength: 200
          description: The agency's business name typed exactly as GET /tenants shows it (a confirmation, not data).
        ticket_ref: {$ref: "#/components/schemas/TicketRef"}
    AgencyDeleted:
      type: object
      additionalProperties: false
      required: [tenant_id, status]
      properties:
        tenant_id: {type: string, format: uuid}
        status: {type: string, enum: [deleted]}
    StudioInvitationRequest:
      type: object
      additionalProperties: false
      required: [cis_invitation_id]
      description: >-
        Exactly one of `email` and `keep_address: true` (1.12; 422 `invalid_request` otherwise). A 1.11 caller always
        sends `email`.
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          writeOnly: true
          x-pii: contact
          description: >-
            Personal data (DM-6.1 class contact), write-only: the invited person's address, relayed once by CIS (which
            never stores it), sealed by the CRM under a key derived from the invitation token, never stored in clear,
            logged, echoed or returned (root checker policy `pii_write_only_fields`). 1.12: also kept sealed under a
            one-off data key of the CRM KMS key until the invitation is claimed, for a send again with
            `keep_address`.
        keep_address:
          type: boolean
          default: false
          description: >-
            1.12: send again to the address the CRM kept for this `cis_invitation_id` (no `email`). The only way a
            cis-support caller sends again.
        cis_invitation_id:
          type: string
          format: uuid
          description: The invitation_id of the CIS membership (tenant.membership.v1); one CRM row per id.
        locale: {type: string, enum: [en, vi], default: en}
    StudioInvitationAccepted:
      type: object
      additionalProperties: false
      required: [invitation_id, tenant_id, status, expires_at, reissued]
      properties:
        invitation_id:
          type: string
          format: uuid
          description: The CIS invitation id (the CRM's own row id is not exposed).
        tenant_id: {type: string, format: uuid}
        status: {type: string, enum: [pending]}
        expires_at: {type: string, format: date-time}
        reissued: {type: boolean}
    Feature:
      type: string
      enum: [ai_assist, whatsapp_sms, stripe_connect, campaigns, custom_domain, insights_export]
    AllowedEntitlementsRequest:
      type: object
      additionalProperties: false
      required: [features_allowed, ticket_ref]
      properties:
        features_allowed:
          type: array
          uniqueItems: true
          maxItems: 6
          items: {$ref: "#/components/schemas/Feature"}
        ticket_ref: {$ref: "#/components/schemas/TicketRef"}
    Entitlements:
      type: object
      additionalProperties: false
      required: [plan, seats_allowed, features_allowed, insights_opt_out]
      properties:
        managed_by:
          type: string
          enum: [cis, ops]
          description: >-
            1.11: cis = projected from the tenant's CIS account by crm_entitlement_pull (PUT entitlements-allowed
            answers 409); ops = not projected yet (what the L1 console wrote; the PUT still works). Optional for a
            1.10 reader.
        plan: {type: string, enum: [free, core, pro]}
        seats_allowed: {type: integer, minimum: 0}
        features_allowed:
          type: array
          uniqueItems: true
          description: Sorted. Allowed only; the owner switches each one on.
          items: {$ref: "#/components/schemas/Feature"}
        insights_opt_out: {type: boolean}
    InsightsOptOut:
      type: object
      additionalProperties: false
      required: [opt_out, owner_request_ref]
      properties:
        opt_out: {type: boolean}
        owner_request_ref:
          $ref: "#/components/schemas/TicketRef"
          description: Reference of the owner's written request (same pattern as a ticket reference).
    AppProfile:
      type: object
      additionalProperties: false
      required: [app, ai_enabled, bulk_paused, default_daily_budget_usd, degrade_mode, disabled_reason, updated_at]
      properties:
        app: {type: string, const: crm}
        ai_enabled: {type: boolean}
        bulk_paused: {type: boolean}
        default_daily_budget_usd:
          type: [string, "null"]
          pattern: "^[0-9]{1,6}\\.[0-9]{4}$"
          description: USD a UTC day for every agency together (4 decimals); null = no daily budget
        degrade_mode: {type: string, enum: [manual_reply_needed]}
        disabled_reason: {type: [string, "null"], maxLength: 500}
        updated_at: {type: [string, "null"], format: date-time}
    AppProfileIn:
      type: object
      additionalProperties: false
      required: [ai_enabled]
      properties:
        ai_enabled: {type: boolean}
        bulk_paused: {type: boolean, default: false}
        default_daily_budget_usd:
          type: [string, number, "null"]
          description: 0 to 100000 USD, at most 4 decimals; null = no daily budget
        degrade_mode: {type: string, enum: [manual_reply_needed], default: manual_reply_needed}
        disabled_reason: {type: [string, "null"], maxLength: 500}
    InsightsOptOutState:
      type: object
      additionalProperties: false
      required: [opt_out]
      properties:
        opt_out: {type: boolean}
    DataRequestKind:
      type: string
      enum: [agency_export, agency_deletion]
    DataRequestStatus:
      type: string
      description: >-
        Coarse status for L1. `awaiting_owner_confirmation` = raised by AA, not yet confirmed; `confirmed` = the owner
        confirmed (or raised it); `export_downloaded` = an export the owner downloaded but has not closed (it still
        holds the agency's single open-request slot, so a new request is 409 `offboarding_open`); `rejected` = the
        owner declined an AA request; `cancelled` = cancelled after confirmation or by the owner; `failed` = the erase
        failed; `done` = erased, or an export downloaded and closed.
      enum: [awaiting_owner_confirmation, confirmed, export_downloaded, rejected, cancelled, failed, done]
    DataRequestCreate:
      type: object
      additionalProperties: false
      required: [kind, ticket_ref]
      properties:
        kind: {$ref: "#/components/schemas/DataRequestKind"}
        ticket_ref: {$ref: "#/components/schemas/TicketRef"}
    DataRequest:
      type: object
      additionalProperties: false
      required: [request_id, tenant_id, kind, status, raised_at]
      properties:
        request_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/DataRequestKind"}
        status: {$ref: "#/components/schemas/DataRequestStatus"}
        raised_at: {type: string, format: date-time}
    DataRequestRaised:
      type: object
      additionalProperties: false
      required: [request_id, tenant_id, kind, status, raised_at, owners_notified]
      properties:
        request_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/DataRequestKind"}
        status: {$ref: "#/components/schemas/DataRequestStatus"}
        raised_at: {type: string, format: date-time}
        owners_notified:
          type: integer
          minimum: 0
          description: How many owners the AA system mail reached (best effort).
    DataRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items: {$ref: "#/components/schemas/DataRequest"}
    FailedJob:
      type: object
      additionalProperties: false
      required: [job_id, kind, attempt, max_attempts, error_class, finished_at]
      properties:
        job_id: {type: string, format: uuid}
        kind: {type: string, pattern: "^crm_[a-z0-9_]+$"}
        attempt: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 0}
        error_class:
          type: [string, "null"]
          maxLength: 80
          description: The job row's error class (a short code, never a message with data), cut to 80 characters.
        finished_at: {type: [string, "null"], format: date-time}
    FailedJobList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/FailedJob"}
    JobRetried:
      type: object
      additionalProperties: false
      required: [job_id, status]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [queued]}
    MemberRow:
      type: object
      additionalProperties: false
      required: [member_id, role, status, joined_at]
      properties:
        member_id: {type: string, format: uuid}
        role: {type: string, enum: [owner, agent, assistant]}
        status: {type: string, enum: [invited, active, disabled]}
        joined_at: {type: [string, "null"], format: date-time}
    PendingRecovery:
      type: object
      additionalProperties: false
      required: [request_id, eligible_at]
      properties:
        request_id: {type: string, format: uuid}
        eligible_at: {type: [string, "null"], format: date-time}
    MemberList:
      type: object
      additionalProperties: false
      required: [members, active_owners, recovery]
      properties:
        members:
          type: array
          items: {$ref: "#/components/schemas/MemberRow"}
        active_owners: {type: integer, minimum: 0}
        recovery:
          description: The pending owner recovery, or null.
          anyOf:
            - {$ref: "#/components/schemas/PendingRecovery"}
            - {type: "null"}
    MemberDeactivated:
      type: object
      additionalProperties: false
      required: [member_id, status, signed_out, active_owners]
      properties:
        member_id: {type: string, format: uuid}
        status: {type: string, enum: [disabled]}
        signed_out:
          type: boolean
          description: The member was signed out of the partner pool.
        active_owners:
          type: integer
          minimum: 0
          description: Active owners left; 0 means only an owner recovery makes a new owner.
    OwnerRecoveryCreate:
      type: object
      additionalProperties: false
      required: [candidate_member_id, reason, ticket_ref]
      properties:
        candidate_member_id:
          type: string
          format: uuid
          description: An existing active member of the agency who is not an owner (never a new address).
        reason: {type: string, enum: [owner_left, owner_unreachable, no_owner]}
        ticket_ref: {$ref: "#/components/schemas/TicketRef"}
    OwnerRecoveryOpened:
      type: object
      additionalProperties: false
      required: [request_id, status, eligible_at, owners_notified]
      properties:
        request_id: {type: string, format: uuid}
        status: {type: string, enum: [pending]}
        eligible_at:
          type: [string, "null"]
          format: date-time
          description: Opened + 14 days; any member can cancel before then.
        owners_notified: {type: integer, minimum: 0}
    OwnerRecoveryCompleted:
      type: object
      additionalProperties: false
      required: [request_id, status, owner_member_id]
      properties:
        request_id: {type: string, format: uuid}
        status: {type: string, enum: [completed]}
        owner_member_id: {type: string, format: uuid}
    JobKindRow:
      type: object
      additionalProperties: false
      required: [kind, queued, running, failed_24h, oldest_queued_age_s]
      properties:
        kind: {type: string, pattern: "^crm_[a-z0-9_]+$"}
        queued: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        failed_24h: {type: integer, minimum: 0}
        oldest_queued_age_s: {type: [integer, "null"], minimum: 0}
    JobSummary:
      type: object
      additionalProperties: false
      required: [generated_at, kinds]
      properties:
        generated_at: {type: string, format: date-time}
        kinds:
          type: array
          items: {$ref: "#/components/schemas/JobKindRow"}
    AgencyCounts:
      type: object
      additionalProperties: false
      description: Agencies per lifecycle status; `synthetic` counts synthetic agencies of any status (also counted there)
      required: [active, locked, offboarding, offboarded, synthetic]
      properties:
        active: {type: integer, minimum: 0}
        locked: {type: integer, minimum: 0}
        offboarding: {type: integer, minimum: 0}
        offboarded: {type: integer, minimum: 0}
        synthetic: {type: integer, minimum: 0}
    MemberCounts:
      type: object
      additionalProperties: false
      description: Agency members (all agencies) per status
      required: [active, invited, disabled]
      properties:
        active: {type: integer, minimum: 0}
        invited: {type: integer, minimum: 0}
        disabled: {type: integer, minimum: 0}
    CatalogCacheCounts:
      type: object
      additionalProperties: false
      description: The CRM's cache of published AA tours (crm_catalog_sync) per served state, and the sync's state
      required: [served, paused, retired, last_full_pass_at, last_ok_at, failures, last_error_class]
      properties:
        served: {type: integer, minimum: 0}
        paused: {type: integer, minimum: 0}
        retired: {type: integer, minimum: 0}
        last_full_pass_at: {type: [string, "null"], format: date-time}
        last_ok_at: {type: [string, "null"], format: date-time}
        failures: {type: integer, minimum: 0}
        last_error_class: {type: [string, "null"], pattern: "^[a-z][a-z0-9_]{0,59}$"}
    DataCoverage:
      type: object
      additionalProperties: false
      required: [as_of, agencies, members, catalog_cache]
      properties:
        as_of: {type: string, format: date-time}
        agencies: {$ref: "#/components/schemas/AgencyCounts"}
        members: {$ref: "#/components/schemas/MemberCounts"}
        catalog_cache: {$ref: "#/components/schemas/CatalogCacheCounts"}
    InsightCell:
      type: object
      additionalProperties: false
      required: [bucket, traveller_count, agency_count]
      properties:
        bucket: {type: string, maxLength: 40, description: "The dimension's value (a destination code, a band, a stage or reason code)"}
        traveller_count: {type: integer, minimum: 10, description: "Travellers summed over the cell's trips (a trip once; per destination for the destination dimension); no agency holds more than 70 % of them"}
        agency_count: {type: integer, minimum: 3}
    Insights:
      type: object
      additionalProperties: false
      required: [generated_at, dimension, quarter, from, to, agencies_included, agencies_opted_out, k_min, agencies_min,
                 cells, suppressed_cells]
      properties:
        generated_at: {type: string, format: date-time}
        dimension:
          type: string
          enum: [destination, budget_band, age_band, party_size, stage_reached, lost_reason_code]
        quarter: {type: string, pattern: "^20[0-9]{2}-Q[1-4]$", description: The calendar quarter asked for}
        from: {type: string, format: date, description: First day of the quarter's first month}
        to: {type: string, format: date, description: First day of the quarter's last month}
        agencies_included: {type: integer, minimum: 0}
        agencies_opted_out: {type: integer, minimum: 0}
        k_min: {type: integer, const: 10}
        agencies_min: {type: integer, const: 3}
        cells:
          type: array
          items: {$ref: "#/components/schemas/InsightCell"}
        suppressed_cells: {type: integer, minimum: 0, description: How many cells were withheld (below a threshold, or one agency above 70 %)}
    LlmUsageRow:
      type: object
      additionalProperties: false
      required: [day, stage, model, calls, failed_calls, input_tokens, output_tokens, cost_usd]
      properties:
        day: {type: string, format: date}
        stage: {type: string, pattern: "^crm_[a-z0-9_]+$"}
        model: {type: string, maxLength: 120}
        calls: {type: integer, minimum: 0}
        failed_calls: {type: integer, minimum: 0}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        cost_usd: {type: string, pattern: "^\\d+(\\.\\d{1,6})?$"}
    LlmCallRow:
      type: object
      additionalProperties: false
      required: [call_id, tenant_id, at, app, stage, role, provider, model, status, input_tokens, output_tokens, cost_usd,
                 latency_ms, is_shadow, is_experiment]
      properties:
        call_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        at: {type: string, format: date-time}
        app: {type: string, const: crm}
        stage: {type: string, pattern: "^crm_[a-z0-9_]+$"}
        role: {type: string, enum: [writer, judge, validate, guard]}
        provider: {type: string, pattern: "^[a-z][a-z0-9_]{0,30}$"}
        model: {type: string, maxLength: 120}
        family: {type: [string, "null"], maxLength: 41}
        connection_key: {type: [string, "null"], maxLength: 64}
        deployment_wire_id: {type: [string, "null"], maxLength: 160}
        attempt_no: {type: [integer, "null"], minimum: 1}
        provider_request_id: {type: [string, "null"], maxLength: 128, description: The provider's request id (Bedrock RequestId)}
        job_id: {type: [string, "null"], format: uuid}
        status: {type: string, enum: [ok, refused, error, billed_unusable, truncated]}
        refusal_code: {type: [string, "null"], pattern: "^[a-z][a-z0-9_]{0,39}$"}
        error_class: {type: [string, "null"], pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        cache_read_tokens: {type: [integer, "null"], minimum: 0}
        cache_write_tokens: {type: [integer, "null"], minimum: 0}
        units: {type: [integer, "null"], minimum: 0, description: Billed units that are not tokens (guardrail text units)}
        unit_kind: {type: [string, "null"], maxLength: 31}
        cost_usd: {type: string, pattern: "^\\d+(\\.\\d{1,6})?$"}
        pricing_mode: {type: [string, "null"], pattern: "^(override|catalog|code_table|estimate)(\\+batch)?(\\+geo_us)?$"}
        latency_ms: {type: integer, minimum: 0}
        prompt_hash: {type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: sha256 of the scrubbed prompt, never the prompt}
        prompt_version: {type: [string, "null"], maxLength: 40}
        is_shadow: {type: boolean}
        is_experiment: {type: boolean}
        scrub_entities: {type: [integer, "null"], minimum: 0, description: How many values the PII scrub replaced (a total, no kinds)}
    LlmCalls:
      type: object
      additionalProperties: false
      required: [from, to, rows, next_cursor]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        rows:
          type: array
          items: {$ref: "#/components/schemas/LlmCallRow"}
        next_cursor: {type: [string, "null"], maxLength: 120}
    LlmUsage:
      type: object
      additionalProperties: false
      required: [from, to, rows]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        rows:
          type: array
          items: {$ref: "#/components/schemas/LlmUsageRow"}
