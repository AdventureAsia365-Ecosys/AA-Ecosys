# Secrets register (AA-878). Machine-readable twin of secrets-register.md: same rows.
#
# NAMES AND METADATA ONLY. Never put a secret value, a partial value or a hash here.
#
# Drift check (AA-CIS-Infra tools/secrets/register_check.py) compares this file with
# `aws secretsmanager list-secrets`, `gh secret list` per repo/env/org, Vercel env names and
# Lambda env keys. How to run it: secrets-register.md, "How to run the drift check".
#
# Row fields:
#   name          secret / variable name exactly as the store shows it
#   store         secretsmanager:acc2 | github:<repo> | github:<repo>/<env> | github:org |
#                 vercel:<project> | lambda-env:<function> | vendor:<vendor>   (vendor rows are not
#                 machine-checked: credentials held at a vendor, or a value that lives only there)
#   owner_app     cis | tripplanner | booking | identity | infra | ecosystem
#   owner         person accountable (TBD-tech-lead where only the tech lead can say)
#   consumers     who reads it, file:line on main (worktrees under .claude/worktrees excluded)
#   managed_by    Terraform address | cli (created by hand) | app-runtime (the app creates it)
#   rotation      none | manual (last date) | TBD-tech-lead
#   last_changed  Secrets Manager LastChangedDate (proxy for the last rotation), or TBD-M0
#   status        keep          in use, must exist
#                 open-item     in use, must exist, has an open finding (see notes)
#                 pending-x1    exists, its consumer arrives with X1 (AA-852/AA-860)
#                 planned       added this session, not created yet (flip to keep once it exists)
#                 orphan-delete no consumer; delete after DRY RUN + the tech lead OK (AA-878 M2)
#                 pending-removal  a plaintext/dead Lambda env key an open PR removes
#                 deleted / removed  gone (or scheduled for deletion); kept for the deletion log
#
# Inventory used: acc2 list-secrets 19/10/2026 (31 secrets, 0 rotation enabled, 0 scheduled for
# deletion), Lambda env keys 19/10, ECS task-def secret refs 19/10, workflow `secrets.*` refs on main
# of the 4 app/infra repos, S241 audit (GitHub + Vercel names, 17/10). GitHub and Vercel scopes are
# confirmed by the main session's M0 listing (`gh secret list` is not available to subagents).
# S244 update (19/10/2026, evening): acc2 list-secrets re-read (33 names: 29 live, 4 deleted in the
# recovery window, 0 rotation enabled); AA-816 Stage S (S1, C9, I6, break-glass rotation) and X1
# S20/S22 (db_migrator) recorded; GitHub and Vercel changes taken from the main session's report.
# S245 update (20/10/2026): first drift check with all four inventories (acc2 list-secrets, Lambda env
# keys, GitHub names per repo/env from the main session's listing, Vercel env names via the Vercel MCP
# without decrypt): diff = 8 before, diff = 0 after. GitHub org secrets not listable (403); no org row.

# S247 update (22/10/2026): ROOT_REPO_DOCS_TOKEN deleted (Infra docs workflows on the aa-ecosys-ci-bot
# App token, AA-CIS-Infra #281); the three unused GitHub PATs flagged for revoke (pending the tech lead);
# DataForSEO exposure in public AA-CIS-Infra history recorded (ADR 0014 amendment). No live drift check
# this update (no fresh inventories).

# S250 update (25/10/2026): acc2 list-secrets re-read (53 names: 49 live, 4 in the deletion window). Added the
# S250 secrets (aa-cis/dev/redis-auth AA-874, tripplanner/dev/cognito-bff-key + cognito-signup-proof-key AA-908,
# crm/dev/mail-oauth AA-945) and the S248-S249 names missing from the YAML (CRM web, CRM M2M client, CRM e2e
# users, TripPlanner revalidate HMAC, a second tenant CMS secret); crm DSN + Sentry DSN flipped to keep; AA-Partner
# GitHub rows (portal deploy moved from AA-CIS-App, AA-979 P2a); TripPlanner traveller Vercel env names (AA-908).
# No booking/dev/e2e-test-staff secret: the second WORKFORCE E2E staff (Infra #361) signs in by email code only.
