    reason: F2 and E1 teach what the content system owns, in the repo's own words.
  - ref: context:AA-Booking#role-in-the-ecosystem
    tier: staff
    reason: F2 and E1 teach what the booking back office owns, in the repo's own words.
  - ref: context:AA-Partner#role-in-the-ecosystem
    tier: staff
    reason: F2 and E1 teach what the agency CRM owns, in the repo's own words.
  - ref: context:AA-TripPlanner-Web#what-it-is-role-in-the-aa-ecosystem
    tier: staff
    reason: F2 and E1 teach what the traveller trip planner owns, in the repo's own words.
  - ref: context:AA-CIS-Infra#what-it-is-role-in-the-aa-ecosystem
