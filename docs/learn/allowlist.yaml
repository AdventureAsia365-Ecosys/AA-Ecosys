# AA Academy publication allowlist (decision D13). Default deny: the learn bundle publishes a section of a skill, a
# steering file or an app repo's CONTEXT.md only when it is listed here, one entry per section, and an agency
# (partner tier) module cites only the catalog pages under partner_pages. A change to this file is an access change:
# review it as a risky change before merge. Schema: docs/learn/schema/allowlist.schema.json; checked by
# tools/docs/check_learn.py (the redaction guard runs on every listed section).
