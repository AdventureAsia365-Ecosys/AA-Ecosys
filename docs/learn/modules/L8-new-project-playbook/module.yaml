# AA Academy module L8 (Tech lead path, GUIDE-13 research §3.4 and §3.10). Format: docs/learn/README.md. Checked by
# tools/docs/check_learn.py. Teaches the new-project playbook (GUIDE-14, docs/playbook/) by reference: every lesson
# points at the phase pages' sections and never copies them. Draft until the tech lead approves it (maker-checker);
# learners with the preview capability see it marked draft. The sha pins are written by
# `python tools/docs/check_learn.py --pin` after the owner has read the cited sections.
id: L8
title: New-project playbook
tier: staff
status: draft
version: 0.1.0
owner: nghiep
last_reviewed: 2026-11-17
review_every_days: 90
languages: [en]
objectives:
  - Walk a new project through the nine playbook phases and name the gate that closes each one.
  - Tell who is accountable in each phase, and why an agent can be responsible but never accountable.
  - Rate a gate checklist red, amber or green, and say what each rating lets the project do next.
  - Pick the path of an issue (fix, small, feature, risky) and the review it needs before merge.
  - Say which measured trigger starts the scale phase and what proves a retirement is complete.
prerequisites: [L1, L2, L3, L4, L5, L6, L7]
quiz: quiz.yaml
