name: Docs lint
# AA-888: the root repo's first workflow. Checks the docs standard (docs/STYLE.md, AA-887):
#   - front-matter of catalog pages against docs/templates/frontmatter.schema.json, unique IDs
#   - ADR status lines and the ADR index (docs/adr/README.md)
#   - no backslash-continued AWS CLI command in docs, skills, steering or .claude (WSL2 hang)
#   - literal resource IDs in docs prose: warn-only here (private repo, docs/STYLE.md)
#   - Markdown style (markdownlint, .markdownlint-cli2.jsonc): catalog pages under docs/ (journals, archive and
#     generated pages are ignored in the config)
#   - internal links, offline (lychee): no network, no external sites
#   - every alarm row of docs/generated/alarms.md links to an existing runbook (AA-893)
#   - the AI gateway guide names only stages, models, connections and secrets that exist (AA-1042)
#   - PRDs (docs/product/): required PRD fields, acceptance criteria, and every referenced path exists (AA-894)
#   - the report registry docs/reports/*.yaml (AA-1003): shape, KPI references, templates, source tables
#   - the tracker docs/backlog/tracker/plan.json (S263): plan_sync.py tests, shape, no account ID or ARN
#   - unit tests of the orchestrator ship tools tools/github/ship_*.py (AA-1032; offline, scripted gh/aws, temp git)
#   - unit tests of the architecture video gate tools/uat/arch (AA-1021; stdlib, invented names, temp git, no media)
#   - unit tests of the ops helpers tools/ops (AA-1023: ecs_rollback.sh against a scripted aws/curl, the game-day seed)
# Secrets: gitleaks runs on every PR (any path) in secret-scan.yml and nightly over the full history in
# secret-scan-history.yml (AA-981),
# so it is not repeated here (secret names are fine in docs, values never are).
# Weekly (and on demand): freshness report of pages past their review date, as a run artifact.
# Nothing is committed; no AWS access, no secrets beyond the default read-only token.
#
# Cost: GitHub Free gives 2,000 Actions minutes a month on private repos. One job per docs PR
# (about 1 minute) plus one short job a week. The workflow runs only when docs-related paths change.
# Run the same checks locally: tools/docs/README.md.
on:
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "skill/**"
      - ".kiro/steering/**"
      - ".claude/**/*.md"
      - "tools/docs/**"
      - "tools/linear/**"
      - "tools/github/**"
      - "tools/uat/arch/**"
      - "tools/ops/**"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-lint.yml"
  schedule:
    - cron: "17 1 * * 1" # Mondays 01:17 UTC (08:17 in Vietnam)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Docs lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt

      - name: Install lint dependencies
        id: deps
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      # Every check below runs even when an earlier one failed, so one run shows all problems.
      - name: Unit tests of the lint tools
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m unittest discover -s tools/docs -p 'test_*.py'

      # S263 (AA-896 plan-sync): the tracker plan.json keeps its file format (indent 1, so plan_sync.py --write does
      # not churn), its due/risks shape, and carries no account ID or ARN (the tracker page can be shared). Offline.
      - name: Tracker plan (plan_sync tests + plan.json checks)
        if: ${{ !cancelled() }}
        run: |
          python -m unittest discover -s tools/linear -p 'test_*.py'
          python tools/linear/plan_sync.py --validate

      # AA-1032: ship_merge / ship_train / ship_copy_apply / ship_open_prs. Offline: gh and aws are scripted, git runs in
      # temporary repositories; nothing reaches GitHub or AWS.
      - name: Ship tools tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tools/github -p 'test_*.py'

      # AA-1021: the public-content gate of the architecture videos (planted brand word, account-ID-shaped number and
      # hostname must each fail every layer that sees text). Stdlib only; no TTS, browser, ffmpeg or OCR in CI.
      - name: Architecture video gate tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tools/uat/arch/tests -p 'test_*.py'

      # AA-1023: the ECS rollback helper (dry run by default) against a scripted aws and curl, and the game-day seed
      # script's logic on a fake connection. Offline; needs bash and jq (on the runner image).
      - name: Ops tools tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tools/ops -p 'test_*.py'

      - name: Front-matter schema
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python tools/docs/check_frontmatter.py

      # AA-894: every path a PRD front matter lists (adrs, contracts, erd, migrations) exists; PRDs under docs/product/
      # carry those fields, Linear keys and an acceptance-criteria list (rules: docs/product/README.md).
      - name: PRD references
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python tools/docs/check_prd_refs.py

      - name: ADR status and index
        if: ${{ !cancelled() }}
        run: python tools/docs/check_adr_index.py docs/adr

      - name: Single-line AWS CLI
        if: ${{ !cancelled() }}
        run: python tools/docs/check_docs_text.py aws-multiline

      # AA-893: every alarm in the generated catalog (docs/generated/alarms.md) links to a runbook that exists here.
      - name: Alarm runbook links
        if: ${{ !cancelled() }}
        run: python tools/docs/check_alarm_runbooks.py

      # AA-1042: every stage, model and connection key the AI gateway guide (docs/architecture/ai-gateway.md and its
      # .vi.md, rendered by the CIS admin Guide tab) names exists in the committed route snapshot
      # (docs/generated/llm-routes.snapshot.json), and every secret name it names has a secrets-register row. Names only.
      - name: AI gateway guide names
        if: ${{ !cancelled() }}
        run: python tools/docs/check_ai_gateway_names.py

      # AA-1003 R1: the report registry (docs/reports/catalog.yaml + kpis.yaml): shape, KPI references, template
      # paths, and every KPI source table against docs/architecture/db-schema-reference.md.
      - name: Report registry
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python tools/docs/report_registry.py check

      - name: Literal resource IDs (warn-only)
        if: ${{ !cancelled() }}
        run: python tools/docs/check_docs_text.py resource-ids --mode warn

      # Failing since the existing pages were cleaned up (AA-888, S245). The scope (what is ignored and why) and the
      # rule settings are in .markdownlint-cli2.jsonc; the action pins markdownlint-cli2 0.23.2.
      - name: Markdown style
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: docs/**/*.md

      - name: Internal links (offline)
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # docs/linear-export holds generated copies of Linear issues; their links are Linear's own markdown (S245).
          args: --config tools/docs/lychee.toml --exclude-path docs/linear-export 'docs/**/*.md'
          fail: true
          jobSummary: true

  freshness:
    name: Docs freshness report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt

      - name: Install lint dependencies
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      - name: Build the freshness report (warn-only)
        run: |
          python tools/docs/check_frontmatter.py --freshness-report freshness/freshness.md
          cat freshness/freshness.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: docs-freshness
          path: freshness/freshness.md
          retention-days: 30
