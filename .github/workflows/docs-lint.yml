name: Docs lint
# AA-888: the root repo's first workflow. Checks the docs standard (docs/STYLE.md, AA-887):
#   - front-matter of catalog pages against docs/templates/frontmatter.schema.json, unique IDs
#   - ADR status lines and the ADR index (docs/adr/README.md)
#   - no backslash-continued AWS CLI command in docs, skills, steering or .claude (WSL2 hang)
#   - literal resource IDs in docs prose: warn-only here (private repo, docs/STYLE.md)
#   - Markdown style (markdownlint, .markdownlint-cli2.jsonc): catalog pages under docs/ (journals, archive and
#     generated pages are ignored in the config)
#   - internal links, offline (lychee): no network, no external sites; the binary comes from a cached, hash-checked
#     copy (.github/actions/lychee, S273), warmed on master by the lychee-cache job
#   - every alarm row of docs/generated/alarms.md links to an existing runbook (AA-893)
#   - every image a docs page shows resolves, has alt text and stays under the 300 KB screenshot cap (AA-1064)
#   - the AI gateway guide names only stages, models, connections and secrets that exist (AA-1042)
#   - PRDs (docs/product/): required PRD fields, acceptance criteria, and every referenced path exists (AA-894)
#   - the report registry docs/reports/*.yaml (AA-1003): shape, KPI references, templates, source tables
#   - the tracker docs/backlog/tracker/plan.json (S263): plan_sync.py tests, shape, no account ID or ARN
#   - unit tests of the orchestrator ship tools tools/github/ship_*.py (AA-1032; offline, scripted gh/aws, temp git)
#   - unit tests of the architecture video gate tools/uat/arch (AA-1021; stdlib, invented names, temp git, no media)
#   - unit tests of the UAT take upload check tools/uat/check_takes_uploaded.py (S281; stdlib, scripted rclone)
#   - unit tests of the ops helpers tools/ops (AA-1023: ecs_rollback.sh against a scripted aws/curl, the game-day seed)
#   - the Claude Code hooks .claude/hooks (AA-1024 G5): every hook's tests, and every hook settings.json registers exists
#   - the lessons log (AA-1024 G22): a new or changed lesson line carries a valid Guard field
#   - the AA Academy course files under docs/learn/ (AA-1104): shape, references, pinned source hashes (a cited
#     section that changed turns the check red until the module owner re-pins), tiers and the allowlist
#   - the ECS exec wrapper tools/ecs (AA-1024 G3) and the GIT_DIR isolation of the pre-push hook (S272)
# Secrets: gitleaks runs on every PR (any path) in secret-scan.yml and nightly over the full history in
# secret-scan-history.yml (AA-981),
# so it is not repeated here (secret names are fine in docs, values never are).
# Weekly (and on demand): freshness report of pages past their review date, as a run artifact.
# Nothing is committed; no AWS access, no secrets beyond the default read-only token.
#
# Cost: GitHub Free gives 2,000 Actions minutes a month on private repos. One job per docs PR
# (about 1 minute) plus one short job a week. The workflow runs only when docs-related paths change.
# Run the same checks locally: tools/docs/README.md.
on:
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "skill/**"
      - ".kiro/steering/**"
      - ".claude/**/*.md"
      - ".claude/hooks/**"
      - ".claude/settings.json"
      - "tools/workflows/**"
      - "tools/docs/**"
      - "tools/linear/**"
      - "tools/github/**"
      - "tools/uat/arch/**"
      # S281: the UAT take upload check that the UAT-1 hook rule loads
      - "tools/uat/check_takes_uploaded.py"
      - "tools/uat/tests/test_check_takes_uploaded.py"
      - "tools/ops/**"
      - "tools/llm/**"
      # AA-1024 S272: the files tools/github/test_git_env_isolation.py and the ecsx tests guard (GIT_DIR, ECS exec)
      - ".githooks/**"
      - "scripts/pre-push.sh"
      - "tools/ecs/**"
      - "tools/kit/**"
      - "tools/llm-core/**"
      - "tools/adr/**"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-lint.yml"
      - ".github/actions/lychee/**"
      - ".github/scripts/lychee_bin.py"
  # S273: a push to master that moves the lychee pin warms the cache entry every pull request reads (lychee-cache job).
  push:
    branches: [master]
    paths:
      - ".github/actions/lychee/**"
      - ".github/scripts/lychee_bin.py"
  schedule:
    - cron: "17 1 * * 1" # Mondays 01:17 UTC (08:17 in Vietnam)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Docs lint
    if: github.event_name != 'schedule' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # S273 (workflow_lint WL4): restore on every ref; only the default branch saves this cache
      # (a pull request or merge-queue copy is readable only by that ref).
      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('tools/docs/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-

      - name: Install lint dependencies
        id: deps
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      # Every check below runs even when an earlier one failed, so one run shows all problems.
      - name: Unit tests of the lint tools
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m unittest discover -s tools/docs -p 'test_*.py'

      # S263 (AA-896 plan-sync): the tracker plan.json keeps its file format (indent 1, so plan_sync.py --write does
      # not churn), its due/risks shape, and carries no account ID or ARN (the tracker page can be shared). Offline.
      - name: Tracker plan (plan_sync tests + plan.json checks)
        if: ${{ !cancelled() }}
        run: |
          python -m unittest discover -s tools/linear -p 'test_*.py'
          python tools/linear/plan_sync.py --validate

      # AA-1032: ship_merge / ship_train / ship_copy_apply / ship_open_prs. Offline: gh and aws are scripted, git runs in
      # temporary repositories; nothing reaches GitHub or AWS.
      - name: Ship tools tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tools/github -p 'test_*.py'

      # AA-1024 G5: a broken hook regex fails open or blocks every call without anyone noticing. Offline: the hooks
      # read only the command text, temporary files and a fake /proc. Also checks that every hook command in
      # .claude/settings.json exists, is executable and has a test.
      - name: Claude hook tests
        if: ${{ !cancelled() }}
        run: |
          bash .claude/hooks/test_subagent_guardrails.sh
          bash .claude/hooks/test_kit_core_edit_guard.sh
          python -m unittest discover -s .claude/hooks -p 'test_*.py'

      # AA-1024 G22: every lesson line a PR adds or changes ends with a Guard field (skill/aa-lessons/SKILL.md section
      # 3): a guard that exists, a planned GRD/AA id, or "none: <judgement|external|one-off> <why>". Old lines pass.
      - name: Lessons log (Guard field)
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
          # a guard path in a child repo (apps/..., infra/...) is checked on that repo's main (public; read token)
          LESSONS_REMOTE_CHECK: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python tools/docs/check_lessons.py --base FETCH_HEAD

      # AA-1021: the public-content gate of the architecture videos (planted brand word, account-ID-shaped number and
      # hostname must each fail every layer that sees text). Stdlib only; no TTS, browser, ffmpeg or OCR in CI.
      - name: Architecture video gate tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tools/uat/arch/tests -p 'test_*.py'

      # S281: PASS UAT takes not packaged + rclone-checked (the hook rule UAT-1 refuses removing their worktree).
      # Stdlib only, invented take names, a scripted rclone.
      - name: UAT take upload check tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tools/uat/tests -p 'test_check_takes_uploaded.py'

      # AA-1023: the ECS rollback helper (dry run by default) against a scripted aws and curl, and the game-day seed
      # script's logic on a fake connection. Offline; needs bash and jq (on the runner image).
      - name: Ops tools tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tools/ops -p 'test_*.py'

      # AA-1024 G18: the one cost source (spend_by_stage.py, cost_estimate.py) on invented rows: a typesafe / Jev or
      # DataForSEO row is never counted as LLM, a total is a lower bound until the log-write failures are 0, and an
      # estimate without a measured basis refuses to give a number. Offline (asyncpg is imported only in the container).
      - name: LLM spend tools tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tools/llm -p 'test_*.py'

      # AA-1024 G3: the ecsx runner (tools/ecs): pid claim, nostart / dead states, heartbeat, one auto-restart, the
      # script-timeout refusal, the local output copy. Offline: aws is scripted, files live in a temporary directory.
      - name: ECS exec wrapper tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tools/ecs -p 'test_*.py'

      - name: Front-matter schema
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python tools/docs/check_frontmatter.py

      # AA-1104 (AA Academy, GUIDE-13): the course files under docs/learn/ against docs/learn/schema/, every lesson and quiz
      # reference resolves, every source carries the hash of the section it cites (a change to that section fails here
      # until the module owner reads it and runs `check_learn.py --pin`), partner modules cite partner pages only, and
      # skill / steering / CONTEXT.md sections only through docs/learn/allowlist.yaml. App CONTEXT.md files are not
      # checked out here (a notice); Docs sync reads them. Its tests (test_check_learn.py, test_learn_bundle.py) run in
      # the unit test step above, including the committed sample module turning red on a source change.
      - name: AA Academy course files
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python tools/docs/check_learn.py

      # AA-894: every path a PRD front matter lists (adrs, contracts, erd, migrations) exists; PRDs under docs/product/
      # carry those fields, Linear keys and an acceptance-criteria list (rules: docs/product/README.md).
      - name: PRD references
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python tools/docs/check_prd_refs.py

      - name: ADR status and index
        if: ${{ !cancelled() }}
        run: python tools/docs/check_adr_index.py docs/adr

      - name: Single-line AWS CLI
        if: ${{ !cancelled() }}
        run: python tools/docs/check_docs_text.py aws-multiline

      # AA-1064: every image a docs page shows can be published to the CIS docs reader: alt text, a committed file
      # under docs/ outside the never-published folders, SVG / PNG / WebP, a screenshot at most 300 KB with no ID in its
      # metadata (the bundle builder's rule 9 and 10 checks, imported, so lint and bundle agree).
      - name: Docs images
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python tools/docs/check_images.py

      # AA-893: every alarm in the generated catalog (docs/generated/alarms.md) links to a runbook that exists here.
      - name: Alarm runbook links
        if: ${{ !cancelled() }}
        run: python tools/docs/check_alarm_runbooks.py

      # AA-1042: every stage, model and connection key the AI gateway guide (docs/architecture/ai-gateway.md and its
      # .vi.md, rendered by the CIS admin Guide tab) names exists in the committed route snapshot
      # (docs/generated/llm-routes.snapshot.json), and every secret name it names has a secrets-register row. Names only.
      - name: AI gateway guide names
        if: ${{ !cancelled() }}
        run: python tools/docs/check_ai_gateway_names.py

      # AA-1003 R1: the report registry (docs/reports/catalog.yaml + kpis.yaml): shape, KPI references, template
      # paths, and every KPI source table against docs/architecture/db-schema-reference.md.
      - name: Report registry
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python tools/docs/report_registry.py check

      - name: Literal resource IDs (warn-only)
        if: ${{ !cancelled() }}
        run: python tools/docs/check_docs_text.py resource-ids --mode warn

      # Failing since the existing pages were cleaned up (AA-888, S245). The scope (what is ignored and why) and the
      # rule settings are in .markdownlint-cli2.jsonc; the action pins markdownlint-cli2 0.23.2.
      - name: Markdown style
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: docs/**/*.md

      # S273: the local action runs what lycheeverse/lychee-action v2.9.0 ran (lychee v0.24.2, same args and report),
      # with the binary from actions/cache (pinned sha256, .github/actions/lychee/pins.txt) instead of a one-shot
      # download from github.com on every run.
      - name: Internal links (offline)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/lychee
        with:
          # docs/linear-export holds generated copies of Linear issues; their links are Linear's own markdown (S245).
          args: --config tools/docs/lychee.toml --exclude-path docs/linear-export 'docs/**/*.md'
          fail: true
          jobSummary: true

  # S273: actions/cache entries saved on the default branch are the only ones every pull request and merge-queue run
  # can read, and the Docs lint job runs on pull requests only. This job restores or downloads the pinned lychee binary
  # on master (push of a new pin, the weekly schedule, a manual run) and saves it; it runs no check.
  lychee-cache:
    name: Lychee cache (default branch)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore or fetch lychee
        uses: ./.github/actions/lychee
        with:
          install-only: "true"

  freshness:
    name: Docs freshness report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # S273 (workflow_lint WL4): restore on every ref; only the default branch saves this cache
      # (a pull request or merge-queue copy is readable only by that ref).
      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('tools/docs/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-

      - name: Install lint dependencies
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      - name: Save pip cache
        if: github.ref == 'refs/heads/master' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: Build the freshness report (warn-only)
        run: |
          python tools/docs/check_frontmatter.py --freshness-report freshness/freshness.md
          cat freshness/freshness.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: docs-freshness
          path: freshness/freshness.md
          # ADR 0021 decision 4 (WL7): 14 days at most; the same report is in the run summary.
          retention-days: 14
