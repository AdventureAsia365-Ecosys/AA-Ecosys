name: ZAP baseline

# AA-1111 (S283): OWASP ZAP baseline scan of the Dev public entry points, on demand only.
#   - PASSIVE only: the pinned ZAP image runs zap-baseline.py (spider for 2 minutes, then passive rules on what it
#     saw). It sends no attack payload. Never swap in action-full-scan or action-api-scan here: an active scan of Dev
#     needs the tech lead's go-ahead and its own workflow.
#   - Monthly schedule (S294, the AA-1166 self-assessment plan asks for a monthly passive DAST run) plus
#     workflow_dispatch for an extra run. No push or pull_request trigger. A scheduled run is triaged like a
#     dispatched one (docs/security/vulnerability-management.md, "Dynamic scan"); its artifacts last 7 days, so
#     the triage happens in the first session after the 3rd of the month.
#   - No GitHub issue is created and a finding never fails the job (zap-baseline.py exit 1 = FAIL alerts, 2 = WARN
#     alerts are both accepted): the reports are triaged by a person (docs/security/vulnerability-management.md,
#     "Dynamic scan"). Exit 3 or more (ZAP could not run) fails the job.
#   - Reports: one artifact per target, zap-<id> (report_json.json, report_html.html, report_md.md), kept 7 days,
#     uploaded once. S294: zap-baseline.py runs straight from the pinned image instead of zaproxy/action-baseline.
#     The action always uploaded its own copy under the same name with the repository default retention, and the
#     overwrite of that copy failed with HTTP 409 on 25/11 (6 of 7 targets red); one upload is simpler and keeps
#     the 7-day limit this public repo needs.
#   - Triage: gh run download <run id> -D <dir>, then python3 tools/security/zap_summary.py <dir>.
# The ZAP image is pinned by digest (ZAP_IMAGE). tools/github/pin_freshness.py (weekly CI hygiene) reports a newer
# ZAP release; move the tag and the digest together.
# Public repo: the job log (ZAP's own WARN/FAIL lines) is public and the artifacts can be downloaded by any signed-in
# GitHub user until they expire, so nothing more is written to the run summary. A passive baseline only reports what
# any visitor of these public hosts can see (response headers, cookies, page content); the triage record in
# docs/audits keeps the alert, risk and decision, never a reproduction recipe for an open finding.
# Cost: $0 (public repo, standard runner); about 4 minutes per target, two targets at a time.
#

on:
  schedule:
    - cron: "29 5 3 * *"   # the 3rd of each month, 05:29 UTC (12:29 in Vietnam), off the :00 / :15 marks
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline
  cancel-in-progress: false

jobs:
  scan:
    # A fixed word before the matrix value (S273, root #642: a bare matrix job name could clash with a required check).
    name: ZAP baseline ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: cis-admin
            target: https://aa-cis.lumiguides.it.com
          - id: cis-api-health
            target: https://api-cis.lumiguides.it.com/health
          - id: booking-admin
            target: https://booking.lumiguides.it.com
          - id: booking-api-health
            target: https://api-booking.lumiguides.it.com/booking/health
          - id: crm-portal
            target: https://portal.lumiguides.it.com
          - id: tripplanner
            target: https://tripplanner.lumiguides.it.com
          - id: tripplanner-plan
            target: https://tripplanner.lumiguides.it.com/pilot-rehearsal-01/plan

    steps:
      - name: ZAP baseline scan (passive)
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          TARGET: ${{ matrix.target }}
        run: |
          set -uo pipefail
          # The image runs as the zap user, which must be able to write the reports into the mounted folder.
          mkdir -p "$RUNNER_TEMP/zap" && chmod a+rwx "$RUNNER_TEMP/zap"
          # The step shell runs with -e: capture the exit code instead of letting a WARN (2) or FAIL (1) end the step.
          rc=0
          docker run --rm -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET" -m 2 -J report_json.json -w report_md.md -r report_html.html || rc=$?
          echo "zap-baseline.py exit $rc (0 clean, 1 FAIL alerts, 2 WARN alerts: triaged by a person)"
          if [ "$rc" -ge 3 ]; then echo "::error title=ZAP baseline::ZAP did not complete (exit $rc)"; exit 1; fi
          cp "$RUNNER_TEMP"/zap/report_json.json "$RUNNER_TEMP"/zap/report_html.html "$RUNNER_TEMP"/zap/report_md.md .

      - name: Reports (7 days)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-${{ matrix.id }}
          path: |
            report_json.json
            report_html.html
            report_md.md
          if-no-files-found: warn
          # ADR 0021 decision 4 (WL7): short retention; the only copy of the reports.
          retention-days: 7

