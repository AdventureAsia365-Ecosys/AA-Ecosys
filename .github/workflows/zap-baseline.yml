name: ZAP baseline

# AA-1111 (S283): OWASP ZAP baseline scan of the Dev public entry points, on demand only.
#   - PASSIVE only: zaproxy/action-baseline runs zap-baseline.py (spider for 2 minutes, then passive rules on what it
#     saw). It sends no attack payload. Never swap in action-full-scan or action-api-scan here: an active scan of Dev
#     needs the tech lead's go-ahead and its own workflow.
#   - workflow_dispatch only: no schedule, no push or pull_request trigger. Each run is a decision.
#   - No GitHub issue is created (allow_issue_writing: false) and a finding never fails the job (fail_action: false):
#     the reports are triaged by a person (docs/security/vulnerability-management.md, "Dynamic scan").
#   - Reports: one artifact per target, zap-<id> (report_json.json, report_html.html, report_md.md), kept 7 days.
#     The action uploads its own copy with the repository default retention; the next step uploads the same files
#     under the same name with overwrite: true, which deletes that copy first (the runtime token does it, so the job
#     needs no actions: write).
#   - Triage: gh run download <run id> -D <dir>, then python3 tools/security/zap_summary.py <dir>.
# The ZAP image is pinned by digest (docker_name). tools/github/pin_freshness.py (weekly CI hygiene) reports a newer
# ZAP release; move the tag and the digest together.
# Public repo: the job log (ZAP's own WARN/FAIL lines) is public and the artifacts can be downloaded by any signed-in
# GitHub user until they expire, so nothing more is written to the run summary. A passive baseline only reports what
# any visitor of these public hosts can see (response headers, cookies, page content); the triage record in
# docs/audits keeps the alert, risk and decision, never a reproduction recipe for an open finding.
# Cost: $0 (public repo, standard runner); about 4 minutes per target, two targets at a time.
#
# The org Actions allow-list must include zaproxy/action-baseline (tools/github/actions-allowlist.txt; the org
# setting is the org owner's). Without it the run fails at "Set up job" with "not allowed".

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline
  cancel-in-progress: false

jobs:
  scan:
    # A fixed word before the matrix value (S273, root #642: a bare matrix job name could clash with a required check).
    name: ZAP baseline ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: cis-admin
            target: https://aa-cis.lumiguides.it.com
          - id: cis-api-health
            target: https://api-cis.lumiguides.it.com/health
          - id: booking-admin
            target: https://booking.lumiguides.it.com
          - id: booking-api-health
            target: https://api-booking.lumiguides.it.com/booking/health
          - id: crm-portal
            target: https://portal.lumiguides.it.com
          - id: tripplanner
            target: https://tripplanner.lumiguides.it.com
          - id: tripplanner-plan
            target: https://tripplanner.lumiguides.it.com/pilot-rehearsal-01/plan

    steps:
      - name: ZAP baseline scan (passive)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ matrix.target }}
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          cmd_options: "-m 2"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-${{ matrix.id }}

      - name: Reports (7 days)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-${{ matrix.id }}
          path: |
            report_json.json
            report_html.html
            report_md.md
          if-no-files-found: warn
          # ADR 0021 decision 4 (WL7): short retention; replaces the action's own copy (repository default retention).
          overwrite: true
          retention-days: 7

