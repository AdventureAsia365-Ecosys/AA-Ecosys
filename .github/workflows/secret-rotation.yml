name: Secret rotation

# AA-1183 part 2: the weekly secret rotation and expiry check (tools/security/rotation_check.py, policy
# tools/security/rotation_check.toml). It compares docs/security/secrets-register.yaml with the METADATA of the stores
# (never a secret value) and keeps one GitHub issue per finding in this repo, label `secret-rotation` (deduplicated by
# title, edited when a finding changes, closed when the row is green). docs/security/secrets-register.md, section
# "Weekly rotation check", explains the levels.
#
# Jobs (a pull request runs the unit tests only: no token, no AWS, no issue write):
#   1. test       unit tests of the register parser and the check (invented rows, recorded API shapes).
#   2. github     environment `ci-bot` (deployment branches: master only, no required reviewers; it holds
#                 AA_CI_BOT_PRIVATE_KEY, with the repo variable AA_CI_BOT_APP_ID): mints an aa-ecosys-ci-bot token
#                 with Secrets read + Environments read on the six repos, and lists secret NAMES and updated_at (the
#                 GitHub API never returns a value). The inventory goes to job 3 as a job output. Without the key, or
#                 when the App lacks those two read permissions, job 3 reports "check could not read github" (one
#                 RED issue) and goes on.
#   3. check      no environment (the OIDC subject stays ref:refs/heads/master): the compliance evidence role
#                 aa-cis-<env>-compliance-evidence (AA-CIS-Infra accounts/aa365/compliance_evidence.tf, trusted for
#                 THIS file on master through job_workflow_ref; read-only metadata calls: `rotation_check.py
#                 iam-actions` lists them), RDAP for domain expiry, then the issues with this run's GITHUB_TOKEN
#                 (issues: write). Scheduled runs apply; a manual run is a dry run unless `apply` is ticked.
#
# Outputs: the run summary (counts and findings), the issues, and the artifact rotation-due-<run id> (the JSON of every
# row's due date that the ops calendar reads; names and dates only, all already public in the register).
#
# Public repo: the tool refuses to print or write an account ID, an ARN, an S3 URI or an e-mail address
# (assert_publishable); AWS errors are redacted; no shell tracing; no pull_request_target.
# Cost: about a minute of Actions a week on a public repo ($0); a few hundred AWS read calls a week ($0).
on:
  schedule:
    - cron: "23 3 * * 1"   # weekly, Monday 03:23 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the issues (otherwise a dry run that prints the plan)"
        type: boolean
        default: false
  pull_request:
    branches: [master]
    paths:
      - "tools/security/rotation_check.py"
      - "tools/security/rotation_check.toml"
      - "tools/security/test_rotation_check.py"
      - "tools/security/secrets_register.py"
      - ".github/workflows/secret-rotation.yml"

permissions:
  contents: read

concurrency:
  group: secret-rotation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Rotation check unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned)
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      - name: Unit tests (no network, no AWS)
        run: python -m unittest tools/security/test_rotation_check.py tools/security/test_secrets_register.py

  github:
    name: GitHub secret metadata
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Holds AA_CI_BOT_PRIVATE_KEY; deployment branches limited to master (tools/security/ci_bot_key_consolidate.sh).
    environment: ci-bot
    permissions:
      contents: read
    outputs:
      inventory: ${{ steps.collect.outputs.inventory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned)
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      # Environment secrets are read in a step (as ci-hygiene.yml does), not in job-level env.
      - name: Is the App configured
        id: key
        env:
          APP_ID: ${{ vars.AA_CI_BOT_APP_ID }}
          HAS_KEY: ${{ secrets.AA_CI_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$APP_ID" ] && [ "$HAS_KEY" = true ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::environment ci-bot has no AA_CI_BOT_PRIVATE_KEY (or AA_CI_BOT_APP_ID is unset): GitHub secret dates are not checked this run"
          fi

      # Read-only: Secrets read + Environments read (names and updated_at; values are never returned by the API).
      - name: Mint the aa-ecosys-ci-bot token (six repos, secrets + environments read)
        id: app-token
        if: steps.key.outputs.has == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.AA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.AA_CI_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AA-Ecosys,AA-CIS-App,AA-Booking,AA-Partner,AA-TripPlanner-Web,AA-CIS-Infra
          permission-secrets: read
          permission-environments: read

      - name: List secret names and dates
        id: collect
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 tools/security/rotation_check.py collect-github --out "$RUNNER_TEMP/gh.json"
          echo "inventory=$(gzip -c "$RUNNER_TEMP/gh.json" | base64 -w0)" >> "$GITHUB_OUTPUT"

  check:
    name: Rotation and expiry check
    needs: [test, github]
    if: ${{ !cancelled() && needs.test.result == 'success' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write      # the secret-rotation issues of this repo
      id-token: write    # OIDC for the compliance evidence role (metadata reads)
    env:
      HAS_ROLE: ${{ secrets.COMPLIANCE_EVIDENCE_ROLE_ARN != '' }}
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
      INVENTORY: ${{ needs.github.outputs.inventory }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned)
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      - name: AWS credentials (OIDC, compliance evidence role)
        if: env.HAS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.COMPLIANCE_EVIDENCE_ROLE_ARN }}
          aws-region: us-west-1
          role-session-name: secret-rotation-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify the role
        if: env.HAS_ROLE == 'true'
        run: |
          set -euo pipefail
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          case "$ARN" in
            *:assumed-role/aa-cis-*-compliance-evidence/*) echo "role: compliance-evidence" ;;
            *) echo "::error::the rotation check must run with the compliance evidence role (got another role)"; exit 1 ;;
          esac

      - name: Check and sync the issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARGS=(--rdap --json-out _out/rotation-due.json --summary _out/summary.md --run-url "$RUN_URL")
          if [ -n "$INVENTORY" ]; then
            printf '%s' "$INVENTORY" | base64 -d | gunzip > "$RUNNER_TEMP/gh.json"
            ARGS+=(--github-inventory "$RUNNER_TEMP/gh.json")
          fi
          if [ "$HAS_ROLE" = "true" ]; then ARGS+=(--aws); else echo "::warning::COMPLIANCE_EVIDENCE_ROLE_ARN is not set: AWS rows are checked against the register dates only"; fi
          if [ "$APPLY" = "true" ]; then ARGS+=(--apply); fi
          python3 tools/security/rotation_check.py run "${ARGS[@]}"
          cat _out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the due dates for the ops calendar
        if: ${{ !cancelled() && hashFiles('_out/rotation-due.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rotation-due-${{ github.run_id }}
          path: _out/rotation-due.json
          retention-days: 14
