name: Compliance evidence

# AA-1170 (S287, phase 1): the daily evidence behind the CIS admin page Platform › Compliance (Evidenced % per
# framework). Root advisory docs/audits/2026-11-21-S287-compliance-tracking/README.md sections 4 C.4 / C.5 and 5;
# tech lead decisions S287 Q5, Q7 (this file), Q8 (the Object Lock store).
#
# Once a day tools/compliance/collect.py runs about ten checks that need no new permission: reads of the six public
# repos with this run's GITHUB_TOKEN (default-branch protection, CodeQL, scheduled guards green, the image scan + SBOM
# of the image repos, the full-history secret scan) and the registers of this repo (docs past their review date, the
# last passed drill, the last access review, vulnerability exceptions still valid), plus its own heartbeat. It builds
# ONE bundle.
#
# AA-1173 (phase 2): the bundle is SEALED into the Object Lock evidence bucket with tools/compliance/seal.py (source
# root_daily: a write-once bundle and a manifest that links the previous manifest, a hash chain), with the role
# aa-cis-<env>-compliance-evidence (AA-CIS-Infra accounts/aa365/compliance_evidence.tf, trusted for THIS file on master
# only through job_workflow_ref; secrets COMPLIANCE_EVIDENCE_ROLE_ARN and COMPLIANCE_EVIDENCE_BUCKET). The CIS API
# reads the sealed bundle (AA-CIS-App api/services/compliance_store.py) into compliance.evidence.
# S294: the phase 1 copy under docs-reader/compliance/ (written with the Docs sync role, mutable: readiness tracking,
# not evidence) is no longer uploaded: the sealed path was proven live on 24/11/2026 (this workflow's run 45364700766
# and the Infra run 45364721985 sealed their bundles, the bucket refused delete and overwrite attempts, the CIS page
# read both sealed sources; docs/audits/2026-11-24-S290-session/live/aa-1173/evidence.md). The seal is the only
# output: a failed seal fails the run, and on master missing seal secrets fail it too (no evidence would be written).
#
# Run order: collect -> credentials -> role check -> seal. Each step stops the run on failure.
#
# Public repo (section 4 C.5): this log prints counts only, never raw API output; the collector refuses to write a file
# that carries an account ID, an ARN, an S3 URI or an e-mail address; no shell tracing, no artifact, no
# pull_request_target (tools/compliance/test_collect.py checks this file). On a pull request only the unit tests run
# (no AWS, no reads).
#
# Cost: under a minute of Actions a day on a public repo ($0); a few S3 PUT a day and a few kB.
on:
  schedule:
    - cron: "41 2 * * *"   # daily 02:41 UTC; the CIS heartbeat window (cis.compliance.collector_heartbeat_hours) is longer
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "tools/compliance/**"
      - ".github/workflows/compliance-evidence.yml"

permissions:
  contents: read

concurrency:
  group: compliance-evidence-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Compliance collector unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests (invented GitHub answers and pages; no network)
        run: python3 -m unittest discover -s tools/compliance -p 'test_*.py'

  collect:
    name: Collect and publish
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read      # workflow runs and jobs of the six public repos
      id-token: write    # OIDC for the compliance evidence role
    env:
      OUT: _out/evidence.json
      HAS_EVIDENCE: ${{ secrets.COMPLIANCE_EVIDENCE_ROLE_ARN != '' && secrets.COMPLIANCE_EVIDENCE_BUCKET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect (counts only in this log)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/compliance/collect.py --out "$OUT" > _counts.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          counts = json.load(open("_counts.json", encoding="utf-8"))
          bundle = json.load(open("_out/evidence.json", encoding="utf-8"))
          print("### Compliance evidence")
          print(f"- {counts['checks']} checks: " + ", ".join(f"{k} {v}" for k, v in sorted(counts["by_status"].items())))
          print("")
          print("| Check | Status |")
          print("|---|---|")
          for c in bundle["checks"]:
              print(f"| {c['check_id']} | {c['status']} |")
          PY

      - name: Seal not configured
        if: env.HAS_EVIDENCE != 'true'
        run: |
          echo "::error title=Compliance evidence::COMPLIANCE_EVIDENCE_ROLE_ARN / COMPLIANCE_EVIDENCE_BUCKET are not set; nothing sealed, so no evidence was written."
          exit 1

      - name: AWS credentials (OIDC, compliance evidence role)
        if: env.HAS_EVIDENCE == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.COMPLIANCE_EVIDENCE_ROLE_ARN }}
          aws-region: us-west-1
          role-session-name: compliance-seal-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify the role
        if: env.HAS_EVIDENCE == 'true'
        run: |
          set -euo pipefail
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          case "$ARN" in
            *:assumed-role/aa-cis-*-compliance-evidence/*) echo "role: compliance-evidence" ;;
            *) echo "::error::the seal must run with the compliance evidence role (got another role)"; exit 1 ;;
          esac

      - name: Seal into the evidence bucket (write-once, hash chain)
        if: env.HAS_EVIDENCE == 'true'
        env:
          BUCKET: ${{ secrets.COMPLIANCE_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          python3 tools/compliance/seal.py --bucket "$BUCKET" --source root_daily --bundle "$OUT" \
            --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --run-ref "compliance-evidence #$GITHUB_RUN_NUMBER" \
            --version "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sealed: root_daily" >> "$GITHUB_STEP_SUMMARY"
