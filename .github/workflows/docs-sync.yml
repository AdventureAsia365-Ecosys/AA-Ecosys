name: Docs sync
# AA-898: publish the docs catalog to the CIS admin reader (/admin/docs, Platform > Developer > Docs).
#
# On a clean checkout of this repo (tracked files only, never a laptop) tools/docs/build_docs_reader.py builds
# manifest.json + one redacted Markdown file per published page (publication rule v1 in the script header and in
# docs/README.md "Docs reader": catalog pages and ADRs only; journals, audits, docs/security/ and templates never;
# account / VPC / user-pool / API Gateway IDs redacted; a guard fails the build when one is left). Then, on master only:
#
#   s3://<bronze>/docs-reader/pages/...      aws s3 sync (new and changed pages first)
#   s3://<bronze>/docs-reader/assets/...     aws s3 sync, one pass per image type (AA-697 rule 9: checked SVG diagrams;
#                                            AA-1064 rule 10: PNG / WebP screenshots a published page links, <= 300 KB)
#   s3://<bronze>/docs-reader/catalogue.json aws s3 cp (AA-1106: the product catalogue bundle of
#                                            tools/catalogue/catalogue.py, read by CIS admin Platform > Product map)
#   s3://<bronze>/docs-reader/manifest.json  aws s3 cp (after pages and assets, so it never lists one not uploaded yet)
#   s3://<bronze>/docs-reader/{pages,assets}/... aws s3 sync --delete (objects dropped from the manifest go last)
#
# The CIS api reads those objects (cached 5 min), so a merged docs change shows up within minutes, with no Vercel or
# ECS deploy. On a pull request the job only builds and checks (no AWS, no secret).
#
# AWS: role aa-cis-dev-docs-sync (AA-CIS-Infra accounts/aa365/docs_reader.tf; trusted only by this repo on
# refs/heads/master; ListBucket + Put/Delete on docs-reader/ only). Repo secrets (secrets, not variables: this repo is
# public for now and a variable is printed in the log): DOCS_SYNC_ROLE_ARN (Terraform output docs_sync_role_arn) and
# DOCS_SYNC_BUCKET (the bronze bucket name). Until both exist the sync step is skipped with a notice, not failed.
#
# AA Academy learn bundle (AA-1104, GUIDE-13, format in docs/learn/README.md): after the pages are uploaded,
# tools/docs/build_learn_bundle.py builds a second, separate output (_site/learn): the learn manifest, the lesson bodies,
# the redacted text of every section a lesson cites (with its hash; a changed section marks the lesson stale and
# suspends the quiz items that cite it) and one quiz file per module (answers, read server side only). The app and
# Infra repos' CONTEXT.md files a lesson may cite (allowlist only) are checked out read-only under _ext/<repo>. Upload:
#
#   s3://<bronze>/docs-reader/learn/{lessons,sections}/...  aws s3 sync (Markdown), then quizzes/ (JSON)
#   s3://<bronze>/docs-reader/learn/manifest.json           aws s3 cp, after the objects it lists
#   the same prefixes again with --delete                    objects the manifest dropped go last
#
# The learn steps never block the pages: they run after the pages upload, a failed learn build uploads nothing for
# learn (the previous learn bundle stays), and only the last step turns the run red so the failure is seen. The same
# role covers it (Put / Delete on docs-reader/*).
#
# Cost: about 1 minute of Actions per docs merge; S3 < $0.10/month (docs_reader.tf header).
on:
  push:
    branches: [master]
    paths:
      - "tools/catalogue/catalogue.py"
      - "tools/uat/catalogue.json"
      - "docs/**"
      - "tools/docs/build_docs_reader.py"
      - "tools/docs/docslib.py"
      - "tools/docs/check_docs_text.py"
      - "tools/docs/check_adr_index.py"
      - "tools/docs/requirements.txt"
      - "tools/docs/check_learn.py"
      - "tools/docs/build_learn_bundle.py"
      - ".github/workflows/docs-sync.yml"
  pull_request:
    branches: [master]
    paths:
      - "tools/catalogue/catalogue.py"
      - "tools/uat/catalogue.json"
      - "tools/docs/build_docs_reader.py"
      - "tools/docs/test_docs_reader.py"
      - "tools/docs/docslib.py"
      - "tools/docs/check_docs_text.py"
      - "tools/docs/check_adr_index.py"
      - "tools/docs/requirements.txt"
      - "tools/docs/check_learn.py"
      - "tools/docs/build_learn_bundle.py"
      - "tools/docs/test_learn_bundle.py"
      - "docs/learn/**"
      - ".github/workflows/docs-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Docs sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      OUT: _site/docs-reader
      LEARN: _site/learn
      PREFIX: docs-reader
      HAS_AWS: ${{ secrets.DOCS_SYNC_ROLE_ARN != '' && secrets.DOCS_SYNC_BUCKET != '' }}
      IS_MASTER: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # S273 (workflow_lint WL4): restore on every ref; only the default branch saves this cache
      # (a pull request or merge-queue copy is readable only by that ref).
      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('tools/docs/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-

      - name: Install dependencies
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      - name: Save pip cache
        if: github.ref == 'refs/heads/master' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: Unit tests of the bundle builder
        run: python -m unittest tools/docs/test_docs_reader.py

      - name: Build the reader bundle (redaction guard included)
        run: python tools/docs/build_docs_reader.py --out "$OUT" --sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME"

      # AA-1106: the product catalogue bundle. The guard runs first: a failing catalogue publishes no new
      # catalogue.json (CIS keeps serving the last one) but never blocks the docs pages.
      - name: Build the product catalogue bundle
        id: catalogue
        continue-on-error: true
        run: python tools/catalogue/catalogue.py bundle --out "$OUT" --sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME"

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          m = json.load(open(os.path.join(os.environ["OUT"], "manifest.json"), encoding="utf-8"))
          c = m["counts"]
          print("### Docs reader bundle")
          print(f"- {c['published']} pages published ({c['owner_only']} owner only), {c['skipped']} not published")
          print(f"- {sum(p['redactions'] for p in m['pages'])} values redacted")
          print(f"- {c.get('assets', 0)} image assets ({c.get('screenshots', 0)} screenshots, rule 10; the rest SVG, rule 9)")
          print(f"- source `{m['source']['sha'][:12]}`")
          PY

      - name: Sync skipped
        if: env.IS_MASTER == 'true' && env.HAS_AWS != 'true'
        run: echo "::notice title=Docs sync::DOCS_SYNC_ROLE_ARN / DOCS_SYNC_BUCKET are not set yet; bundle built, nothing uploaded."

      - name: AWS credentials (OIDC)
        if: env.IS_MASTER == 'true' && env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DOCS_SYNC_ROLE_ARN }}
          aws-region: us-west-1
          role-session-name: docs-sync-${{ github.run_id }}

      - name: Upload to S3
        if: env.IS_MASTER == 'true' && env.HAS_AWS == 'true'
        env:
          BUCKET: ${{ secrets.DOCS_SYNC_BUCKET }}
        run: |
          set -euo pipefail
          dest="s3://${BUCKET}/${PREFIX}"
          # Only this repo's subtree: --delete never reaches pages/<other repo>/ if a second source is added later.
          src_pages="$OUT/pages/AA-Ecosys"
          dest_pages="$dest/pages/AA-Ecosys"
          # AA-697 rule 9: SVG diagrams, already checked by the builder (no script, no outside reference, no ID).
          # AA-1064 rule 10: PNG / WebP screenshots a published page links (signature, <= 300 KB, no ID in metadata).
          # One sync per type so each object gets its own Content-Type. The folder exists even with no image so
          # --delete can empty the prefix.
          src_assets="$OUT/assets/AA-Ecosys"
          dest_assets="$dest/assets/AA-Ecosys"
          mkdir -p "$src_assets"
          aws s3 sync "$src_pages" "$dest_pages" --only-show-errors --content-type "text/markdown; charset=utf-8"
          aws s3 sync "$src_assets" "$dest_assets" --only-show-errors --exclude "*" --include "*.svg" --content-type "image/svg+xml"
          aws s3 sync "$src_assets" "$dest_assets" --only-show-errors --exclude "*" --include "*.png" --content-type "image/png"
          aws s3 sync "$src_assets" "$dest_assets" --only-show-errors --exclude "*" --include "*.webp" --content-type "image/webp"
          if [ -f "$OUT/catalogue.json" ]; then
            aws s3 cp "$OUT/catalogue.json" "$dest/catalogue.json" --only-show-errors --content-type "application/json"
          else
            echo "::warning title=Docs sync::the product catalogue did not build (see the step log); catalogue.json not updated"
          fi
          aws s3 cp "$OUT/manifest.json" "$dest/manifest.json" --only-show-errors --content-type "application/json"
          aws s3 sync "$src_pages" "$dest_pages" --only-show-errors --delete --content-type "text/markdown; charset=utf-8"
          aws s3 sync "$src_assets" "$dest_assets" --only-show-errors --delete --exclude "*" --include "*.svg" --content-type "image/svg+xml"
          aws s3 sync "$src_assets" "$dest_assets" --only-show-errors --delete --exclude "*" --include "*.png" --content-type "image/png"
          aws s3 sync "$src_assets" "$dest_assets" --only-show-errors --delete --exclude "*" --include "*.webp" --content-type "image/webp"
          echo "uploaded $(find "$OUT/pages" -type f | wc -l) pages, $(find "$src_assets" -type f | wc -l) image assets, the product catalogue and the manifest" >> "$GITHUB_STEP_SUMMARY"

      # AA-1104: the CONTEXT.md of each app and Infra repo (public), the only file of theirs a lesson may cite (through
      # docs/learn/allowlist.yaml). Sparse, read-only, no credentials kept. A failed checkout only marks the lessons
      # that cite it stale.
      - name: CONTEXT.md of AA-CIS-App (learn sources)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdventureAsia365-Ecosys/AA-CIS-App
          path: _ext/AA-CIS-App
          sparse-checkout: /CONTEXT.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: CONTEXT.md of AA-Booking (learn sources)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdventureAsia365-Ecosys/AA-Booking
          path: _ext/AA-Booking
          sparse-checkout: /CONTEXT.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: CONTEXT.md of AA-TripPlanner-Web (learn sources)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdventureAsia365-Ecosys/AA-TripPlanner-Web
          path: _ext/AA-TripPlanner-Web
          sparse-checkout: /CONTEXT.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: CONTEXT.md of AA-Partner (learn sources)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdventureAsia365-Ecosys/AA-Partner
          path: _ext/AA-Partner
          sparse-checkout: /CONTEXT.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: CONTEXT.md of AA-CIS-Infra (learn sources)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdventureAsia365-Ecosys/AA-CIS-Infra
          path: _ext/AA-CIS-Infra
          sparse-checkout: /CONTEXT.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build the learn bundle (AA Academy)
        id: learn
        continue-on-error: true
        run: python tools/docs/build_learn_bundle.py --out "$LEARN" --ext-root _ext --sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME"

      - name: Learn summary
        if: steps.learn.outcome == 'success'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          m = json.load(open(os.path.join(os.environ["LEARN"], "manifest.json"), encoding="utf-8"))
          c = m["counts"]
          print("### Learn bundle")
          print(f"- {c['paths']} paths, {c['modules']} modules, {c['lessons']} lessons, {c['quiz_items']} quiz items")
          print(f"- {c['sections']} cited sections; {c['stale_lessons']} stale lessons, {c['suspended_items']} suspended quiz items")
          PY

      - name: Upload the learn bundle to S3
        if: env.IS_MASTER == 'true' && env.HAS_AWS == 'true' && steps.learn.outcome == 'success'
        env:
          BUCKET: ${{ secrets.DOCS_SYNC_BUCKET }}
        run: |
          set -euo pipefail
          dest="s3://${BUCKET}/${PREFIX}/learn"
          mkdir -p "$LEARN/quizzes"
          aws s3 sync "$LEARN" "$dest" --only-show-errors --exclude "*" --include "*.md" --content-type "text/markdown; charset=utf-8"
          aws s3 sync "$LEARN/quizzes" "$dest/quizzes" --only-show-errors --content-type "application/json"
          aws s3 cp "$LEARN/manifest.json" "$dest/manifest.json" --only-show-errors --content-type "application/json"
          aws s3 sync "$LEARN" "$dest" --only-show-errors --delete --exclude "*" --include "*.md" --content-type "text/markdown; charset=utf-8"
          aws s3 sync "$LEARN/quizzes" "$dest/quizzes" --only-show-errors --delete --content-type "application/json"
          echo "uploaded the learn bundle: $(find "$LEARN" -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"

      # The pages are already uploaded above; this only makes a broken course visible as a red run.
      - name: Learn bundle failed
        if: steps.learn.outcome == 'failure'
        run: |
          echo "::error title=Learn bundle::the learn bundle was not built; the docs pages were published. See the step 'Build the learn bundle'."
          exit 1
