name: Delivery metrics

# AA-1108 (S282): the CI/CD and DORA numbers per app behind the CIS admin page Platform › Delivery and the reports
# DEV-01 (monthly delivery and DORA) and DEV-03 (weekly engineering flow). Definitions: docs/guides/delivery-metrics.md.
#
# Every hour tools/delivery/delivery_metrics.py reads the six public repos with this run's GITHUB_TOKEN (no new
# secret; reads of public repos, at most `request_budget` requests a run, tools/delivery/apps.json): workflow runs,
# their jobs (every attempt), merged pull requests and the GitHub Deployments of the environment dev. It keeps the
# normalised events (OpenTelemetry CI/CD and VCS field names) in an Actions cache saved on master only (one entry: the
# previous one is deleted after the new one is saved), computes one summary per app and uploads, on master only:
#
#   s3://<bronze>/docs-reader/delivery/events/<yyyy>/<mm>/<dd>.ndjson   the raw events of each day it changed
#   s3://<bronze>/docs-reader/delivery/summary.json                     after the events (CIS reads it, cached 5 min)
#
# Raw event files are kept 400 days (apps.json raw_retention_days): this run deletes older day files itself; the
# bucket expires noncurrent docs-reader/ versions after 7 days (AA-CIS-Infra accounts/aa365/docs_reader.tf).
#
# AWS: the Docs sync role (secret DOCS_SYNC_ROLE_ARN, trusted only by this repo on refs/heads/master; ListBucket on
# docs-reader/ and Put / Delete on docs-reader/*), bucket secret DOCS_SYNC_BUCKET: the same path as Docs sync, nothing
# new in Terraform. Without the two secrets the upload is skipped with a notice. On a pull request only the unit tests
# run (no AWS, no GitHub reads).
#
# Cost: about 1-2 minutes of Actions an hour on a public repo ($0); S3 a few hundred PUT a day and a few MB (< $0.05 a
# month); GitHub reads count against this repo's GITHUB_TOKEN rate limit (1,000 an hour), not against a person.
on:
  schedule:
    - cron: "17 * * * *"   # hourly (tech lead S282); re-saved S282 close: the first cron never fired (AA-1108). The CIS page re-reads the published file on its Refresh button
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "tools/delivery/**"
      - ".github/workflows/delivery-metrics.yml"

permissions:
  contents: read

concurrency:
  group: delivery-metrics-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Delivery metrics unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests (recorded, invented GitHub answers; no network)
        run: python3 -m unittest discover -s tools/delivery -p 'test_*.py'

  collect:
    name: Collect and publish
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write     # delete the previous event-store cache entry of this workflow
      id-token: write    # OIDC for the Docs sync role
    env:
      STORE: _store
      OUT: _out
      PREFIX: docs-reader/delivery
      HAS_AWS: ${{ secrets.DOCS_SYNC_ROLE_ARN != '' && secrets.DOCS_SYNC_BUCKET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the event store
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _store
          key: delivery-store-${{ github.run_id }}
          restore-keys: delivery-store-

      - name: Collect from GitHub and compute the summary
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/delivery/delivery_metrics.py collect --store "$STORE" --out "$OUT" > _collect.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("_collect.json", encoding="utf-8"))
          s = json.load(open("_out/summary.json", encoding="utf-8"))
          print("### Delivery metrics")
          print(f"- {r['requests']} GitHub requests, {r['events']} events in the store, {r['day_files']} day files")
          if r["stopped"]:
              print(f"- stopped early (budget): {r['stopped']}")
          for e in r["errors"]:
              print(f"- read error: {e}")
          print("")
          print("| App | Deploys | Lead time p50 (h) | CFR | Recovery p50 (h) | Main | History from |")
          print("|---|---|---|---|---|---|---|")
          for a in s["apps"]:
              d = a["dora"]
              print(f"| {a['name']} | {d['deployment_frequency']['n']} | {d['lead_time']['p50_h']} "
                    f"(n {d['lead_time']['n']}) | {d['change_failure_rate']['value']} | "
                    f"{d['recovery_time']['p50_h']} | {a['ci']['main']['state']} | {a['complete_since']} |")
          PY

      - name: Save the event store
        id: save
        if: github.ref == 'refs/heads/master' && steps.collect.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _store
          key: delivery-store-${{ github.run_id }}-${{ github.run_attempt }}

      # One store entry at a time: GitHub keeps 10 GB of caches per repo (root ADR 0021 decision 5).
      - name: Delete the previous store entry
        if: steps.save.outcome == 'success' && steps.restore.outputs.cache-matched-key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          gh cache delete "$OLD_KEY" --repo "$GITHUB_REPOSITORY" \
            || echo "::notice title=Delivery metrics::previous store entry $OLD_KEY not deleted (already gone?)"

      - name: Upload skipped
        if: env.HAS_AWS != 'true'
        run: echo "::notice title=Delivery metrics::DOCS_SYNC_ROLE_ARN / DOCS_SYNC_BUCKET are not set; summary built, nothing uploaded."

      - name: AWS credentials (OIDC)
        if: env.HAS_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DOCS_SYNC_ROLE_ARN }}
          aws-region: us-west-1
          role-session-name: delivery-metrics-${{ github.run_id }}

      - name: Upload the events, then the summary
        if: env.HAS_AWS == 'true'
        env:
          BUCKET: ${{ secrets.DOCS_SYNC_BUCKET }}
        run: |
          set -euo pipefail
          dest="s3://${BUCKET}/${PREFIX}"
          mkdir -p "$OUT/events"
          aws s3 sync "$OUT/events" "$dest/events" --only-show-errors --content-type "application/x-ndjson; charset=utf-8"
          aws s3 cp "$OUT/summary.json" "$dest/summary.json" --only-show-errors --content-type "application/json"
          echo "uploaded $(find "$OUT/events" -type f | wc -l) day files and the summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete event files past the retention
        if: env.HAS_AWS == 'true'
        env:
          BUCKET: ${{ secrets.DOCS_SYNC_BUCKET }}
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PREFIX/events/" --query 'Contents[].Key' \
            --output text > _keys.raw
          tr '\t' '\n' < _keys.raw | grep -v '^None$' > _keys.txt || true
          python3 tools/delivery/delivery_metrics.py expired --keys _keys.txt > _expired.txt
          n=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            aws s3 rm "s3://${BUCKET}/${key}" --only-show-errors
            n=$((n + 1))
          done < _expired.txt
          echo "deleted $n event files past the retention" >> "$GITHUB_STEP_SUMMARY"
